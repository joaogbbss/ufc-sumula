<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Súmula UFC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpolygon points='12,1 28,1 39,12 39,28 28,39 12,39 1,28 1,12' fill='%23090a0d' stroke='%23f5c518' stroke-width='3'/%3E%3Cpolygon points='14,9 26,9 31,14 31,26 26,31 14,31 9,26 9,14' fill='%23f5c518'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=Big+Shoulders+Display:wght@600..900&display=swap">
<style>
:root{color-scheme:dark;--bg:#090a0d;--s1:#13151a;--s2:#1b1e25;--ln:#2a2e38;--tx:#eef1f6;--mu:#8b94a5;--gd:#f5c518;--cb:#6c8cff;--win:#34d399;--loss:#ff4d5e;
--oct:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
--ch:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));
--d:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:400 16px/1.45 Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums;
background:radial-gradient(60% 320px at 50% 0,color-mix(in srgb,var(--gd) 14%,transparent),transparent),linear-gradient(45deg,#ffffff09 1px,transparent 1px) 0 0/28px 28px,linear-gradient(-45deg,#ffffff09 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;max-width:980px;margin:auto;padding:.9rem clamp(1rem,4vw,2rem)}
.brand{display:flex;align-items:center;gap:.6rem;margin-right:auto;font:900 1.7rem var(--d);letter-spacing:.07em}
.brand svg{width:1.9rem}.brand em{font-style:normal;color:var(--gd)}
nav{position:fixed;inset:auto 0 0;display:flex;z-index:9;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:.85rem 0;font:700 1.1rem var(--d);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
nav a.on{color:var(--gd);box-shadow:inset 0 3px var(--gd)}
main{max-width:980px;margin:auto;padding:0 clamp(1rem,4vw,2rem) 2rem}
h1{font:900 clamp(2.4rem,9vw,4.2rem)/.95 var(--d);text-transform:uppercase;margin:.8rem 0 1.5rem;text-wrap:balance}
h1::after{content:"";display:block;width:4.5rem;height:7px;margin-top:.7rem;background:repeating-linear-gradient(-45deg,var(--gd) 0 6px,#000 6px 12px)}
h2{font:800 1.5rem var(--d);letter-spacing:.05em;text-transform:uppercase;margin:1.8rem 0 .6rem;color:var(--gd)}
.mu{color:var(--mu)}.sm{font-size:.85rem}
input,select,textarea{width:100%;padding:.7rem .85rem;border:0;box-shadow:inset 0 0 0 1px var(--ln);background:var(--s1);color:var(--tx);font:inherit;clip-path:var(--ch)}
textarea{min-height:4.5rem}
button,.btn{display:inline-block;font:700 .85rem Archivo,sans-serif;cursor:pointer;border:0;background:var(--s2);color:var(--tx);padding:.45rem .9rem;clip-path:var(--ch)}
button:hover,.btn:hover{background:color-mix(in srgb,var(--gd) 22%,var(--s2))}
.lg{margin-left:.6rem;font:800 .95rem var(--d);letter-spacing:.08em}
.card{background:linear-gradient(180deg,var(--s1),color-mix(in srgb,var(--s1) 75%,var(--bg)));clip-path:var(--ch);box-shadow:inset 0 0 0 1px var(--ln);margin-bottom:.7rem}
.ring{position:relative;flex:none;width:2.7rem;aspect-ratio:1;clip-path:var(--oct);background:var(--rc,var(--ln))}
.ring>span{position:absolute;inset:2px;clip-path:var(--oct);background:var(--s1);display:grid;place-items:center;font:800 1.15rem var(--d)}
.ring.sm{width:2.2rem}.ring.sm>span{font-size:.9rem}
.ring.big{width:5.5rem;--rc:var(--gd)}.ring.big>span{inset:3px;font-size:2rem}
.ev{display:grid;grid-template-columns:3.6rem 1fr;gap:0 1rem;padding:.9rem 1.1rem}
.day{grid-row:span 2;font:900 2.6rem/1 var(--d);color:var(--gd);text-align:center}
.en{font-weight:700}
.fight{container-type:inline-size;padding:1rem 1.1rem}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:center}
.fa{font:800 1.3rem/1.1 var(--d);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.fa.w{color:var(--tx)}.fa.l{color:var(--mu)}.fa:last-child{text-align:right}
.fa.w::before{content:"W ";color:var(--win)}
html[lang^=pt] .fa.w::before{content:"V "}
.fi{display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:center;margin-top:.7rem;font-size:.85rem;color:var(--mu)}
.fi button{margin-left:auto}
.tag{color:#000;background:var(--gd);padding:0 .5rem;font-weight:800;clip-path:var(--ch)}
@container (min-width:560px){.fa{font-size:1.7rem}}
.hl{box-shadow:inset 0 0 0 2px var(--gd)}
.st{display:none;padding-top:.8rem}.open .st{display:block}
.sr{display:grid;grid-template-columns:1fr auto 1fr;gap:.15rem .7rem;font-size:.9rem;padding:.3rem 0}
.sr .lb{color:var(--mu);text-align:center}.sr span:last-of-type{text-align:right}
.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.bar i{display:block;height:5px;width:var(--w);background:var(--c)}.bar i:first-child{justify-self:end}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1rem}
.ctl label{display:grid;gap:.25rem;font-size:.8rem;color:var(--mu)}
.rk{display:grid;grid-template-columns:2.7rem 1fr auto;align-items:center;gap:.9rem;padding:.7rem 1rem}
.rk:nth-child(-n+3){--rc:#aab3c2}.rk:first-child{--rc:var(--gd)}
.nm{font-weight:700}.nm small{display:block;font-weight:400;color:var(--mu)}
.mb{display:block;height:3px;margin-top:.4rem;background:var(--ln)}.mb b{display:block;height:100%;background:var(--gd)}
.rt{font:900 1.9rem/1 var(--d);text-align:right}.rt small{display:block;font:400 .75rem Archivo;color:var(--mu)}
details{padding:1rem 1.1rem}summary{cursor:pointer;font:800 1.2rem var(--d);letter-spacing:.05em;text-transform:uppercase}
details p,details li{font-size:.9rem;color:var(--mu)}details b{color:var(--tx)}
.hero{display:flex;gap:1.2rem;align-items:center;margin:.8rem 0 1.2rem}.hero h1{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.sp{width:100%;height:130px;display:block}
.bio{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem 1rem;margin:0;padding:1rem 1.1rem}
.bio dt{font-size:.75rem;color:var(--mu)}.bio dd{margin:0;font-weight:700}
.h{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--ln);font-size:.92rem}
.up{color:var(--win)}.dn{color:var(--loss)}
.sel{display:flex;align-items:center;gap:.7rem}.sel button{margin-left:auto}
.res button{display:flex;width:100%;justify-content:space-between;margin-top:.3rem;text-align:left}
.pb{display:flex;height:2.4rem;margin:.7rem 0;font:800 1.3rem var(--d)}.pb i{display:flex;align-items:center;padding:0 .7rem;font-style:normal;color:#000;min-width:3rem}
.tb{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr;gap:.3rem .6rem;padding:.4rem 0;border-bottom:1px solid var(--ln);font-size:.88rem}
.tb.best{color:var(--gd)}.tb.hd{color:var(--mu);font-size:.75rem}
.pk.on{background:var(--gd);color:#000}
.empty{padding:2rem 0;color:var(--mu)}
footer{max-width:980px;margin:auto;padding:0 clamp(1rem,4vw,2rem) 1.5rem;font-size:.8rem;color:var(--mu)}
@media(min-width:760px){body{padding-bottom:0}nav{position:static;border:0;background:none;backdrop-filter:none;padding:0;gap:.3rem}nav a{flex:none;padding:.4rem 1rem;box-shadow:none}nav a.on{background:var(--gd);color:#000;clip-path:var(--ch);box-shadow:none}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
</head>
<body>
<div class="top"><span class="brand"><svg viewBox="0 0 40 40"><polygon points="12,1 28,1 39,12 39,28 28,39 12,39 1,28 1,12" fill="none" stroke="#f5c518" stroke-width="3"/><polygon points="14,9 26,9 31,14 31,26 26,31 14,31 9,26 9,14" fill="#f5c518"/></svg>SÚMULA <em>UFC</em></span><nav id="nv"></nav><button class="lg" id="lg"></button></div>
<main id="m"></main>
<footer id="ft"></footer>
<script>
const $=s=>document.querySelector(s),M=h=>$('#m').innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={ev:[],fg:[],F:new Map(),ov:{merges:{},div:{},exclude:[]},meta:{},P:{vol:80,fin:1,title:.25,tw:1,min:3,act:2},mode:'cur',div:'ALL',pt:false,sim:{a:'',b:'',m:'cur',d:'ALL'},ps:{},cache:new Map(),lg:null,me:{ph:{},fav:{},note:{},log:{}},up:[],simLast:null};
try{Object.assign(S.P,JSON.parse(localStorage.sumulaP3||'{}'))}catch{}
try{Object.assign(S.me,JSON.parse(localStorage.sumulaMe||'{}'))}catch{}
try{S.pt=localStorage.sumulaLang==='pt'}catch{}
const T=(en,pt)=>S.pt?pt:en;
const saveMe=()=>{try{localStorage.sumulaMe=JSON.stringify(S.me)}catch{alert(T('Storage is full. Remove some photos.','Armazenamento cheio. Remova algumas fotos.'))}};
const mid=id=>S.ov.merges[id]||id,fmt=d=>new Date(d+'T00:00').toLocaleDateString(S.pt?'pt-BR':'en-US',{day:'2-digit',month:'short',year:'numeric'});
const name=x=>S.F.get(mid(x.id))?.name||x.name,ini=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=(id,n,c='')=>{const im=S.me.ph[id];return `<span class="ring ${c}"><span${im?` style="background:url('${im}') center/cover"`:''}>${im?'':esc(ini(n))}</span></span>`};
const empty=()=>`<p class="empty">${S.ev.length?T('Nothing found.','Nada encontrado.'):T('No data yet. On GitHub, open Actions, choose "Atualizar base UFC" and click Run workflow.','Ainda não há dados. No GitHub, abra Actions, escolha "Atualizar base UFC" e clique em Run workflow.')}</p>`;
const LB={KD:['Knockdowns','Knockdowns'],'Sig. str.':['Significant strikes','Golpes significativos'],'Total str.':['Total strikes','Golpes totais'],Td:['Takedowns','Quedas'],'Sub. att':['Submission attempts','Finalizações tentadas'],'Rev.':['Reversals','Viradas'],Ctrl:['Control time','Controle'],Head:['Head','Cabeça'],Body:['Body','Corpo'],Leg:['Leg','Perna'],Distance:['Distance','Distância'],Clinch:['Clinch','Clinch'],Ground:['Ground','Solo']};
const lb=k=>LB[k][S.pt?1:0];
const YR=31557600000,U=400/Math.LN10;

async function init(){
 const g=async n=>{try{const r=await fetch('data/'+n+'.json',{cache:'no-cache'});return r.ok?r.json():null}catch{return null}};
 const [ev,fg,fi,ov,meta,up]=await Promise.all(['events','fights','fighters','overrides','meta','upcoming'].map(g));
 if(ov)S.ov={merges:{},div:{},exclude:[],...ov};
 S.ev=ev||[];S.meta=meta||{};S.up=(up&&up.events)||[];(fi||[]).forEach(f=>S.F.set(f.id,f));
 S.fg=(fg||[]).filter(f=>!S.ov.exclude.includes(f.id)).map(f=>({...f,div:S.ov.div[f.id]||f.div}));
 $('#lg').onclick=()=>{S.pt=!S.pt;try{localStorage.sumulaLang=S.pt?'pt':'en'}catch{}route()};
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 addEventListener('hashchange',route);route();
}

/* ---------- Rating engine: Whole-History Rating (Coulom, 2008) ---------- */
function dom(f){const m=f.method||'';if(/^(ko|tko|sub)/i.test(m))return 1;
 return 1-(/dq|split/i.test(m)?.3:/major/i.test(m)?.2:/decision/i.test(m)?.1:0)*S.P.fin}
const scope=(d=S.div)=>S.fg.filter(f=>f.res!=='nc'&&(d==='ALL'||f.div===d)).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(y.ord||0)-(x.ord||0));
const TG=(t,won)=>!t?'':({conq:won?T('won the belt','conquistou o cinturão'):T('lost the belt','perdeu o cinturão'),vago:won?T('won the vacant belt','conquistou o cinturão vago'):T('fought for the vacant belt','disputou o cinturão vago'),def:won?T('defended the belt','defendeu o cinturão'):T('fought for the belt','disputou o cinturão'),int:won?T('won the interim belt','conquistou o interino'):T('fought for the interim belt','disputou o interino')})[t];
function whr(L,P){
 const w2=(P.vol/U)**2,tau2=6.25,N=new Map(),tag=new Map(),ch=new Map(),cnt=new Map(),rg=[],op=new Map();
 for(const f of L){if(!f.title||(f.res!=='a'&&f.res!=='b'))continue;
  const W=mid(f[f.res].id),Lo=mid(f[f.res==='a'?'b':'a'].id),c=cnt.get(W)||{cq:0,df:0,iv:0};cnt.set(W,c);
  if(/interim/i.test(f.tt||'')){tag.set(f.id,'int');c.iv++;continue}
  const cur=ch.get(f.div);
  const o=op.get(f.div);
  if(cur===W){tag.set(f.id,'def');c.df++;if(o){o.def++;o.last=f.date}}else{tag.set(f.id,cur===Lo?'conq':'vago');c.cq++;ch.set(f.div,W);if(o)o.end=f.date;const n={id:W,div:f.div,start:f.date,last:f.date,end:null,def:0};op.set(f.div,n);rg.push(n)}}
 for(const f of L){
  const ia=mid(f.a.id),ib=mid(f.b.id);if(ia===ib)continue;
  const t=Date.parse(f.date)/YR,w=f.res==='draw'?.5:dom(f),sa=f.res==='a'?w:f.res==='b'?1-w:.5,m=f.title?1+P.title:1,ip=/interim/i.test(f.tt||''),ti=!!f.title;
  const na={t,r:0,gs:[],f:f.id,id:ia,dt:f.date,ti,ip},nb={t,r:0,gs:[],f:f.id,id:ib,dt:f.date,ti,ip};
  na.gs.push({o:nb,s:sa,m});nb.gs.push({o:na,s:1-sa,m});
  for(const [id,n] of [[ia,na],[ib,nb]]){if(!N.has(id))N.set(id,[]);N.get(id).push(n)}
 }
 const solve=a=>{
  const n=a.length,d=new Array(n),e=new Array(n),g=new Array(n);let mx=0;
  for(let i=0;i<n;i++){
   const x=a[i];let gi=0,di=0;
   for(const k of x.gs){const p=1/(1+Math.exp(k.o.r-x.r));gi+=k.m*(k.s-p);di+=k.m*p*(1-p)}
   if(i===0){gi-=x.r/tau2;di+=1/tau2}else{const v=w2*Math.max(x.t-a[i-1].t,.05);gi-=(x.r-a[i-1].r)/v;di+=1/v;e[i-1]=-1/v}
   if(i<n-1){const v=w2*Math.max(a[i+1].t-x.t,.05);gi+=(a[i+1].r-x.r)/v;di+=1/v}
   d[i]=di;g[i]=gi}
  for(let i=1;i<n;i++){const f=e[i-1]/d[i-1];d[i]-=f*e[i-1];g[i]-=f*g[i-1]}
  for(let i=0;i<n;i++)a[i].vr=1/d[i]; /* posterior variance (exact for the last node, conservative for the others) */
  g[n-1]/=d[n-1];for(let i=n-2;i>=0;i--)g[i]=(g[i]-e[i]*g[i+1])/d[i];
  for(let i=0;i<n;i++){const st=Math.max(-2,Math.min(2,g[i]));a[i].r+=st;mx=Math.max(mx,Math.abs(st))}
  return mx};
 const A=[...N.values()];
 for(let it=0;it<40;it++){let mx=0;for(const a of A)mx=Math.max(mx,solve(a));if(mx<2e-3)break}
 const rs=[];for(const a of A)for(const x of a)rs.push(x.r);rs.sort((u,v)=>u-v);
 const ref=rs.length?rs[Math.floor(.85*(rs.length-1))]:0;
 const rows=[...N].map(([id,a])=>{let w=0,l=0,d=0,pk=a[0],v=0;
  for(const x of a){const g=x.gs[0],s=g.s,pf=1/(1+Math.exp(g.o.r-ref));
   s>.5?w++:s<.5?l++:d++;if(x.r>pk.r)pk=x;
   v+=(s>.5?s*(1-pf):s<.5?-pf:.5-pf)*(x.ti?(x.ip?1+P.tw/2:1+P.tw):1)}
  return{id,n:a.length,w,l,d,last:a.at(-1).dt,cur:1500+U*a.at(-1).r,pk:1500+U*pk.r,pkd:pk.dt,hs:10*v,pn:pk,ln:a.at(-1),...(cnt.get(id)||{cq:0,df:0,iv:0})}});
 return{rows,N,tag,rg,RM:new Map(rows.map(x=>[x.id,x]))};
}
function getE(d){const k=d+'|'+JSON.stringify(S.P);if(!S.cache.has(k)){if(S.cache.size>20)S.cache.clear();S.cache.set(k,whr(scope(d),S.P))}return S.cache.get(k)}
function holdout(L,P){
 if(!L.length)return null;
 const cut=new Date(Date.parse(L.at(-1).date)-2*YR).toISOString().slice(0,10),cur=new Map(whr(L.filter(f=>f.date<cut),P).rows.map(x=>[x.id,x]));
 let n=0,ok=0,ll=0;
 for(const f of L){if(f.date<cut||f.res==='draw')continue;
  const A=cur.get(mid(f.a.id)),B=cur.get(mid(f.b.id));if(!A||!B||A.n<3||B.n<3)continue;
  const p=1/(1+Math.exp(-(A.cur-B.cur)/U)),pw=f.res==='a'?p:1-p;n++;ok+=pw>.5;ll-=Math.log(Math.max(pw,1e-6))}
 return{n,ok,ll,cut};
}

/* ---------- Fight statistics ---------- */
const num=v=>parseFloat(String(v??'').split(' of ')[0])||0,att=v=>{const m=String(v??'').match(/of (\d+)/);return m?+m[1]:0};
const secs=v=>{const m=String(v??'').match(/^(\d+):(\d+)$/);return m?+m[1]*60+ +m[2]:0};
const mins=f=>{const r=parseInt(f.round)||0,m=String(f.time||'').match(/^(\d+):(\d+)$/);return r&&m?(r-1)*5+ +m[1]+ +m[2]/60:0};
const cls=m=>/^(ko|tko)/i.test(m)?'KO':/^sub/i.test(m)?'SUB':/decision/i.test(m)?'DEC':'OTH';
const KS=['KO','SUB','DEC','OTH'],blank=()=>({n:0,min:0,sl:0,sa:0,al:0,aa:0,tdl:0,tda:0,tdo:0,tdoa:0,sub:0,kd:0,kdo:0,ct:0,cto:0,w:0,l:0,W:{KO:0,SUB:0,DEC:0,OTH:0},Ls:{KO:0,SUB:0,DEC:0,OTH:0}});
function agg(id,mode){
 let fs=S.fg.filter(f=>f.res!=='nc'&&(mid(f.a.id)===id||mid(f.b.id)===id)).sort((x,y)=>x.date<y.date?-1:1);
 if(mode==='cur')fs=fs.slice(-6);
 const o=blank();o.n=fs.length;
 for(const f of fs){const me=mid(f.a.id)===id?'a':'b',op=me==='a'?'b':'a',m=mins(f);
  if(f.totals&&m){const A=f.totals[me],B=f.totals[op];o.min+=m;
   o.sl+=num(A['Sig. str.']);o.sa+=att(A['Sig. str.']);o.al+=num(B['Sig. str.']);o.aa+=att(B['Sig. str.']);
   o.tdl+=num(A.Td);o.tda+=att(A.Td);o.tdo+=num(B.Td);o.tdoa+=att(B.Td);o.sub+=num(A['Sub. att']);
   o.kd+=num(A.KD);o.kdo+=num(B.KD);o.ct+=secs(A.Ctrl);o.cto+=secs(B.Ctrl)}
  if(f.res!=='draw'){const won=f.res===me;(won?o.W:o.Ls)[cls(f.method)]++;won?o.w++:o.l++}}
 return o}
function league(){
 if(S.lg)return S.lg;const o={min:0,sl:0,sa:0,tdl:0,tda:0,sub:0,kd:0,ct:0,W:{KO:0,SUB:0,DEC:0,OTH:0},w:0};
 for(const f of S.fg){if(f.res==='draw'||f.res==='nc')continue;const m=mins(f);
  if(f.totals&&m){o.min+=2*m;for(const s of 'ab'){const A=f.totals[s];o.sl+=num(A['Sig. str.']);o.sa+=att(A['Sig. str.']);o.tdl+=num(A.Td);o.tda+=att(A.Td);o.sub+=num(A['Sub. att']);o.kd+=num(A.KD);o.ct+=secs(A.Ctrl)}}
  o.W[cls(f.method)]++;o.w++}

function rates(o,G){

/* ---------- Fight simulator ---------- */
function rt(id,E,mode){
 const x=E.RM.get(id);if(!x)return null;
 if(mode==='peak')return{mu:x.pn.r,v:x.pn.vr,x};
 return{mu:x.ln.r,v:x.ln.vr+(S.P.vol/U)**2*Math.max(0,Date.now()/YR-x.ln.t),x}}
const sg=z=>1/(1+Math.exp(-z)),pc=x=>(x*100).toFixed(1)+'%',f1=x=>x.toFixed(2);
const sr=(l,a,b,x,y)=>`<div class="sr"><span style="color:var(--gd)">${a}</span><span class="lb">${l}</span><span style="color:var(--cb)">${b}</span>${x!=null?`<div class="bar"><i style="--w:${x/((x+y)||1)*100}%;--c:var(--gd)"></i><i style="--w:${y/((x+y)||1)*100}%;--c:var(--cb)"></i></div>`:''}</div>`;
function pick(q,s){
 const id=q[s],p=S.F.get(id);
 return `<div class="card" style="padding:.8rem 1rem"><div class="mu sm">${s==='a'?T('Fighter A','Lutador A'):T('Fighter B','Lutador B')}</div>${p?`<div class="sel">${av(id,p.name,'sm')}<b>${esc(p.name)}</b><span class="mu sm">${esc(p.record)}</span><button data-clr="${s}">×</button></div>`:`<input data-q="${s}" type="search" placeholder="${T('Search a fighter…','Buscar lutador…')}"><div class="res" id="r${s}"></div>`}</div>`}
function simOut(q){
 const A=S.F.get(q.a),B=S.F.get(q.b);
 if(!A||!B)return `<p class="empty">${T('Pick two fighters to simulate.','Escolha dois lutadores para simular.')}</p>`;
 if(q.a===q.b)return `<p class="empty">${T('Pick two different fighters.','Escolha dois lutadores diferentes.')}</p>`;
 const E=getE(q.d),ra=rt(q.a,E,q.m),rb=rt(q.b,E,q.m);
 if(!ra||!rb)return `<p class="empty">${T('At least one fighter has no rating in this scope. Try "General".','Pelo menos um lutador não tem nota neste escopo. Tente "Geral".')}</p>`;
 const s2=ra.v+rb.v,dm=ra.mu-rb.mu,p=sg(dm/Math.sqrt(1+Math.PI*s2/8)),lo=sg(dm-1.645*Math.sqrt(s2)),hi=sg(dm+1.645*Math.sqrt(s2));
 const G=league(),oa=agg(q.a,q.m),ob=agg(q.b,q.m),xa=rates(oa,G),xb=rates(ob,G),el=r=>Math.round(1500+U*r.mu),sd=r=>Math.round(U*Math.sqrt(r.v));
 const da=mainDiv(q.a),db=mainDiv(q.b),age=d=>{const t=Date.parse(d);return t?((Date.now()-t)/YR).toFixed(1):'-'};
 let h=`<h2>${T('Win probability','Probabilidade de vitória')}</h2><div class="card" style="padding:1rem 1.1rem"><div class="pb"><i style="flex:${p};background:var(--gd)">${pc(p)}</i><i style="flex:${1-p};background:var(--cb)">${pc(1-p)}</i></div>
  <div class="sr"><span style="color:var(--gd)">${esc(A.name)}</span><span></span><span style="color:var(--cb)">${esc(B.name)}</span></div>
  <p class="mu sm">${T('90% interval for A','Intervalo de 90% para A')}: ${pc(lo)} – ${pc(hi)}. ${T('Ratings','Notas')}: ${el(ra)} ± ${sd(ra)} ${T('vs','vs')} ${el(rb)} ± ${sd(rb)} (${q.m==='peak'?T('career peak','pico da carreira'):T('current form, with uncertainty growing while inactive','momento atual, com incerteza crescendo na inatividade')}).${da!==db?` ${T('Different main divisions: the rating comparison is indirect.','Divisões principais diferentes: a comparação de notas é indireta.')}`:''}</p></div>
  <h2>${T('Tale of the tape','Comparativo')}</h2><div class="card" style="padding:.8rem 1.1rem">${sr(T('Record','Cartel'),esc(A.record),esc(B.record))}${sr(T('Height','Altura'),esc(A.Height||'-'),esc(B.Height||'-'))}${sr(T('Reach','Envergadura'),esc(A.Reach||'-'),esc(B.Reach||'-'))}${sr(T('Stance','Base'),esc(A.STANCE||'-'),esc(B.STANCE||'-'))}${sr(T('Age','Idade'),age(A.DOB),age(B.DOB))}${sr(T('Main division','Divisão principal'),esc(da),esc(db))}${sr(T('Fights used','Lutas usadas'),oa.n,ob.n)}</div>`;
 S.simLast={A,B,p,lo,hi,m:q.m};
 h+=`<div class="acts" style="margin-top:.6rem"><button id="shr">${T('Share card','Cartão para compartilhar')}</button></div>`;
 h+=models(q,p);h+=h2hHtml(q);
 if(!xa||!xb)return h+`<p class="empty">${T('Not enough fight stats in the database.','Sem estatísticas de luta suficientes na base.')}</p>`;
 h+=`<h2>${T('Striking and grappling profile','Perfil de trocação e solo')}</h2><div class="card" style="padding:.8rem 1.1rem">
  ${sr(T('Sig. strikes landed / min','Golpes sig. acertados / min'),f1(xa.sl),f1(xb.sl),xa.sl,xb.sl)}${sr(T('Sig. strikes absorbed / min','Golpes sig. recebidos / min'),f1(xa.ab),f1(xb.ab),xa.ab,xb.ab)}
  ${sr(T('Striking accuracy','Precisão de golpes'),pc(xa.acc),pc(xb.acc),xa.acc,xb.acc)}${sr(T('Striking defense','Defesa de golpes'),pc(xa.def),pc(xb.def),xa.def,xb.def)}
  ${sr(T('Takedowns / 15 min','Quedas / 15 min'),f1(xa.td),f1(xb.td),xa.td,xb.td)}${sr(T('Takedown accuracy','Precisão de quedas'),pc(xa.tdacc),pc(xb.tdacc),xa.tdacc,xb.tdacc)}${sr(T('Takedown defense','Defesa de quedas'),pc(xa.tddef),pc(xb.tddef),xa.tddef,xb.tddef)}
  ${sr(T('Submission attempts / 15 min','Finalizações tentadas / 15 min'),f1(xa.sub),f1(xb.sub),xa.sub,xb.sub)}${sr(T('Knockdowns / 15 min','Knockdowns / 15 min'),f1(xa.kd),f1(xb.kd),xa.kd,xb.kd)}
  ${sr(T('Control time share','Fração de controle'),pc(xa.ctl),pc(xb.ctl),xa.ctl,xb.ctl)}${sr(T('Finish rate in wins','Taxa de finalização nas vitórias'),pc(xa.fin),pc(xb.fin),xa.fin,xb.fin)}</div>`;
 const gk=15*Math.max(G.kd,1)/G.min,pj=(x,y)=>({sl:15*x.sl*(y.ab/x.gs),td:x.td*(y.tdab/x.gt15),kd:x.kd*(y.kda/gk),ctl:Math.min(.95,x.ctl*(y.cta/x.gc))}),ja=pj(xa,xb),jb=pj(xb,xa);
 h+=`<h2>${T('Projected matchup (per 15 minutes)','Projeção do confronto (a cada 15 minutos)')}</h2><div class="card" style="padding:.8rem 1.1rem">
  ${sr(T('Sig. strikes landed','Golpes sig. acertados'),f1(ja.sl),f1(jb.sl),ja.sl,jb.sl)}${sr(T('Takedowns','Quedas'),f1(ja.td),f1(jb.td),ja.td,jb.td)}${sr(T('Knockdowns','Knockdowns'),f1(ja.kd),f1(jb.kd),ja.kd,jb.kd)}${sr(T('Control time share','Fração de controle'),pc(ja.ctl),pc(jb.ctl),ja.ctl,jb.ctl)}</div>`;
 const ma=meth(oa,ob,G),mb=meth(ob,oa,G),nm={KO:'KO/TKO',SUB:T('Submission','Finalização'),DEC:T('Decision','Decisão'),OTH:T('Other','Outro')};
 h+=`<h2>${T('How it ends','Como termina')}</h2><div class="card" style="padding:.8rem 1.1rem">${KS.filter(k=>k!=='OTH').map(k=>sr(nm[k],pc(p*ma[k]),pc((1-p)*mb[k]),p*ma[k],(1-p)*mb[k])).join('')}
  <p class="mu sm">${T('Goes the distance','Vai para a decisão')}: ${pc(p*ma.DEC+(1-p)*mb.DEC)}.</p></div>
 <details class="card"><summary>${T('Method','Método')}</summary><p>${T('Win probability comes from the rating model (WHR) with uncertainty: the rating difference and its variance go through the logistic curve with the probit approximation (Bradley–Terry, 1952), and the interval is 90%. The variance is approximate (conditional on opponents\' ratings), so treat it as optimistic. Method odds combine how each fighter wins with how the opponent loses (naive Bayes, smoothed toward the UFC average). Stat projections multiply offense by the opponent\'s defense relative to the UFC average (Govan, Langville & Meyer, 2009), shrunk toward the average for small samples. They describe how the fight may play out and are not blended into the win probability, because that blend has not been validated. Current form uses the last 6 fights.','A probabilidade vem do modelo de notas (WHR) com incerteza: a diferença das notas e sua variância passam pela curva logística com a aproximação probit (Bradley–Terry, 1952), e o intervalo é de 90%. A variância é aproximada (condicionada às notas dos rivais), então trate-a como otimista. As chances por método combinam como cada lutador vence com como o rival perde (Bayes ingênuo, suavizado para a média do UFC). As projeções multiplicam o ataque pela defesa do rival relativas à média do UFC (Govan, Langville & Meyer, 2009), com encolhimento para a média em amostras pequenas. Elas descrevem como a luta pode ser e não entram na probabilidade de vitória, porque essa combinação não foi validada. O momento atual usa as últimas 6 lutas.')}</p></details>`;
 return h;
}
function mainDiv(id){const c={};for(const f of S.fg)if(mid(f.a.id)===id||mid(f.b.id)===id)c[f.div]=(c[f.div]||0)+1;return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'-'}
function vSim(a,b){
 const q=S.sim;if(a)q.a=mid(a);if(b)q.b=mid(b);
 const divs=[...new Set(S.fg.map(f=>f.div))].sort();
 M(`<h1>${T('Simulator','Simulador')}</h1><div class="ctl"><label>${T('Mode','Modo')}<select id="sm"><option value="cur">${T('Current form (now)','Momento atual')}</option><option value="peak">${T('Career peak (all-time)','Pico da carreira (histórico)')}</option></select></label>
 <label>${T('Rating scope','Escopo da nota')}<select id="sd"><option value="ALL">${T('General (all fights)','Geral (todas as lutas)')}</option>${divs.map(d=>`<option>${esc(d)}</option>`).join('')}</select></label></div>${pick(q,'a')}${pick(q,'b')}<div id="out"></div>`);
 $('#sm').value=q.m;$('#sd').value=q.d;
 $('#sm').onchange=e=>{q.m=e.target.value;vSim()};$('#sd').onchange=e=>{q.d=e.target.value;vSim()};
 $('#out').innerHTML=simOut(q);const sb=$('#shr');if(sb)sb.onclick=shareCard;
 $('#m').oninput=e=>{const i=e.target.closest('[data-q]');if(!i)return;const s=i.dataset.q,t=i.value.toLowerCase().trim();
  $('#r'+s).innerHTML=t?[...S.F.values()].filter(f=>(f.name+' '+f.nick).toLowerCase().includes(t)).slice(0,6).map(f=>`<button data-pk="${s}:${f.id}"><span>${esc(f.name)}</span><span class="mu">${esc(f.record)}</span></button>`).join(''):''};
 $('#m').onclick=e=>{const k=e.target.closest('[data-pk]'),c=e.target.closest('[data-clr]');
  if(k){const [s,id]=k.dataset.pk.split(':');q[s]=id;vSim()}else if(c){q[c.dataset.clr]='';vSim()}};
}

const NM={'Coin flip':['Coin flip','Cara ou coroa'],Elo:['Elo (updates every fight)','Elo (atualiza a cada luta)'],WHR:['WHR (refit every 6 months)','WHR (reajustado a cada 6 meses)'],Stats:['Elo + stats model','Elo + modelo de estatísticas'],Blend:['Blend WHR + stats','Combinado WHR + estatísticas']};
function models(q,p){
 if(q.m!=='cur')return `<p class="mu sm">${T('The stats model is available in "Current form" mode.','O modelo de estatísticas está disponível no modo "Momento atual".')}</p>`;
 const R=lab();if(!R||R.none)return'';
 const st=pre().st,a=st.get(q.a),b=st.get(q.b);if(!a||!b)return'';
 const today=new Date().toISOString().slice(0,10),fa=feat(a,q.a,today),fb=feat(b,q.b,today),xx=fa.map((v,i)=>v==null||fb[i]==null?0:v-fb[i]),ps=predLR(R.mF,{x:xx}),pe=predLR(R.mE,{x:xx}),bl=(p+ps)/2,m=k=>R.M.find(x=>x.n===k).ll.toFixed(3);
 const row=(n,k,v)=>`<div class="sr"><span style="color:var(--gd)">${pc(v)}</span><span class="lb">${n}${R.best===k?' ★':''}</span><span style="color:var(--cb)">${pc(1-v)}</span></div>`;
 return `<h2>${T('Models compared','Modelos comparados')}</h2><div class="card" style="padding:.8rem 1.1rem">${row('Elo','Elo',pe)}${row('WHR','WHR',p)}${row(T('Stats model','Modelo de estatísticas'),'Stats',ps)}${row(T('Blend','Combinado'),'Blend',bl)}<p class="mu sm">${T('★ = lowest blind-test log-loss','★ = menor log-loss no teste cego')} (Elo ${m('Elo')}, WHR ${m('WHR')}, ${T('stats','estatísticas')} ${m('Stats')}, ${T('blend','combinado')} ${m('Blend')}). ${T('Details in the Lab tab.','Detalhes na aba Lab.')}</p></div>`}

function analysis(id){
 const fs=S.fg.filter(f=>f.res!=='nc'&&(mid(f.a.id)===id||mid(f.b.id)===id)),o=agg(id,'all'),rd=[0,1,2,3,4].map(()=>({l:0,a:0,n:0})),tg={Head:0,Body:0,Leg:0,Distance:0,Clinch:0,Ground:0};
 for(const f of fs){const me=mid(f.a.id)===id?'a':'b',op=me==='a'?'b':'a',full=/decision/i.test(f.method||''),last=parseInt(f.round)||0;
  (f.rounds?.totals||[]).forEach((r,i)=>{if(i<5&&r[me]&&(full||i+1<last)){rd[i].l+=num(r[me]['Sig. str.']);rd[i].a+=num(r[op]?.['Sig. str.']);rd[i].n++}});
  if(f.sig)for(const k in tg)tg[k]+=num(f.sig[me]?.[k])}
 if(o.min<15)return `<p class="mu sm">${T('Not enough fight stats yet.','Ainda não há estatísticas suficientes.')}</p>`;
 const ln=(l,v,fr)=>`<div class="sr" style="grid-template-columns:9.5rem 1fr auto;align-items:center"><span class="mu">${l}</span><i class="mb" style="margin:0"><b style="width:${Math.max(0,Math.min(1,fr))*100}%"></b></i><span>${v}</span></div>`;
 const rv=rd.map(r=>r.n>=3?r.l/r.n:null),mx=Math.max(...rv.filter(v=>v!=null),1),ch=rv[0]&&rv[2]!=null?(rv[2]-rv[0])/rv[0]:null;
 const t1=tg.Head+tg.Body+tg.Leg||1,t2=tg.Distance+tg.Clinch+tg.Ground||1,sl=o.sl,al=o.al,py=sl*sl/((sl*sl+al*al)||1),ac=o.w/((o.w+o.l)||1),lw=o.l||1;
 return `<div class="card" style="padding:.8rem 1.1rem"><b>${T('Cardio: significant strikes landed per round','Cardio: golpes significativos acertados por round')}</b>
  ${rv.map((v,i)=>v==null?'':ln('R'+(i+1)+` (${rd[i].n})`,v.toFixed(1),v/mx)).join('')}${ch!=null?`<p class="mu sm">${T('Round 3 vs round 1','Round 3 vs round 1')}: <b class="${ch<0?'dn':'up'}">${ch>0?'+':''}${(ch*100).toFixed(0)}%</b>. ${T('Only completed rounds are counted.','Só rounds completos entram na conta.')}</p>`:''}</div>
  <div class="card" style="padding:.8rem 1.1rem"><b>${T('Striking signature (share of significant strikes landed)','Assinatura de golpes (parcela dos golpes significativos acertados)')}</b>
  ${['Head','Body','Leg','Distance','Clinch','Ground'].map((k,i)=>ln(lb(k),((tg[k]/(i<3?t1:t2))*100).toFixed(0)+'%',tg[k]/(i<3?t1:t2))).join('')}</div>
  <div class="card" style="padding:.8rem 1.1rem"><b>${T('Durability and results','Durabilidade e resultados')}</b>
  ${ln(T('Knockdowns absorbed / 15 min','Knockdowns sofridos / 15 min'),(15*o.kdo/o.min).toFixed(2),15*o.kdo/o.min/1.5)}${ln(T('Losses by KO/TKO','Derrotas por KO/TKO'),`${o.Ls.KO} / ${o.l}`,o.Ls.KO/lw)}${ln(T('Wins by KO/TKO','Vitórias por KO/TKO'),`${o.W.KO} / ${o.w}`,o.W.KO/(o.w||1))}${ln(T('Wins by submission','Vitórias por finalização'),`${o.W.SUB} / ${o.w}`,o.W.SUB/(o.w||1))}${ln(T('Wins by decision','Vitórias por decisão'),`${o.W.DEC} / ${o.w}`,o.W.DEC/(o.w||1))}
  <p class="mu sm">${T('Pythagorean expectation (strikes landed² vs absorbed², an estimate)','Expectativa pitagórica (golpes acertados² vs recebidos², uma estimativa)')}: ${(py*100).toFixed(0)}% ${T('expected vs','esperado vs')} ${(ac*100).toFixed(0)}% ${T('actual win rate','de vitórias reais')} → <b class="${ac>=py?'up':'dn'}">${ac>=py?T('overperforming','acima do esperado'):T('underperforming','abaixo do esperado')}</b>.</p></div>`}

function labHtml(R){
 const best=R.best,hd=`<div class="tb hd"><span>${T('Model','Modelo')}</span><span>${T('Accuracy','Acerto')}</span><span>Log-loss</span><span>Brier</span></div>`;
 const pts=R.bins.filter(b=>b.n>=5).map(b=>[b.s/b.n,b.y/b.n,b.n]);
 const cal=`<svg viewBox="0 0 220 220" class="sp" style="height:auto;max-width:320px"><rect x="10" y="10" width="200" height="200" fill="none" stroke="var(--ln)"/><line x1="10" y1="210" x2="210" y2="10" stroke="var(--mu)" stroke-dasharray="4"/><polyline fill="none" stroke="var(--gd)" stroke-width="2" points="${pts.map(p=>`${10+p[0]*200},${210-p[1]*200}`).join(' ')}"/>${pts.map(p=>`<circle cx="${10+p[0]*200}" cy="${210-p[1]*200}" r="${3+Math.min(5,p[2]/20)}" fill="var(--gd)"/>`).join('')}</svg>`;
 const co=R.mF.b.map((b,j)=>({j,b,lo:Math.exp(b-2.81*R.mF.se[j]),hi:Math.exp(b+2.81*R.mF.se[j])})).sort((x,y)=>Math.abs(y.b)-Math.abs(x.b));
 return `<p class="mu sm">${T(`Blind test: models fitted with ${R.ntr.toLocaleString('en-US')} fights up to ${fmt(R.cut)}, scored on the ${R.n.toLocaleString('en-US')} fights after it (both fighters with 3+ prior fights). Lower log-loss and Brier are better. Coin flip = 0.693 and 0.250.`,`Teste cego: modelos ajustados com ${R.ntr.toLocaleString('pt-BR')} lutas até ${fmt(R.cut)} e avaliados nas ${R.n.toLocaleString('pt-BR')} lutas seguintes (os dois com 3+ lutas antes). Menor log-loss e Brier é melhor. Cara ou coroa = 0,693 e 0,250.`)}</p>
 <h2>${T('Validation','Validação')}</h2><div class="card" style="padding:.6rem 1.1rem">${hd}${R.M.map(m=>`<div class="tb${best===m.n?' best':''}"><span>${NM[m.n][S.pt?1:0]}${best===m.n?' ★':''}</span><span>${pc(m.acc)}</span><span>${m.ll.toFixed(3)}</span><span>${m.br.toFixed(3)}</span></div>`).join('')}
 <p class="mu sm">${T('All models are trained only on the past. Elo and the stats features update fight by fight; WHR is refit every 6 months. Models are trained and tested on fights where both fighters already have 3+ fights. ★ = best of the four on this test: if it is not the stats model, the extra variables add nothing beyond rating.','Todos os modelos treinam só com o passado. Elo e as variáveis de estatísticas se atualizam a cada luta; o WHR é reajustado a cada 6 meses. Treino e teste usam lutas em que os dois já têm 3+ lutas. ★ = melhor dos quatro neste teste: se não for o modelo de estatísticas, as variáveis extras não acrescentam nada além da nota.')}</p></div>
 <h2>${T('Calibration','Calibração')} (${NM[best][S.pt?1:0]})</h2><div class="card" style="padding:.8rem 1.1rem">${cal}<p class="mu sm">${T('Each dot: when the model said X%, how often did the fighter really win? On the dashed diagonal means well calibrated; dot size = number of fights.','Cada ponto: quando o modelo disse X%, quantas vezes o lutador realmente venceu? Na diagonal tracejada significa bem calibrado; tamanho do ponto = número de lutas.')}</p></div>
 <h2>${T('What really matters','O que realmente importa')}</h2><div class="card" style="padding:.6rem 1.1rem"><div class="tb hd"><span>${T('Variable (A − B)','Variável (A − B)')}</span><span>${T('Odds ratio / SD','Razão de chances / DP')}</span><span>${T('99.5% interval','Intervalo de 99,5%')}</span><span>${T('Verdict','Veredito')}</span></div>
 ${co.map(c=>`<div class="tb"><span>${FN[c.j][S.pt?1:0]}</span><span>${Math.exp(c.b).toFixed(2)}</span><span>${c.lo.toFixed(2)} – ${c.hi.toFixed(2)}</span><span class="${c.lo>1?'up':c.hi<1?'dn':'mu'}">${c.lo>1?T('more helps','mais ajuda'):c.hi<1?T('more hurts','mais atrapalha'):T('no evidence','sem evidência')}</span></div>`).join('')}
 <p class="mu sm">${T('Ridge logistic regression (λ = 1) on pre-fight differences, scaled by one standard deviation. The interval is widened (Bonferroni) because 10 variables are tested at once, so isolated weak effects are not flagged by luck. An interval that includes 1.00 means the data show no reliable effect of that variable after accounting for the others.','Regressão logística com regularização ridge (λ = 1) sobre diferenças de antes da luta, em desvios-padrão. O intervalo é ampliado (Bonferroni) porque 10 variáveis são testadas ao mesmo tempo, então efeitos fracos isolados não aparecem por sorte. Intervalo que inclui 1,00 significa que os dados não mostram efeito confiável daquela variável depois de considerar as outras.')}</p></div>
 <h2>${T('Auto-tune','Autoajuste')}</h2><div class="card" style="padding:.8rem 1.1rem"><p class="mu sm">${T('Tries 15 combinations of volatility and method-of-victory weight and picks the one with the lowest blind-test log-loss for the WHR rating. Takes a few seconds.','Testa 15 combinações de volatilidade e peso do método de vitória e escolhe a de menor log-loss no teste cego do rating WHR. Leva alguns segundos.')}</p><button id="tb">${T('Run auto-tune','Rodar autoajuste')}</button><div id="tn" class="mu sm" style="margin-top:.6rem"></div></div>
 ${extraLab()}
 <details class="card"><summary>${T('References','Referências')}</summary><p>Brier (1950) <i>Monthly Weather Review</i> 78(1). Guo, Pleiss, Sun &amp; Weinberger (2017) <i>On Calibration of Modern Neural Networks</i>, ICML. Hoerl &amp; Kennard (1970) <i>Technometrics</i> 12(1). Coulom (2008) <i>Computers and Games</i>, LNCS 5131. Elo (1978). Bradley &amp; Terry (1952).</p></details>`}
function tune(){
 const out=$('#tn'),jobs=[40,60,80,110,150].flatMap(v=>[0,.5,1].map(f=>[v,f])),res=[],L=scope('ALL'),keep={vol:S.P.vol,fin:S.P.fin};let i=0;
 const step=()=>{if(!$('#tn'))return;
  if(i>=jobs.length){Object.assign(S.P,keep);res.sort((a,b)=>a.ll-b.ll);const b=res[0];
   out.innerHTML=res.slice(0,5).map(r=>`<div class="tb${r===b?' best':''}" style="grid-template-columns:1fr 1fr 1fr"><span>${T('volatility','volatilidade')} ${r.v}</span><span>${T('method','método')} ${r.f}</span><span>log-loss ${r.ll.toFixed(4)}</span></div>`).join('')+`<button id="ap" style="margin-top:.6rem">${T('Apply the best','Aplicar a melhor')} (${b.v}, ${b.f})</button>`;
   $('#ap').onclick=()=>{S.P.vol=b.v;S.P.fin=b.f;try{localStorage.sumulaP3=JSON.stringify(S.P)}catch{}S.cache.clear();S.lab=null;vLab()};return}
  const [v,f]=jobs[i++];S.P.vol=v;S.P.fin=f;const h=holdout(L,S.P);res.push({v,f,ll:h&&h.n?h.ll/h.n:9});out.textContent=`${i}/${jobs.length}…`;setTimeout(step,20)};
 step()}
function vLab(){
 M(`<h1>Lab</h1><div id="lb"><p class="mu">${T('Computing…','Calculando…')}</p></div>`);
 setTimeout(()=>{const el=$('#lb');if(!el)return;const R=lab();el.innerHTML=R&&!R.none?labHtml(R):`<p class="empty">${T('Not enough fights with stats yet.','Ainda não há lutas suficientes com estatísticas.')}</p>`;const b=$('#tb');if(b)b.onclick=tune},30)}

function route(){
 const [,p,id,fid]=location.hash.split('/'),k=p||'events';
 document.documentElement.lang=S.pt?'pt-BR':'en';$('#lg').textContent=S.pt?'EN':'PT';
 $('#nv').innerHTML=[['events',T('Events','Eventos')],['ranking','Rankings'],['fighters',T('Fighters','Lutadores')],['sim',T('Simulator','Simulador')],['lab','Lab']].map(([x,l])=>`<a href="#/${x}" data-p="${x}">${l}</a>`).join('');
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===(k==='event'?'events':k==='fighter'?'fighters':k)));
 $('#ft').textContent=(S.meta.updated?T('Data updated ','Base atualizada em ')+new Date(S.meta.updated).toLocaleString(S.pt?'pt-BR':'en-US')+'. ':'')+T('Source: ufcstats.com','Fonte: ufcstats.com');
 const run=()=>{$('#m').onclick=null;$('#m').oninput=null;scrollTo(0,0);({events:vEvents,event:vEvent,ranking:vRank,fighters:vFighters,fighter:vFighter,sim:vSim,lab:vLab}[k]||vEvents)(decodeURIComponent(id||''),fid&&decodeURIComponent(fid))};
 document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches?document.startViewTransition(run):run();
}
init();
</script>
