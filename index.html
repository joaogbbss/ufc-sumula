<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100d0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Súmula UFC — Códice de Combate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpolygon points='12,2 28,2 38,12 38,28 28,38 12,38 2,28 2,12' fill='%23100d0a' stroke='%23d4a64a' stroke-width='2.4'/%3E%3Cpolygon points='20,8 30,20 20,32 10,20' fill='none' stroke='%23d4a64a' stroke-width='2'/%3E%3Ccircle cx='20' cy='20' r='3.5' fill='%23d4a64a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#100d0a;--bg2:#16110c;--s1:#1a1510;--s2:#241d15;--ln:#3a2f22;--ln2:#5a4731;
  --tx:#ede5d4;--mu:#9e8e77;--gd:#d4a64a;--gd2:#f0cf85;--cb:#a83232;--win:#4a9e6d;--loss:#c23b3b;
  --ink-on-gd:#140f08;--shadow:0 10px 28px rgba(0,0,0,.42);
  --oct:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
  --ch:polygon(0 7px,7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px));
  --d:"Cinzel",Georgia,"Times New Roman",serif;
  --b:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
}
[data-theme="parchment"]{
  color-scheme:light;
  --bg:#e9dec7;--bg2:#dfd1b4;--s1:#f4ecda;--s2:#e3d6bc;--ln:#c3b08c;--ln2:#8f7345;
  --tx:#241b12;--mu:#695842;--gd:#8d5f15;--gd2:#6b4408;--cb:#942323;--win:#236c42;--loss:#9e2424;
  --ink-on-gd:#fbf6ea;--shadow:0 8px 24px rgba(56,39,18,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--tx);font:400 15px/1.5 var(--b);font-variant-numeric:tabular-nums;
  background:
    radial-gradient(65% 380px at 50% 0,color-mix(in srgb,var(--gd) 13%,transparent),transparent 72%),
    radial-gradient(90% 500px at 50% 100%,color-mix(in srgb,var(--cb) 8%,transparent),transparent 75%),
    repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--tx) 1.4%,transparent) 3px 4px),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  transition:background-color .25s ease,color .25s ease;
}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* ---- Top Bar (KCD Codex Header) ---- */
.top{
  position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:.45rem;
  max-width:1060px;margin:0 auto;padding:.65rem clamp(.85rem,3vw,1.6rem);
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ln);
}
.top::after{
  content:"";position:absolute;left:clamp(.85rem,3vw,1.6rem);right:clamp(.85rem,3vw,1.6rem);bottom:-3px;height:1px;
  background:linear-gradient(90deg,transparent,var(--ln2) 25%,var(--gd) 50%,var(--ln2) 75%,transparent);opacity:.55;pointer-events:none;
}
.brand{display:flex;align-items:center;gap:.55rem;margin-right:auto;font:800 1.25rem var(--d);letter-spacing:.12em;white-space:nowrap}
.brand svg{width:1.75rem;height:1.75rem;flex:none}.brand em{font-style:normal;color:var(--gd)}
.ico{width:1.05rem;height:1.05rem;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.16em}

/* ---- Native APK Bottom Bar (Mobile) & Codex Tabs (Desktop) ---- */
nav{
  position:fixed;inset:auto 0 0;display:flex;z-index:18;
  background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--ln2);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -6px 24px rgba(0,0,0,.35);
}
nav a,nav .more{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  padding:.5rem .2rem .45rem;font:700 .66rem var(--d);letter-spacing:.07em;text-transform:uppercase;
  color:var(--mu);background:none;border:0;clip-path:none;transition:color .18s ease,background .18s ease;
}
nav a .ico,nav .more .ico{width:1.15rem;height:1.15rem}
nav a.on,nav .more.on{color:var(--gd);box-shadow:inset 0 2px var(--gd);background:color-mix(in srgb,var(--gd) 8%,transparent)}
@media(min-width:860px){
  body{padding-bottom:0}
  nav{position:static;border:0;background:none;backdrop-filter:none;padding:0;gap:.18rem;box-shadow:none}
  nav a{flex:none;flex-direction:row;gap:.38rem;padding:.42rem .75rem;font-size:.76rem;border-radius:3px;border:1px solid transparent}
  nav a .ico{width:.95rem;height:.95rem;opacity:.85}
  nav a:hover{color:var(--tx);border-color:var(--ln);background:color-mix(in srgb,var(--s2) 65%,transparent)}
  nav a.on{color:var(--ink-on-gd);background:linear-gradient(180deg,var(--gd2),var(--gd));border-color:var(--gd);box-shadow:0 2px 10px color-mix(in srgb,var(--gd) 28%,transparent)}
  nav a.on .ico{opacity:1}
}

/* ---- Main & Heraldic Typography ---- */
main{max-width:1040px;margin:0 auto;padding:.4rem clamp(.9rem,3.5vw,1.8rem) 2.6rem}
h1{
  font:800 clamp(1.75rem,5vw,2.65rem)/1.08 var(--d);letter-spacing:.07em;text-transform:uppercase;
  margin:.9rem 0 1.25rem;text-wrap:balance;color:var(--tx);
}
h1::after{
  content:"";display:block;width:min(14rem,55%);height:2px;margin-top:.55rem;
  background:linear-gradient(90deg,var(--gd) 0%,var(--ln2) 55%,transparent 100%);
}
h2{
  position:relative;font:700 1.12rem var(--d);letter-spacing:.1em;text-transform:uppercase;
  margin:1.75rem 0 .7rem;color:var(--gd);display:flex;align-items:center;gap:.55rem;
}
h2::before{content:"◆";font-size:.6rem;color:var(--gd);opacity:.85}
.mu{color:var(--mu)}.sm{font-size:.82rem}

/* ---- Inputs & Tactile KCD Buttons ---- */
input,select,textarea{
  width:100%;padding:.62rem .8rem;border:1px solid var(--ln);border-radius:3px;
  background:var(--s1);color:var(--tx);font:500 .92rem var(--b);
  transition:border-color .18s ease,box-shadow .18s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--gd);box-shadow:0 0 0 2px color-mix(in srgb,var(--gd) 18%,transparent);outline:none}
textarea{min-height:4.5rem}
button,.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.38rem;
  font:600 .8rem var(--b);letter-spacing:.02em;cursor:pointer;
  border:1px solid var(--ln2);border-radius:3px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--s2) 95%,var(--tx) 5%),var(--s2));
  color:var(--tx);padding:.44rem .82rem;transition:all .16s ease;
}
button:hover,.btn:hover{border-color:var(--gd);color:var(--gd2);background:color-mix(in srgb,var(--gd) 12%,var(--s2))}
button:active,.btn:active{transform:scale(.975)}
.lg{
  padding:.38rem .58rem;font:700 .76rem var(--d);letter-spacing:.08em;
  border:1px solid var(--ln);background:var(--s1);color:var(--tx);
}
.lg:hover{border-color:var(--gd);color:var(--gd)}

/* ---- Codex Engraved Cards ---- */
.card{
  position:relative;
  background:linear-gradient(180deg,var(--s1),color-mix(in srgb,var(--s1) 86%,var(--bg)));
  border:1px solid var(--ln);border-radius:4px;
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--gd) 10%,transparent),var(--shadow);
  margin-bottom:.7rem;transition:border-color .18s ease,transform .15s ease;
}
a.card:hover{border-color:var(--ln2)}
a.card:active{transform:scale(.993)}

/* ---- Avatars & Medallions ---- */
.ring{position:relative;flex:none;width:2.7rem;aspect-ratio:1;clip-path:var(--oct);background:var(--rc,var(--ln2))}
.ring>span{position:absolute;inset:2px;clip-path:var(--oct);background:var(--s1);display:grid;place-items:center;font:800 .95rem var(--d);color:var(--gd)}
.ring.sm{width:2.2rem}.ring.sm>span{font-size:.82rem}
.ring.big{width:5.3rem;--rc:var(--gd)}.ring.big>span{inset:3px;font-size:1.65rem}

.ev{display:grid;grid-template-columns:3.5rem 1fr;gap:0 1rem;padding:.85rem 1.05rem}
.day{grid-row:span 2;font:800 2.15rem/1 var(--d);color:var(--gd);text-align:center}
.en{font-weight:700}
.fight{container-type:inline-size;padding:.95rem 1.05rem}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:center}
.fa{font:700 1.05rem/1.18 var(--d);text-transform:uppercase;letter-spacing:.04em;text-wrap:balance}
.fa.w{color:var(--tx)}.fa.l{color:var(--mu)}.fa:last-child{text-align:right}
.fa.w::before{content:"W · ";color:var(--win);font-weight:800}
html[lang^=pt] .fa.w::before{content:"V · "}
.fi{display:flex;flex-wrap:wrap;gap:.35rem .65rem;align-items:center;margin-top:.65rem;font-size:.8rem;color:var(--mu)}
.fi button{margin-left:auto}
.tag{
  display:inline-flex;align-items:center;gap:.25rem;
  color:var(--ink-on-gd);background:var(--gd);
  padding:.1rem .48rem;border-radius:2px;font:700 .7rem var(--b);letter-spacing:.04em;text-transform:uppercase;
}
.tag.ros-act{background:color-mix(in srgb,var(--win) 18%,var(--s2));color:var(--win);border:1px solid color-mix(in srgb,var(--win) 45%,transparent)}
.tag.ros-rel{background:color-mix(in srgb,var(--loss) 18%,var(--s2));color:var(--loss);border:1px solid color-mix(in srgb,var(--loss) 45%,transparent)}
.tag.ros-sus{background:color-mix(in srgb,#d97706 18%,var(--s2));color:#f59e0b;border:1px solid color-mix(in srgb,#d97706 45%,transparent)}
.tag.ros-out{background:var(--s2);color:var(--mu);border:1px solid var(--ln)}
.tag.sty-tag{background:color-mix(in srgb,var(--gd) 10%,var(--s2));color:var(--gd2);border:1px solid color-mix(in srgb,var(--gd) 30%,transparent)}

@container (min-width:560px){.fa{font-size:1.3rem}}
.hl{box-shadow:inset 0 0 0 1.5px var(--gd),0 0 18px color-mix(in srgb,var(--gd) 18%,transparent)}
.st{display:none;padding-top:.8rem}.open .st{display:block}
.sr{display:grid;grid-template-columns:1fr auto 1fr;gap:.15rem .7rem;font-size:.88rem;padding:.32rem 0}
.sr .lb{color:var(--mu);text-align:center}.sr span:last-of-type{text-align:right}
.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.bar i{display:block;height:4px;width:var(--w);background:var(--c);border-radius:1px}.bar i:first-child{justify-self:end}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:.75rem;margin-bottom:.95rem}
.ctl label{display:grid;gap:.25rem;font:600 .74rem var(--b);text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.rk{display:grid;grid-template-columns:2.7rem 1fr auto;align-items:center;gap:.85rem;padding:.68rem .95rem}
.rk:nth-child(-n+3){--rc:#b8aa8f}.rk:first-child{--rc:var(--gd)}
.nm{font-weight:700;min-width:0}.nm small{display:block;font-weight:400;color:var(--mu);margin-top:.12rem}
.mb{display:block;height:3px;margin-top:.4rem;background:var(--ln);border-radius:2px;overflow:hidden}.mb b{display:block;height:100%;background:linear-gradient(90deg,var(--ln2),var(--gd))}
.rt{font:800 1.55rem/1 var(--d);text-align:right;color:var(--gd2)}.rt small{display:block;font:500 .72rem var(--b);color:var(--mu);margin-top:.18rem}
.peek-btn{padding:.22rem .48rem;font-size:.7rem;border-color:var(--ln);color:var(--mu);margin-left:.35rem}
.peek-btn:hover{border-color:var(--gd);color:var(--gd)}

details{padding:.85rem 1.05rem}
summary{cursor:pointer;font:700 .95rem var(--d);letter-spacing:.08em;text-transform:uppercase;color:var(--tx)}
details p,details li{font-size:.88rem;color:var(--mu)}details b{color:var(--tx)}
.hero{display:flex;gap:1.15rem;align-items:center;margin:.7rem 0 1.1rem}.hero h1{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.9rem}
.sp{width:100%;height:130px;display:block}
.bio{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem 1rem;margin:0;padding:1rem 1.1rem}
.bio dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}.bio dd{margin:0;font-weight:700}
.h{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.6rem;padding:.62rem 0;border-bottom:1px solid var(--ln);font-size:.9rem}
.up{color:var(--win)}.dn{color:var(--loss)}
.sel{display:flex;align-items:center;gap:.7rem}.sel button{margin-left:auto}
.res button{display:flex;width:100%;justify-content:space-between;margin-top:.3rem;text-align:left}
.pb{display:flex;height:2.2rem;margin:.7rem 0;font:800 1.05rem var(--d);border-radius:3px;overflow:hidden;border:1px solid var(--ln2)}
.pb i{display:flex;align-items:center;padding:0 .7rem;font-style:normal;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);min-width:3rem}
.tb{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr;gap:.3rem .6rem;padding:.48rem .45rem;border-bottom:1px solid var(--ln);font-size:.86rem;align-items:center}
.tb.best{color:var(--gd)}.tb.hd{color:var(--mu);font:700 .72rem var(--d);letter-spacing:.07em;text-transform:uppercase;background:var(--s2)}
.tb:not(.hd):nth-child(even){background:color-mix(in srgb,var(--s2) 40%,transparent)}
.pk.on,.seg button.on{background:linear-gradient(180deg,var(--gd2),var(--gd));color:var(--ink-on-gd);border-color:var(--gd);font-weight:700}
.empty{padding:1.8rem 0;color:var(--mu)}
footer{max-width:1040px;margin:0 auto;padding:.6rem clamp(.9rem,3.5vw,1.8rem) 1.6rem;font-size:.78rem;color:var(--mu);border-top:1px solid var(--ln)}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

.seg{display:flex;flex-wrap:wrap;gap:.38rem;margin:0 0 .95rem}
.xs{display:grid;grid-template-columns:1fr;gap:.65rem}
@media(min-width:620px){.xs{grid-template-columns:1fr 1fr}}
.chgrid{display:grid;grid-template-columns:1fr;gap:.65rem}
@media(min-width:560px){.chgrid{grid-template-columns:1fr 1fr}}
@media(min-width:860px){.chgrid{grid-template-columns:1fr 1fr 1fr}}
.chc{display:flex;align-items:center;gap:.8rem;padding:.75rem .95rem;margin-bottom:0}
.chc .chd{font:700 .72rem var(--d);letter-spacing:.09em;text-transform:uppercase;color:var(--gd)}
.chc .chn{font:700 1.02rem/1.15 var(--d);text-transform:uppercase}
.stk{display:flex;height:9px;margin:.5rem 0;border-radius:2px;overflow:hidden}.stk i{display:block}
.xg{display:flex;flex-wrap:wrap;gap:.25rem .9rem;font-size:.83rem;color:var(--mu)}.xg b{color:var(--tx)}
.fc{max-width:340px;padding:1rem 1.2rem 1.1rem;border-radius:6px;border:2px solid rgba(20,17,10,.35);color:#14110a;background:linear-gradient(155deg,var(--c1),var(--c2));margin:.4rem 0 1rem;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.fc.legend{--c1:#f7e4a3;--c2:#c9952a}.fc.elite{--c1:#eed589;--c2:#b48120}.fc.gold{--c1:#e6c978;--c2:#966d1b}.fc.silver{--c1:#e0e4eb;--c2:#8791a0}.fc.bronze{--c1:#d8a374;--c2:#7d4d25}
.fct{display:flex;justify-content:space-between;align-items:center}.fco{font:900 3.1rem/1 var(--d)}.fco small{display:block;font:800 .8rem var(--d);letter-spacing:.12em}.fco em{display:block;font:800 .82rem var(--d);letter-spacing:.1em;font-style:normal;text-transform:uppercase;opacity:.75}
.fc .ring.big{--rc:#14110a}.fc .ring>span{background:#f3efe2;color:#14110a}
.fcn{font:800 1.4rem/1.1 var(--d);text-transform:uppercase;margin-top:.5rem}.fcd{font-size:.78rem;opacity:.72;margin-bottom:.6rem}
.fca{display:grid;grid-template-columns:2.6rem 1fr 2rem;gap:.5rem;align-items:center;font:700 .85rem var(--d);letter-spacing:.05em}
.fca i{display:block;height:6px;background:rgba(0,0,0,.18);border-radius:2px}.fca u{display:block;height:100%;background:#14110a}.fca span{text-align:right}
.fcf{margin-top:.6rem;font:800 .7rem var(--d);letter-spacing:.22em;opacity:.55}
.rdr{width:100%;max-width:340px;display:block;margin:0 auto}

.up-ev{padding:0;overflow:hidden}
.up-ev>summary{list-style:none;display:grid;grid-template-columns:auto 1fr;column-gap:.7rem;row-gap:.25rem;align-items:center;cursor:pointer;padding:.85rem 1.05rem;-webkit-tap-highlight-color:transparent}
.up-ev>summary::-webkit-details-marker{display:none}
.up-ev>summary::before{content:'▸';grid-row:1/3;color:var(--gd);font-size:1.25rem;line-height:1;transition:transform .18s ease}
.up-ev[open]>summary::before{transform:rotate(90deg)}
.up-ev .ue-t{font:700 1.1rem var(--d);text-transform:uppercase;line-height:1.15;letter-spacing:.04em}
.up-ev .ue-b{grid-column:2;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.up-ev .ue-body{padding:0 .95rem .95rem}
.up-ev .ue-body>.card.fight{margin:.6rem 0 0}
.up-ev .fight .st{display:none}.up-ev .fight.open .st{display:block}
.rdrow{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;margin:.3rem 0}.rdrow b{min-width:2rem}

.up-fx .fa{display:flex;align-items:center;gap:.5rem;min-width:0}.up-fx .fa:last-child{justify-content:flex-end;text-align:right}
.fa .ring{display:inline-block;vertical-align:middle;flex:none}.fx .fa>.ring{margin:0 .35rem}
.fav{height:6px;background:var(--cb);overflow:hidden;margin:.6rem 0 .2rem;border-radius:2px}.fav i{display:block;height:100%;background:var(--gd)}
.fvl{display:flex;justify-content:space-between;align-items:center;font-size:.82rem}
.fa2{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}.fa2 .pickbox{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.xbar{display:inline-flex;gap:.28rem;flex-wrap:wrap;align-items:center;margin-left:auto;font-family:var(--b);text-transform:none;letter-spacing:0}
.xbar button{font:600 .7rem var(--b);padding:.24rem .5rem;color:var(--mu);border-color:var(--ln);text-transform:none;letter-spacing:0}
h2.xh{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .8rem}h1 .xbar{margin-left:.8rem;vertical-align:middle}.xrow{display:flex;justify-content:flex-end;margin:.2rem 0 .5rem}

nav .more{display:none}
@media(max-width:859px){nav a.mo{display:none}nav .more{display:flex}}
.sheet{position:fixed;inset:0;z-index:40;display:none}.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(6,4,2,.72);backdrop-filter:blur(4px)}
.sheet .pn{
  position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;
  background:var(--s1);border-top:2px solid var(--gd);border-radius:14px 14px 0 0;
  padding:.95rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));max-width:640px;margin:auto;
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
}
.sheet .grab{width:42px;height:4px;background:var(--ln2);border-radius:2px;margin:0 auto .9rem}
.sheet .gr{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.shc{
  display:flex;align-items:center;gap:.65rem;padding:.9rem 1rem;background:var(--s2);
  border:1px solid var(--ln);border-radius:4px;font:700 .9rem var(--d);letter-spacing:.06em;text-transform:uppercase;color:var(--tx);
}
.shc.on{background:var(--gd);color:var(--ink-on-gd);border-color:var(--gd)}
.sheet.gs .pn{top:0;bottom:auto;border-top:0;border-bottom:2px solid var(--gd);border-radius:0 0 14px 14px}
.gsr{display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;margin:.4rem 0}
.gsr .nm{flex:1;min-width:0;font:700 .92rem var(--d);text-transform:uppercase}.gsr .nm small{display:block;font:400 .75rem var(--b);color:var(--mu);text-transform:none}
.gsb{display:flex;gap:.3rem;flex-wrap:wrap}.gsb a{font:600 .74rem var(--b);padding:.28rem .58rem;background:var(--s2);border:1px solid var(--ln);border-radius:3px;color:var(--tx)}
#gsi{width:100%;margin-bottom:.4rem}

/* ---- Quick-Peek Character Inspection Drawer (KCD Style) ---- */
.qpk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.75rem 0}
.qpk-stat{background:var(--s2);border:1px solid var(--ln);border-radius:3px;padding:.5rem .65rem;text-align:center}
.qpk-stat small{display:block;font:600 .66rem var(--b);text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.qpk-stat b{font:800 1.25rem var(--d);color:var(--gd2)}

.totop{position:fixed;right:1rem;bottom:calc(4.8rem + env(safe-area-inset-bottom));z-index:20;display:none;width:2.6rem;height:2.6rem;padding:0;font:800 1.15rem var(--d);background:var(--gd);color:var(--ink-on-gd);border:1px solid var(--gd2);clip-path:var(--oct)}.totop.show{display:block}
@media(min-width:860px){.totop{bottom:1.2rem}}
.seg.jmp{position:sticky;top:3.3rem;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);padding:.45rem 0;margin-bottom:.6rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.seg.jmp::-webkit-scrollbar{display:none}.seg.jmp button{flex:none;white-space:nowrap}
[id^=sc-],[id^=lb-]{scroll-margin-top:6.5rem}
.spw{margin-top:.6rem}.spi{font-size:.82rem;color:var(--mu);min-height:1.4rem}.spc{position:relative}
.spd{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);padding:0;background:transparent;border:0;border-radius:50%}.spd::after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--gd)}.spd.on::after{inset:5px;background:var(--tx)}
.bn{font:700 .7rem var(--b);color:var(--gd);white-space:nowrap}

/* ---- Lutador Ideal: Códice Anatômico Vitruviano (KCD) ---- */
.idl-wrap{display:grid;grid-template-columns:1fr;gap:1.1rem;align-items:start}
@media(min-width:780px){.idl-wrap{grid-template-columns:390px 1fr}}
.idl-stage{position:relative;padding:1rem;background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--gd) 14%,transparent),color-mix(in srgb,var(--cb) 5%,transparent) 58%,transparent 80%),var(--s1);overflow:hidden}
.idl-svg{width:100%;max-width:370px;height:auto;display:block;margin:0 auto;user-select:none;-webkit-tap-highlight-color:transparent}
.idl-z{cursor:pointer;transition:all .22s ease}
.idl-z .z-body{fill:color-mix(in srgb,var(--gd) 5%,transparent);stroke:color-mix(in srgb,var(--tx) 30%,transparent);stroke-width:1.4;transition:all .22s ease}
.idl-z .z-node{fill:var(--s2);stroke:var(--gd);stroke-width:1.8;transition:all .22s ease}
.idl-z .z-lbl{fill:var(--mu);font:700 9.5px var(--d);letter-spacing:.1em;text-transform:uppercase;transition:fill .2s ease}
.idl-z .z-sub{fill:var(--tx);font:600 10px var(--b);transition:fill .2s ease}
.idl-z .z-line{stroke:color-mix(in srgb,var(--gd) 42%,transparent);stroke-width:1.1;stroke-dasharray:3 3;transition:all .22s ease}
.idl-z:hover .z-body,.idl-z.on .z-body{fill:color-mix(in srgb,var(--gd) 26%,transparent);stroke:var(--gd);stroke-width:2.3;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--gd) 50%,transparent))}
.idl-z:hover .z-node,.idl-z.on .z-node{fill:var(--gd);stroke:var(--tx);r:6.5}
.idl-z:hover .z-lbl,.idl-z.on .z-lbl{fill:var(--gd)}
.idl-z:hover .z-line,.idl-z.on .z-line{stroke:var(--gd);stroke-width:1.8;stroke-dasharray:none}
.idl-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.65rem;margin-top:.8rem}
.idl-sc{padding:.75rem .95rem;cursor:pointer;transition:transform .15s ease,border-color .15s ease;margin-bottom:0}
.idl-sc:hover,.idl-sc.on{border-color:var(--gd);box-shadow:inset 0 0 0 1px var(--gd),var(--shadow);background:color-mix(in srgb,var(--gd) 9%,var(--s1))}

  <a class="brand" href="#/home">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <polygon points="12,2 28,2 38,12 38,28 28,38 12,38 2,28 2,12" fill="none" stroke="var(--gd)" stroke-width="2.2"/>
      <polygon points="20,8 30,20 20,32 10,20" fill="none" stroke="var(--gd)" stroke-width="1.6"/>

</div>
<main id="m"><p class="mu" style="padding:2rem 0">Carregando base de dados do UFC…</p></main>
<footer id="ft"></footer>

<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('m');
  if (el) el.innerHTML = '<div class="card" style="padding:1rem"><b class="dn">Erro JS detectado:</b><p class="mu sm">' + (e.message || e) + ' (linha ' + (e.lineno || '?') + ')</p></div>';
});
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('m');
  if (el) el.innerHTML = '<div class="card" style="padding:1rem"><b class="dn">Erro de Promise:</b><p class="mu sm">' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</p></div>';

<script>
const $ = s => document.querySelector(s);
const M = h => { $('#m').innerHTML = h; if (window.XEXP) window.XEXP.attach(); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S = {
  ev: [], fg: [], F: new Map(),
  ov: {merges:{}, div:{}, exclude:[]},
  meta: {},
  P: {vol:80, fin:1, title:.25, tw:1, min:1, act:2},
  mode: 'cur', div: 'ALL', pt: true,
  sim: {a:'', b:'', m:'cur', d:'ALL'},
  ps: {}, cache: new Map(), lg: null,
  me: {ph:{}, fav:{}, note:{}, log:{}},
  up: [], simLast: null
};

/* sumulaP4: o mínimo de lutas padrão caiu de 3 para 1; preferências antigas (P3) são aproveitadas, menos esse campo */
try { const o = JSON.parse(localStorage.sumulaP4 || 'null'); if (o) Object.assign(S.P, o); else { const { min, ...r } = JSON.parse(localStorage.sumulaP3 || '{}'); Object.assign(S.P, r); } } catch {}
try { Object.assign(S.me, JSON.parse(localStorage.sumulaMe || '{}')); } catch {}
try { if (localStorage.sumulaLang) S.pt = localStorage.sumulaLang === 'pt'; } catch {}

const T = (en, pt) => S.pt ? pt : en;
const saveMe = () => {
  try { localStorage.sumulaMe = JSON.stringify(S.me); }
  catch { alert(T('Storage is full. Remove some photos.', 'Armazenamento cheio. Remova algumas fotos.')); }
};
const mid = id => S.ov.merges[id] || id;
const fmt = d => new Date(d + 'T00:00').toLocaleDateString(S.pt ? 'pt-BR' : 'en-US', {day:'2-digit', month:'short', year:'numeric'});
const name = x => S.F.get(mid(x.id))?.name || x.name;
const ini = n => String(n || '').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
// Foto do lutador: 1) a que você colocou; 2) a VERIFICADA (data/photos.json); 3) a do scraper, enquanto ainda não foi auditada
const photoOf = id => { const k = mid(id); return S.me.ph[id] || S.me.ph[k] || S.pu?.[k] || (S.rej?.has(k) ? null : S.F.get(k)?.img) || null; };
// As iniciais ficam SEMPRE por baixo; se a foto não carregar, ela some e as iniciais aparecem (nunca mais octógono vazio)
const av = (id, n, c = '') => {
  const im = photoOf(id);
  return `<span class="ring ${c}"><span>${esc(ini(n))}${im ? `<img src="${esc(im)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top">` : ''}</span></span>`;
};
const empty = () => `<p class="empty">${
  S.ev.length
    ? T('Nothing found.', 'Nada encontrado.')
    : location.protocol === 'file:'
      ? T('Opened via file:// — Run "python -m http.server 8000" or open via GitHub Pages.', 'Aberto via file:// — Rode "python -m http.server 8000" ou abra pelo GitHub Pages.')
      : T('No data yet. On GitHub, open Actions and run "Atualizar base UFC".', 'Ainda não há dados. No GitHub, abra Actions e rode "Atualizar base UFC".')
}</p>`;

const LB = {
  KD: ['Knockdowns', 'Knockdowns'],
  'Sig. str.': ['Significant strikes', 'Golpes significativos'],
  'Total str.': ['Total strikes', 'Golpes totais'],
  Td: ['Takedowns', 'Quedas'],
  'Sub. att': ['Submission attempts', 'Finalizações tentadas'],
  'Rev.': ['Reversals', 'Viradas'],
  Ctrl: ['Control time', 'Controle'],
  Head: ['Head', 'Cabeça'],
  Body: ['Body', 'Corpo'],
  Leg: ['Leg', 'Perna'],
  Distance: ['Distance', 'Distância'],
  Clinch: ['Clinch', 'Clinch'],
  Ground: ['Ground', 'Solo']
};
const lb = k => LB[k][S.pt ? 1 : 0];
const YR = 31557600000, U = 400 / Math.LN10;

async function fetchJson(n) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch('data/' + n + '.json', {cache: 'no-cache', signal: ctrl.signal});
    clearTimeout(id);
    return r.ok ? await r.json() : null;
  } catch {
    clearTimeout(id);
    return null;
  }
}

async function init() {
  const [ev, fg, fi, ov, meta, up, ph, ros] = await Promise.all(['events', 'fights', 'fighters', 'overrides', 'meta', 'upcoming', 'photos', 'roster'].map(fetchJson));
    S.pu = (ph && ph.photos) || null; S.rej = ph && ph.rej ? new Set(ph.rej) : null;   // fotos verificadas pelo photos.py
    S.ros = ros || null;
    fetchJson('decisions').then(j => { S.dd = j; }).catch(() => { S.dd = null; });
    fetchJson('ufc_rankings').then(j => { S.urk = j; }).catch(() => { S.urk = null; });
    fetchJson('analytics').then(j => { S.an = j; }).catch(() => { S.an = null; });
  if (ov) S.ov = {merges:{}, div:{}, exclude:[], ...ov};
  S.ev = ev || [];
  S.meta = meta || {};
  S.up = (up && up.events) || [];
  (fi || []).forEach(f => S.F.set(f.id, f));
  // Hidrata status de Roster diretamente de data/roster.json (prioridade máxima: dispensas/aposentadorias > suspensos > plantel ativo > ex-UFC)
  if (S.ros && S.ros.by_div) {
    const actMap = new Map(), depMap = new Map(), suspSet = new Set(), upSet = new Set();
    for (const [dv, info] of Object.entries(S.ros.by_div)) for (const id of (info.ids || [])) actMap.set(mid(id), dv);
    for (const d of (S.ros.departures || [])) if (d.id) depMap.set(mid(d.id), d.kind || 'released');
    for (const s of (S.ros.suspended || [])) if (s.id) suspSet.add(mid(s.id));
    for (const e of S.up) for (const f of (e.fights || [])) { if (f.a?.id) upSet.add(mid(f.a.id)); if (f.b?.id) upSet.add(mid(f.b.id)); }
    for (const [id, f] of S.F) {
      if (depMap.has(id) && !actMap.has(id)) { f.roster = depMap.get(id); delete f.roster_div; }
      else if (suspSet.has(id)) { f.roster = 'suspended'; }
      else if (actMap.has(id) || upSet.has(id)) { f.roster = 'active'; if (actMap.has(id)) f.roster_div = actMap.get(id); }
      else { f.roster = 'former'; delete f.roster_div; }
    }
  }
  S.fg = (fg || []).filter(f => !S.ov.exclude.includes(f.id)).map(f => ({...f, div: S.ov.div[f.id] || f.div}));
  $('#lg').onclick = () => {
    S.pt = !S.pt;
    try { localStorage.sumulaLang = S.pt ? 'pt' : 'en'; } catch {}
    route();
  };
  const applyTheme = t => {
    const isP = t === 'parchment';
    document.documentElement.dataset.theme = isP ? 'parchment' : 'dark';
    const mc = document.querySelector('meta[name="theme-color"]');
    if (mc) mc.content = isP ? '#e9dec7' : '#100d0a';
    const tb = $('#th');
    if (tb) {
      tb.title = isP ? T('Switch to Obsidian & Bronze', 'Alternar para Obsidiana & Bronze') : T('Switch to KCD Parchment', 'Alternar para Pergaminho KCD');
      tb.innerHTML = isP
        ? '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>'
        : '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>';
    }
  };
  try { applyTheme(localStorage.sumulaTheme || 'dark'); } catch { applyTheme('dark'); }
  const thBtn = $('#th');
  if (thBtn) thBtn.onclick = () => {
    const nx = document.documentElement.dataset.theme === 'parchment' ? 'dark' : 'parchment';
    try { localStorage.sumulaTheme = nx; } catch {}
    applyTheme(nx);
  };
  uiInit();
  if (window.XLOAD) await window.XLOAD();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  addEventListener('hashchange', route);
  route();
}

/* ---------- Rating engine: Whole-History Rating (Coulom, 2008) ---------- */
function dom(f) {
  const m = f.method || '';
  if (/^(ko|tko|sub)/i.test(m)) return 1;
  return 1 - (/dq|split/i.test(m) ? .3 : /major/i.test(m) ? .2 : /decision/i.test(m) ? .1 : 0) * S.P.fin;
}
const scope = (d = S.div) => S.fg.filter(f => f.res !== 'nc' && (d === 'ALL' || f.div === d)).sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : (y.ord || 0) - (x.ord || 0));
const TG = (t, won) => !t ? '' : ({
  conq: won ? T('won the belt', 'conquistou o cinturão') : T('lost the belt', 'perdeu o cinturão'),
  vago: won ? T('won the vacant belt', 'conquistou o cinturão vago') : T('fought for the vacant belt', 'disputou o cinturão vago'),
  def: won ? T('defended the belt', 'defendeu o cinturão') : T('fought for the belt', 'disputou o cinturão'),
  int: won ? T('won the interim belt', 'conquistou o interino') : T('fought for the interim belt', 'disputou o interino')
})[t];

const TOURN_RE = /ultimate fighter|\btuf\b|road to ufc|tournament|ultimate ultimate|ultimate japan/i;
const isTitle = f => (!!f.title || /championship/i.test(f.tt || '')) && !TOURN_RE.test(f.tt || '');

function whr(L, P) {
  const w2 = (P.vol / U) ** 2, tau2 = 6.25;
  const N = new Map(), tag = new Map(), ch = new Map(), cnt = new Map(), rg = [], op = new Map();
  const divsInL = new Set(L.map(f => f.div));
  const proms = (S.ov.title_promotions || []).filter(p => divsInL.has(p.div)).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  let pi = 0;
  const applyProm = dt => {
    while (pi < proms.length && (!dt || proms[pi].date <= dt)) {
      const p = proms[pi++], pid = mid(p.id);
      if (ch.get(p.div) === pid) continue;
      const o = op.get(p.div);
      if (o && !o.end) o.end = o.last;
      const c = cnt.get(pid) || {cq:0, df:0, iv:0};
      c.cq++; cnt.set(pid, c); ch.set(p.div, pid);
      const n = {id:pid, div:p.div, start:p.date, last:p.date, end:null, def:0};
      op.set(p.div, n); rg.push(n);
    }
  };
  for (const f of L) {
    if (!isTitle(f) || (f.res !== 'a' && f.res !== 'b')) continue;
    applyProm(f.date);
    const W = mid(f[f.res].id), Lo = mid(f[f.res === 'a' ? 'b' : 'a'].id);
    const c = cnt.get(W) || {cq:0, df:0, iv:0};
    cnt.set(W, c);
    if (/interim/i.test(f.tt || '')) { tag.set(f.id, 'int'); c.iv++; continue; }
    const cur = ch.get(f.div), o = op.get(f.div);
    if (cur === W) {
      tag.set(f.id, 'def'); c.df++;
      if (o) { o.def++; o.last = f.date; }
    } else {
      tag.set(f.id, cur === Lo ? 'conq' : 'vago'); c.cq++; ch.set(f.div, W);
      if (o) o.end = cur === Lo ? f.date : o.last;
      const n = {id:W, div:f.div, start:f.date, last:f.date, end:null, def:0};
      op.set(f.div, n); rg.push(n);
    }
  }
  applyProm(null);
  for (const v of (S.ov.title_vacancies || [])) {
    for (const r of rg) {
      if (r.div === v.div && r.last <= v.after && (!r.end || r.end === r.last)) r.end = v.end;
    }
  }
  for (const f of L) {
    const ia = mid(f.a.id), ib = mid(f.b.id);
    if (ia === ib) continue;
    const t = Date.parse(f.date) / YR, w = f.res === 'draw' ? .5 : dom(f);
    const sa = f.res === 'a' ? w : f.res === 'b' ? 1 - w : .5;
    const ti = isTitle(f), m = ti ? 1 + P.title : 1, ip = /interim/i.test(f.tt || '');
    const na = {t, r:0, gs:[], f:f.id, id:ia, dt:f.date, ti, ip, dv:f.div};
    const nb = {t, r:0, gs:[], f:f.id, id:ib, dt:f.date, ti, ip, dv:f.div};
    na.gs.push({o:nb, s:sa, m}); nb.gs.push({o:na, s:1 - sa, m});
    for (const [id, n] of [[ia, na], [ib, nb]]) {
      if (!N.has(id)) N.set(id, []);
      N.get(id).push(n);
    }
  }
  const solve = a => {
    const n = a.length, d = new Array(n), e = new Array(n), g = new Array(n);
    let mx = 0;
    for (let i = 0; i < n; i++) {
      const x = a[i]; let gi = 0, di = 0;
      for (const k of x.gs) {
        const p = 1 / (1 + Math.exp(k.o.r - x.r));
        gi += k.m * (k.s - p); di += k.m * p * (1 - p);
      }
      if (i === 0) { gi -= x.r / tau2; di += 1 / tau2; }
      else { const v = w2 * Math.max(x.t - a[i - 1].t, .05); gi -= (x.r - a[i - 1].r) / v; di += 1 / v; e[i - 1] = -1 / v; }
      if (i < n - 1) { const v = w2 * Math.max(a[i + 1].t - x.t, .05); gi += (a[i + 1].r - x.r) / v; di += 1 / v; }
      d[i] = di; g[i] = gi;
    }
    for (let i = 1; i < n; i++) { const f = e[i - 1] / d[i - 1]; d[i] -= f * e[i - 1]; g[i] -= f * g[i - 1]; }
    for (let i = 0; i < n; i++) a[i].vr = 1 / d[i];
    g[n - 1] /= d[n - 1];
    for (let i = n - 2; i >= 0; i--) g[i] = (g[i] - e[i] * g[i + 1]) / d[i];
    for (let i = 0; i < n; i++) { const st = Math.max(-2, Math.min(2, g[i])); a[i].r += st; mx = Math.max(mx, Math.abs(st)); }
    return mx;
  };
  const A = [...N.values()];
  for (let it = 0; it < 40; it++) {
    let mx = 0;
    for (const a of A) mx = Math.max(mx, solve(a));
    if (mx < 2e-3) break;
  }
  const rs = [];
  for (const a of A) for (const x of a) rs.push(x.r);
  rs.sort((u, v) => u - v);
  const ref = rs.length ? rs[Math.floor(.85 * (rs.length - 1))] : 0;
  const rows = [...N].map(([id, a]) => {
    let w = 0, l = 0, d = 0, pk = a[0], v = 0;
    const dhs = new Map();
    for (const x of a) {
      const g = x.gs[0], s = g.s, pf = 1 / (1 + Math.exp(g.o.r - ref));
      s > .5 ? w++ : s < .5 ? l++ : d++;
      if (x.r > pk.r) pk = x;
      const dvPt = (s > .5 ? s * (1 - pf) : s < .5 ? -pf : .5 - pf) * (x.ti ? (x.ip ? 1 + P.tw / 2 : 1 + P.tw) : 1);
      v += dvPt;
      if (x.dv) dhs.set(x.dv, (dhs.get(x.dv) || 0) + 10 * dvPt);
    }
    return {id, n:a.length, w, l, d, last:a.at(-1).dt, cur:1500 + U * a.at(-1).r, pk:1500 + U * pk.r, pkd:pk.dt, hs:10 * v, dhs, pn:pk, ln:a.at(-1), ...(cnt.get(id) || {cq:0, df:0, iv:0})};
  });
  return {rows, N, tag, rg, RM: new Map(rows.map(x => [x.id, x]))};
}

function getE(d) {
  const k = d + '|' + JSON.stringify(S.P);
  if (!S.cache.has(k)) {
    if (S.cache.size > 20) S.cache.clear();
    S.cache.set(k, whr(scope(d), S.P));
  }
  return S.cache.get(k);
}

/* Divisões de cada lutador: cartel, última luta, minutos e cinturões POR categoria. */
const NONSTD = new Set(['Catch Weight', 'Open Weight', 'Outros']);
function dm() {
  if (S.dmc && S.dmc.n === S.fg.length) return S.dmc.m;
  const m = new Map();
  for (const f of S.fg) {
    if (f.res === 'nc') continue;
    const mn = mins(f) || 0;
    for (const s of ['a', 'b']) {
      const id = mid(f[s].id);

/* ---------- Precisão e defesa por alvo/posição, ritmo por round, desgaste, técnicas e cinturão linear ---------- */
const attm = v => { const m = /of\s*(\d+)/.exec(String(v == null ? '' : v)); return m ? +m[1] : 0; };
const SIGL = () => ({Head: T('Head', 'Cabeça'), Body: T('Body', 'Corpo'), Leg: T('Leg', 'Perna'), Distance: T('Distance', 'Distância'), Clinch: 'Clinch', Ground: T('Ground', 'Solo')});

}

  const L = SIGL();

/* ritmo por round e rounds de campeonato (R4/R5), a partir de f.rounds.totals */
function roundsProfile(id) {
  const R = [0, 1, 2, 3, 4].map(() => ({c: 0, l: 0, a: 0, kf: 0, ka: 0, fought: 0, fl: 0, fa: 0, td: 0})); let w4 = 0, any = false;
  for (const f of S.fg) {
    if (mid(f.a.id) !== id && mid(f.b.id) !== id) continue;
    const me = mid(f.a.id) === id ? 'a' : 'b', op = me === 'a' ? 'b' : 'a', rt = f.rounds && f.rounds.totals, last = parseInt(f.round) || 0, dec = /decision/i.test(f.method || '');
    if (f.res === me && ((rt && rt.length >= 4) || last >= 4)) w4++;
    if (!rt) continue;
    rt.forEach((r, i) => {
      if (i > 4 || !r[me] || !r[op]) return;
      const x = R[i], l = num(r[me]['Sig. str.']), a = num(r[op]['Sig. str.']); any = true;
      x.fought++; x.fl += l; x.fa += a; x.td += num(r[me].Td) - num(r[op].Td);
      if (dec || i + 1 < last) { x.c++; x.l += l; x.a += a; x.kf += num(r[me].KD); x.ka += num(r[op].KD); }   // só round COMPLETO entra no perfil de ritmo
    });
  }
  const sh = i => R[i].c ? R[i].l / ((R[i].l + R[i].a) || 1) : null, ok = R[0].c >= 4 && R[2].c >= 4, d = ok ? sh(0) - sh(2) : 0;
  return {R, any, label: !ok ? null : d >= .06 ? 'fast' : d <= -.06 ? 'slow' : 'even', ch: {n4: R[3].fought, n5: R[4].fought, net: R[3].fl - R[3].fa + R[4].fl - R[4].fa, td: R[3].td + R[4].td, wins: w4}};
}
const rLab = r => r.label === 'fast' ? T('Fast starter', 'Começa forte (Fast Starter)') : r.label === 'slow' ? T('Slow starter (diesel)', 'Cresce no combate (Diesel)') : r.label === 'even' ? T('Balanced', 'Equilibrado') : '—';
function roundsHtml(id) {
  const r = roundsProfile(id); if (!r.any) return '';
  return `<div class="card" id="sc-rd" style="padding:.8rem 1.1rem;margin-top:.6rem"><b>${T('Pace by round', 'Ritmo por round')}</b> <span class="tag">${rLab(r)}</span>
  <div class="tb hd" style="grid-template-columns:.5fr .6fr 1fr 1fr 1fr"><span>R</span><span>n</span><span>${T('Net strikes/round', 'Saldo de golpes/round')}</span><span>${T('Strike share', 'Fatia de golpes')}</span><span>KD +/−</span></div>

  <p class="mu sm">${T('Fast starter: strike share in R1 at least 6 points above R3 (4+ complete rounds each); slow starter: 6 points below. Only complete rounds count; R4/R5 include the round where the fight ended.', 'Fast starter: fatia de golpes no R1 pelo menos 6 pontos acima do R3 (4+ rounds completos de cada); slow starter: 6 pontos abaixo. Só rounds completos contam; R4/R5 incluem o round em que a luta acabou.')}</p></div>`;

function roundsSimHtml(ia, ib) {

/* milhagem de octógono e desgaste */
const hm = m => `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, '0')}m`;
function wearStats(id) {
  let min = 0, head = 0, wars = 0, n = 0;
  for (const f of S.fg) {
    if (f.res === 'nc' || (mid(f.a.id) !== id && mid(f.b.id) !== id)) continue;
    const op = mid(f.a.id) === id ? 'b' : 'a'; n++; min += mins(f);

}

}
function wearSimHtml(ia, ib) {

}
function wearIdx() {
  if (S._wr && S._wr.n === S.fg.length) return S._wr.m;
  const fs = [...S.fg].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (b.ord || 0) - (a.ord || 0)), cum = new Map(), m = new Map();
  for (const f of fs) {

    m.set(f.id + '|' + ia, cum.get(ia) || 0); m.set(f.id + '|' + ib, cum.get(ib) || 0);        // acumulado ANTES da luta: nada do futuro entra

  }

const wearD = r => { const m = wearIdx(); return (m.get(r.fid + '|' + r.ix) || 0) - (m.get(r.fid + '|' + r.iy) || 0); };

    x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 1350, 1350); x.stroke();
    x.beginPath(); x.moveTo(i + 1350, 0); x.lineTo(i, 1350); x.stroke();
  }
  x.strokeStyle = '#f5c518'; x.lineWidth = 8; x.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = Math.PI / 8 + i * Math.PI / 4, px = 540 + 640 * Math.cos(a), py = 675 + 640 * Math.sin(a);
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  }
  x.closePath(); x.stroke();
  x.textAlign = 'center'; x.fillStyle = '#f5c518'; x.font = `900 54px ${F}`; x.fillText('SÚMULA UFC', 540, 170);
  const fit = (t, y, col, px) => {
    let z = px; x.font = `900 ${z}px ${F}`;
    while (x.measureText(t).width > 860 && z > 40) { z -= 4; x.font = `900 ${z}px ${F}`; }
    x.fillStyle = col; x.fillText(t, 540, y);
  };
  fit(o.A.name.toUpperCase(), 420, '#f5c518', 120);
  x.fillStyle = '#8b94a5'; x.font = `800 50px ${F}`; x.fillText('VS', 540, 520);
  fit(o.B.name.toUpperCase(), 640, '#6c8cff', 120);
  x.font = `900 190px ${F}`; x.fillStyle = '#f5c518'; x.textAlign = 'left'; x.fillText((o.p * 100).toFixed(0) + '%', 130, 900);
  x.fillStyle = '#6c8cff'; x.textAlign = 'right'; x.fillText(((1 - o.p) * 100).toFixed(0) + '%', 950, 900);
  x.fillStyle = '#f5c518'; x.fillRect(130, 950, 820 * o.p, 26);
  x.fillStyle = '#6c8cff'; x.fillRect(130 + 820 * o.p, 950, 820 * (1 - o.p), 26);
  x.textAlign = 'center'; x.fillStyle = '#8b94a5'; x.font = '500 34px Archivo,Arial,sans-serif';
  x.fillText(`${T('90% interval for', 'Intervalo de 90% para')} ${lastName(o.A.name)}: ${(o.lo * 100).toFixed(0)}–${(o.hi * 100).toFixed(0)}%`, 540, 1040);
  x.fillText(o.m === 'peak' ? T('Career peak', 'Pico da carreira') : T('Current form', 'Momento atual'), 540, 1090);
  x.fillText(new Date().toLocaleDateString(S.pt ? 'pt-BR' : 'en-US'), 540, 1140);
  c.toBlob(b => {
    const f = new File([b], 'sumula.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[f]})) navigator.share({files:[f], title:'Súmula UFC'}).catch(() => {});
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'sumula.png'; a.click(); }
  });
}

function statRows(f) {
  if (!f.totals && !f.sig) return `<p class="mu">${T('No detailed stats for this fight.', 'Sem estatísticas detalhadas para esta luta.')}</p>`;
  const tone = s => f.res === 'draw' || f.res === 'nc' ? 'var(--mu)' : f.res === s ? 'var(--win)' : 'var(--loss)';
  const row = (l, a, b) => {
    const x = num(a), y = num(b), t = x + y || 1;
    return `<div class="sr"><span>${esc(a)}</span><span class="lb">${l}</span><span>${esc(b)}</span><div class="bar"><i style="--w:${x / t * 100}%;--c:${tone('a')}"></i><i style="--w:${y / t * 100}%;--c:${tone('b')}"></i></div></div>`;
  };
  let h = '';
  for (const [src, keys] of [[f.totals, ['KD', 'Sig. str.', 'Total str.', 'Td', 'Sub. att', 'Rev.', 'Ctrl']], [f.sig, ['Head', 'Body', 'Leg', 'Distance', 'Clinch', 'Ground']]]) {
    if (src) for (const k of keys) if (src.a?.[k] !== undefined) h += row(lb(k), src.a[k], src.b[k]);
  }
  const rt = f.rounds?.totals || [];
  if (rt.length) h += `<h2>${T('Significant strikes by round', 'Golpes significativos por round')}</h2>` + rt.map((r, i) => row('Round ' + (i + 1), r.a?.['Sig. str.'] ?? '-', r.b?.['Sig. str.'] ?? '-')).join('');
  return (window.XS ? window.XS(f) : '') + h + (f.detail ? `<p class="mu sm">${esc(f.detail)}</p>` : '');
}

function spark(h) {

  const svg = `<svg class="sp" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img"><polyline points="${h.map((x, i) => `${X(i)},${Y(x.a)}`).join(' ')}" fill="none" stroke="var(--gd)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
  const dots = h.map((x, i) => x.t ? `<button type="button" class="spd" style="left:${(X(i) / W * 100).toFixed(2)}%;top:${(Y(x.a) / Hh * 100).toFixed(2)}%" data-t="${esc(x.t)}" aria-label="${esc(x.t)}" onclick="spI(this)" onmouseenter="spI(this)" onfocus="spI(this)"></button>` : '').join('');

/* ---------- Fight simulator ---------- */
function rt(id, E, mode) {
  const x = E.RM.get(id); if (!x) return null;
  if (mode === 'peak') return {mu: x.pn.r, v: x.pn.vr, x, pd: {age: null, inactM: 0, pen: 0}};
  const pd = physDecay(id);
  return {mu: x.ln.r - pd.pen / U, v: x.ln.vr + (S.P.vol / U) ** 2 * Math.max(0, Date.now() / YR - x.ln.t), x, pd};
}
const sg = z => 1 / (1 + Math.exp(-z)), pc = x => (x * 100).toFixed(1) + '%', f1 = x => x.toFixed(2);
const sr = (l, a, b, x, y) => `<div class="sr"><span style="color:var(--gd)">${a}</span><span class="lb">${l}</span><span style="color:var(--cb)">${b}</span>${x != null ? `<div class="bar"><i style="--w:${x / ((x + y) || 1) * 100}%;--c:var(--gd)"></i><i style="--w:${y / ((x + y) || 1) * 100}%;--c:var(--cb)"></i></div>` : ''}</div>`;

}

function models(q, p) {
  if (q.m !== 'cur') return `<p class="mu sm">${T('The stats model is available in "Current form" mode.', 'O modelo de estatísticas está disponível no modo "Momento atual".')}</p>`;
  const R = lab(); if (!R || R.none) return '';

  const md = massDelta(q.a, q.b), pdA = physDecay(q.a), pdB = physDecay(q.b), physNet = (pdB.pen - pdA.pen) + md.pts;
  const today = new Date().toISOString().slice(0, 10), fa = feat(a, q.a, today), fb = feat(b, q.b, today);
  const xx = fa.map((v, i) => v == null || fb[i] == null ? 0 : v - fb[i]);
  xx[0] += physNet * 0.85;
  const ps0 = predLR(R.mF, {x:xx}), ps = sg(Math.log(ps0 / (1 - ps0 + 1e-9)) + md.mu * 0.55), pe = predLR(R.mE, {x:xx}), bl = (p + ps) / 2, m = k => R.M.find(x => x.n === k).ll.toFixed(3);
  const row = (n, k, v) => `<div class="sr"><span style="color:var(--gd)">${pc(v)}</span><span class="lb">${n}${R.best === k ? ' ★' : ''}</span><span style="color:var(--cb)">${pc(1 - v)}</span></div>`;
  return `<h2>${T('Models compared', 'Modelos comparados')}</h2><div class="card" style="padding:.8rem 1.1rem">${row('Elo', 'Elo', pe)}${row('WHR', 'WHR', p)}${row(T('Stats model', 'Modelo de estatísticas'), 'Stats', ps)}${row(T('Blend', 'Combinado'), 'Blend', bl)}<p class="mu sm">${T('★ = lowest blind-test log-loss', '★ = menor log-loss no teste cego')} (Elo ${m('Elo')}, WHR ${m('WHR')}, ${T('stats', 'estatísticas')} ${m('Stats')}, ${T('blend', 'combinado')} ${m('Blend')}). ${T('Details in the Lab tab.', 'Detalhes na aba Lab.')}</p></div>`;

function analysis(id) {
  const fs = S.fg.filter(f => f.res !== 'nc' && (mid(f.a.id) === id || mid(f.b.id) === id)), o = agg(id, 'all');
  const rd = [0, 1, 2, 3, 4].map(() => ({l:0, a:0, n:0})), tg = {Head:0, Body:0, Leg:0, Distance:0, Clinch:0, Ground:0};
  for (const f of fs) {

    (f.rounds?.totals || []).forEach((r, i) => {
      if (i < 5 && r[me] && (full || i + 1 < last)) { rd[i].l += num(r[me]['Sig. str.']); rd[i].a += num(r[op]?.['Sig. str.']); rd[i].n++; }
    });
    if (f.sig) for (const k in tg) tg[k] += num(f.sig[me]?.[k]);
  }
  if (o.min < 15) return `<p class="mu sm">${T('Not enough fight stats yet.', 'Ainda não há estatísticas suficientes.')}</p>`;
  const ln = (l, v, fr) => `<div class="sr" style="grid-template-columns:9.5rem 1fr auto;align-items:center"><span class="mu">${l}</span><i class="mb" style="margin:0"><b style="width:${Math.max(0, Math.min(1, fr)) * 100}%"></b></i><span>${v}</span></div>`;
  const rv = rd.map(r => r.n >= 3 ? r.l / r.n : null), mx = Math.max(...rv.filter(v => v != null), 1), ch = rv[0] && rv[2] != null ? (rv[2] - rv[0]) / rv[0] : null;
  const t1 = tg.Head + tg.Body + tg.Leg || 1, t2 = tg.Distance + tg.Clinch + tg.Ground || 1, sl = o.sl, al = o.al, py = sl * sl / ((sl * sl + al * al) || 1), ac = o.w / ((o.w + o.l) || 1), lw = o.l || 1;
  return `<div class="card" style="padding:.8rem 1.1rem"><b>${T('Cardio: significant strikes landed per round', 'Cardio: golpes significativos acertados por round')}</b>
  ${rv.map((v, i) => v == null ? '' : ln('R' + (i + 1) + ` (${rd[i].n})`, v.toFixed(1), v / mx)).join('')}${ch != null ? `<p class="mu sm">${T('Round 3 vs round 1', 'Round 3 vs round 1')}: <b class="${ch < 0 ? 'dn' : 'up'}">${ch > 0 ? '+' : ''}${(ch * 100).toFixed(0)}%</b>. ${T('Only completed rounds are counted.', 'Só rounds completos entram na conta.')}</p>` : ''}</div>
  <div class="card" style="padding:.8rem 1.1rem"><b>${T('Striking signature (share of significant strikes landed)', 'Assinatura de golpes (parcela dos golpes significativos acertados)')}</b>
  ${['Head', 'Body', 'Leg', 'Distance', 'Clinch', 'Ground'].map((k, i) => ln(lb(k), ((tg[k] / (i < 3 ? t1 : t2)) * 100).toFixed(0) + '%', tg[k] / (i < 3 ? t1 : t2))).join('')}</div>
  <div class="card" style="padding:.8rem 1.1rem"><b>${T('Durability and results', 'Durabilidade e resultados')}</b>
  ${ln(T('Knockdowns absorbed / 15 min', 'Knockdowns sofridos / 15 min'), (15 * o.kdo / o.min).toFixed(2), 15 * o.kdo / o.min / 1.5)}${ln(T('Losses by KO/TKO', 'Derrotas por KO/TKO'), `${o.Ls.KO} / ${o.l}`, o.Ls.KO / lw)}${ln(T('Wins by KO/TKO', 'Vitórias por KO/TKO'), `${o.W.KO} / ${o.w}`, o.W.KO / (o.w || 1))}${ln(T('Wins by submission', 'Vitórias por finalização'), `${o.W.SUB} / ${o.w}`, o.W.SUB / (o.w || 1))}${ln(T('Wins by decision', 'Vitórias por decisão'), `${o.W.DEC} / ${o.w}`, o.W.DEC / (o.w || 1))}
  <p class="mu sm">${T('Pythagorean expectation (strikes landed² vs absorbed², an estimate)', 'Expectativa pitagórica (golpes acertados² vs recebidos², uma estimativa)')}: ${(py * 100).toFixed(0)}% ${T('expected vs', 'esperado vs')} ${(ac * 100).toFixed(0)}% ${T('actual win rate', 'de vitórias reais')} → <b class="${ac >= py ? 'up' : 'dn'}">${ac >= py ? T('overperforming', 'acima do esperado') : T('underperforming', 'abaixo do esperado')}</b>.</p></div>`;
}

  <h2>${T('What really matters', 'O que realmente importa')}</h2><div class="card" style="padding:.6rem 1.1rem"><div class="tb hd"><span>${T('Variable (A − B)', 'Variável (A − B)')}</span><span>${T('Odds ratio / SD', 'Razão de chances / DP')}</span><span>${T('99.5% interval', 'Intervalo de 99,5%')}</span><span>${T('Verdict', 'Veredito')}</span></div>
  ${co.map(c => `<div class="tb"><span>${FN[c.j][S.pt ? 1 : 0]}</span><span>${Math.exp(c.b).toFixed(2)}</span><span>${c.lo.toFixed(2)} – ${c.hi.toFixed(2)}</span><span class="${c.lo > 1 ? 'up' : c.hi < 1 ? 'dn' : 'mu'}">${c.lo > 1 ? T('more helps', 'mais ajuda') : c.hi < 1 ? T('more hurts', 'mais atrapalha') : T('no evidence', 'sem evidência')}</span></div>`).join('')}</div>
  <h2>${T('Auto-tune', 'Autoajuste')}</h2><div class="card" style="padding:.8rem 1.1rem"><button id="tb">${T('Run auto-tune', 'Rodar autoajuste')}</button><div id="tn" class="mu sm" style="margin-top:.6rem"></div></div>
  ${extraLab()}`;
}

function tune() {
  const out = $('#tn'), jobs = [40, 60, 80, 110, 150].flatMap(v => [0, .5, 1].map(f => [v, f])), res = [], L = scope('ALL'), keep = {vol: S.P.vol, fin: S.P.fin};
  let i = 0;
  const step = () => {
    if (!$('#tn')) return;
    if (i >= jobs.length) {
      Object.assign(S.P, keep); res.sort((a, b) => a.ll - b.ll); const b = res[0];
      out.innerHTML = res.slice(0, 5).map(r => `<div class="tb${r === b ? ' best' : ''}" style="grid-template-columns:1fr 1fr 1fr"><span>${T('volatility', 'volatilidade')} ${r.v}</span><span>${T('method', 'método')} ${r.f}</span><span>log-loss ${r.ll.toFixed(4)}</span></div>`).join('') + `<button id="ap" style="margin-top:.6rem">${T('Apply the best', 'Aplicar a melhor')} (${b.v}, ${b.f})</button>`;
      $('#ap').onclick = () => { S.P.vol = b.v; S.P.fin = b.f; try { localStorage.sumulaP4 = JSON.stringify(S.P); } catch {} S.cache.clear(); S.lab = null; vLab(); };
      return;
    }
    const [v, f] = jobs[i++]; S.P.vol = v; S.P.fin = f;
    const h = holdout(L, S.P); res.push({v, f, ll: h && h.n ? h.ll / h.n : 9});
    out.textContent = `${i}/${jobs.length}…`; setTimeout(step, 20);
  };
  step();
}

function computeIdeal(era, dv) {
  const isHist = era === 'all', E = getE('ALL'), anF = S.an?.fighters || {};
  const cut18 = new Date(Date.now() - 1.5 * YR).toISOString().slice(0, 10);
  const minN = dv === "Women's Featherweight" ? 3 : (dv === 'ALL' ? 5 : 4);
  const pool = [];
  for (const [id, f] of Object.entries(anF)) {
    if (!isDivElig(id, dv, isHist, f.n)) continue;
    if (!isHist) {
      if (S.ros && !isOnRoster(id)) continue;
      const offRanked = S.urk?.fighters?.[id]?.cur_rank != null;
      if (f.last < cut18 && !offRanked) continue;
      if ((f.phys_pen || 0) > 85) continue;
    }
    const rm = E.RM.get(id);
    if (!rm) continue;
    pool.push({id, f, rm});
  }
  const out = {};
  for (const z of ID_ZONES()) {
    const cands = pool.filter(x => z.minOk(x.f, dv, minN)).map(x => ({
      ...x,
      sc: z.score(x.id, x.f, x.rm, dv, isHist),
      metric: z.fmt(x.id, x.f, x.rm, dv, isHist),
      badge: z.badge(x.id, x.f, x.rm, dv, isHist)
    })).sort((a, b) => b.sc - a.sc).slice(0, 5);
    out[z.k] = {z, top: cands};
  }
  return out;
}

    if (p) {
      const fs = S.fg.filter(f => (f.res === 'a' || f.res === 'b') && (mid(f.a.id) === id || mid(f.b.id) === id)).sort((a, b) => b.date < a.date ? -1 : 1);
      h += fs.map(f => { const on = Z.fl.has(f.id), ow = f.res === 'a' ? f.a : f.b, ol = f.res === 'a' ? f.b : f.a, w = on ? ol : ow, l = on ? ow : ol; return `<div class="h" style="grid-template-columns:5.5rem 1fr auto"><span class="mu">${fmt(f.date)}</span><span><b>${esc(name(w))}</b> ${T('beat', 'venceu')} ${esc(name(l))}<br><span class="mu sm">${esc(f.method)}, ${esc(f.div)}</span></span><button data-ztf="${f.id}" class="pk${on ? ' on' : ''}">${on ? T('Flipped', 'Invertida') : T('Flip', 'Inverter')}</button></div>`; }).join('');
    }
    h += `<div class="acts" style="margin-top:.8rem"><button id="ztr" ${Z.fl.size ? '' : 'disabled'}>${T('Recalculate history', 'Recalcular a história')} (${Z.fl.size})</button>${Z.fl.size ? `<button data-ztc="1">${T('Clear flips', 'Limpar inversões')}</button>` : ''}</div><div class="acts" style="margin-top:.4rem"><span class="xbar" data-xk="tm"></span><span class="mu sm">${T('One-click scenarios', 'Cenários de 1 clique')}:</span><button data-ztrob="1">${T('Fix all possible robberies', 'Corrigir todos os Possíveis Roubos')}${Z.dj && Z.dj.fights ? ' (' + Object.values(Z.dj.fights).filter(v => v[1] === 3).length + ')' : ''}</button><button data-ztsp="1">${T('Flip all split decisions', 'Inverter todas as Decisões Divididas')} (${S.fg.filter(f => (f.res === 'a' || f.res === 'b') && /split/i.test(f.method || '')).length})</button></div><div id="zt"></div>`;
    return h;
  }
  /* inverte de uma vez todas as lutas que o decisions.json classifica como "possível roubo" (classe 3) e recalcula o WHR inteiro */
  function zSplit() { for (const f of S.fg) if ((f.res === 'a' || f.res === 'b') && /split/i.test(f.method || '')) Z.fl.add(f.id); draw(); tmRun(); }
  /* quais reinados e campeões mudariam: compara os reinados da história real (E0) com os da história com as inversões (E1) */
  function reignData(E0, E1) {
    const key = r => r.id + '|' + r.div + '|' + r.start, m0 = new Map(E0.rg.map(r => [key(r), r])), m1 = new Map(E1.rg.map(r => [key(r), r]));
    const lost = E0.rg.filter(r => !m1.has(key(r))), gain = E1.rg.filter(r => !m0.has(key(r))), dd = E0.rg.filter(r => m1.has(key(r)) && m1.get(key(r)).def !== r.def);
    const recent = r => !r.end && Date.now() - Date.parse(r.last) < 3 * YR, cur = rg => { const o = new Map(); for (const r of rg) if (recent(r)) o.set(r.div, r); return o; }, c0 = cur(E0.rg), c1 = cur(E1.rg);
    const chg = [...new Set([...c0.keys(), ...c1.keys()])].filter(d => (c0.get(d) || {}).id !== (c1.get(d) || {}).id).sort();
    return {lost, gain, dd, c0, c1, chg};
  }
  function reignDiff(E0, E1) {
    const {lost, gain, dd, c0, c1, chg} = reignData(E0, E1);
    const per = r => `${r.start.slice(0, 4)}–${r.end ? r.end.slice(0, 4) : T('now', 'hoje')}`, line = (sg_, r, cl) => `<div class="h" style="grid-template-columns:auto 1fr"><b class="${cl}">${sg_}</b><span><a href="#/fighter/${r.id}"><b>${esc(nm(r.id))}</b></a> <span class="mu sm">${esc(r.div)}, ${per(r)}, ${r.def} ${T('def.', 'def.')}</span></span></div>`;
    const none = !lost.length && !gain.length && !dd.length && !chg.length;
    return `<h2>${T('Which champions and reigns would change', 'Quais campeões e reinados mudariam')}</h2><div class="card" style="padding:.8rem 1.1rem">${none ? `<p class="mu">${T('No title reign would change.', 'Nenhum reinado mudaria.')}</p>` : `
      ${chg.length ? `<b>${T('Champions today', 'Campeões hoje')}</b>${chg.map(d => `<div class="sr" style="grid-template-columns:1fr auto 1fr"><span class="mu">${esc(d)}</span><span><b>${esc(c0.get(d) ? nm(c0.get(d).id) : T('vacant', 'vago'))}</b> →</span><b class="up">${esc(c1.get(d) ? nm(c1.get(d).id) : T('vacant', 'vago'))}</b></div>`).join('')}` : `<p class="mu sm">${T('Today’s champions would not change.', 'Os campeões de hoje não mudariam.')}</p>`}
      ${lost.length ? `<p style="margin:.6rem 0 .2rem"><b>${T('Reigns that would disappear', 'Reinados que desapareceriam')} (${lost.length})</b></p>${lost.slice(0, 12).map(r => line('−', r, 'dn')).join('')}` : ''}
      ${gain.length ? `<p style="margin:.6rem 0 .2rem"><b>${T('New reigns', 'Reinados novos')} (${gain.length})</b></p>${gain.slice(0, 12).map(r => line('+', r, 'up')).join('')}` : ''}
      ${dd.length ? `<p class="mu sm">${dd.length} ${T('reigns would keep the same start but with a different number of defenses.', 'reinados manteriam o início mas com outro número de defesas.')}</p>` : ''}`}</div>`;
  }
  async function zRob() {
    const j = Z.dj || (Z.dj = await fetchJson('decisions'));
    if (!j || !j.fights) { alert(T('decisions.json not found.', 'decisions.json não encontrado.')); return; }
    const by = fmap();
    for (const [id, v] of Object.entries(j.fights)) { const f = by.get(id); if (v[1] === 3 && f && (f.res === 'a' || f.res === 'b')) Z.fl.add(id); }
    draw(); tmRun();
  }
  function tmRun() {
    const el = $('#zt'); if (!el) return;
    el.innerHTML = `<p class="mu">${T('Recalculating the whole history…', 'Recalculando a história inteira…')}</p>`;
    setTimeout(() => {
      const L1 = scope('ALL').map(f => Z.fl.has(f.id) ? {...f, res: f.res === 'a' ? 'b' : f.res === 'b' ? 'a' : f.res} : f), E0 = getE('ALL'), E1 = whr(L1, S.P);
      const rows = [...E1.RM.values()].filter(x => E0.RM.has(x.id)).map(x => ({id:x.id, d:x.cur - E0.RM.get(x.id).cur, c0:E0.RM.get(x.id).cur, c1:x.cur, n:x.n}));
      const big = rows.filter(r => r.n >= 3).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 10), rows_ = b => b.map(r => [T('Rating', 'Nota'), nm(r.id), '', Math.round(r.c0), Math.round(r.c1), (r.d >= 0 ? '+' : '') + r.d.toFixed(0)]);
      el.innerHTML = `<h2>${T('Biggest changes in current rating', 'Maiores mudanças na nota atual')}</h2><div class="card" style="padding:.8rem 1.1rem">${big.map(r => `<div class="sr" style="grid-template-columns:1fr auto auto"><a href="#/fighter/${r.id}"><b>${esc(nm(r.id))}</b></a><span class="mu">${Math.round(r.c0)} →${Math.round(r.c1)}</span><b class="${r.d >= 0 ? 'up' : 'dn'}">${r.d >= 0 ? '+' : ''}${r.d.toFixed(0)}</b></div>`).join('')}</div>`;
      el.innerHTML += reignDiff(E0, E1);
      XEXP.reg('tm', () => {
        const R = reignData(E0, E1), per = r => `${r.start.slice(0, 4)}–${r.end ? r.end.slice(0, 4) : T('now', 'hoje')}`, rows = [];
        rows.push(...rows_(big));
        R.chg.forEach(d => rows.push([T('Champion today', 'Campeão hoje'), `${R.c0.get(d) ? nm(R.c0.get(d).id) : T('vacant', 'vago')} → ${R.c1.get(d) ? nm(R.c1.get(d).id) : T('vacant', 'vago')}`, d, '', '', '']));
        R.lost.forEach(r => rows.push([T('Reign disappears', 'Reinado desaparece'), nm(r.id), r.div, per(r), '', `${r.def} ${T('def.', 'def.')}`]));
        R.gain.forEach(r => rows.push([T('New reign', 'Reinado novo'), nm(r.id), r.div, '', per(r), `${r.def} ${T('def.', 'def.')}`]));
        return {kind: 'table', title: T('Time machine: what would change', 'Máquina do Tempo: o que mudaria'), file: 'maquina-do-tempo', sub: `${Z.fl.size} ${T('fights reversed', 'lutas invertidas')} · ${R.chg.length} ${T('champions today change', 'campeões de hoje mudam')} · ${R.lost.length} ${T('reigns disappear', 'reinados desaparecem')} · ${R.gain.length} ${T('new reigns', 'reinados novos')}`,
          cols: [T('Type', 'Tipo'), T('Fighter / change', 'Lutador / mudança'), T('Division', 'Divisão'), T('Before', 'Antes'), T('After', 'Depois'), T('Change', 'Variação')], rows};
      });
    }, 30);
  }

  /* ================= 4) VIRADAS E GRÁFICO AO VIVO ================= */
  function liveChart(f) {
    const v = Z.live && Z.live[f.id]; if (!v || v.length < 2) return '';
    const w = f.res === 'a' ? f.a : f.b, pts = [...v, 1], n = pts.length, W = 320, H = 130, X = i => 26 + i * (W - 52) / (n - 1), Y = p => H - 26 - p * (H - 46), lab = pts.map((_, i) => i === 0 ? T('Pre', 'Antes') : i === n - 1 ? T('Result', 'Final') : 'R' + i);
    return `<div class="card" style="padding:.8rem 1.1rem;margin-bottom:.8rem"><b>${T('Live win probability', 'Probabilidade de vitória ao vivo')}: ${esc(name(w))}</b>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><line x1="26" x2="${W - 26}" y1="${Y(.5)}" y2="${Y(.5)}" stroke="var(--ln)" stroke-dasharray="4"/><polyline points="${pts.map((p, i) => X(i) + ',' + Y(p)).join(' ')}" fill="none" stroke="var(--gd)" stroke-width="2.5"/>${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p)}" r="4" fill="${i === n - 1 ? 'var(--win)' : 'var(--gd)'}"/><text x="${X(i)}" y="${Math.max(12, Y(p) - 9)}" text-anchor="middle" font-size="10" fill="var(--tx)">${Math.round(p * 100)}%</text><text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--mu)">${lab[i]}</text>`).join('')}</svg></div>`;
  }
  const pxs = window.XS; window.XS = f => (pxs ? pxs(f) : '') + liveChart(f);
  function tCb() {
    if (!Z.cb) return `<p class="empty">${T('live.json not found.', 'live.json não encontrado.')}</p>`;
    const by = fmap();
    return `<h2>${T('Biggest comebacks in UFC history', 'Maiores viradas da história do UFC')}</h2>${Z.cb.slice(0, 25).map(([id, p, r]) => { const f = by.get(id); if (!f) return ''; const w = f.res === 'a' ? f.a : f.b, l = f.res === 'a' ? f.b : f.a; return `<div class="card h" style="grid-template-columns:1fr auto;padding:.6rem 1rem;border-bottom:0"><span><a href="#/event/${f.ev}/${id}"><b>${esc(name(w))}</b></a> ${T('beat', 'venceu')}${esc(name(l))}<br><span class="mu sm">${fmt(f.date)},${esc(f.method)}</span></span><span style="text-align:right"><b class="up">${Math.round(p * 100)}%</b><br><span class="mu sm">${T('after R', 'depois do R')}${r}</span></span></div>`; }).join('')}`;
  }

  function draw() {
    const el = $('#zx'); if (!el) return;
    const tb = (k, l) => `<button data-zt="${k}" class="${Z.tab === k ? 'on' : ''}">${l}</button>`;
    el.innerHTML = `<div class="seg">${tb('cards', 'Cards')}${tb('cross', T('Cross-tabs', 'Cruzador'))}${tb('tm', T('What if?', 'E se?'))}${tb('cb', T('Comebacks', 'Viradas'))}</div>` + ({cross:tCross, cards:tCards, tm:tTm, cb:tCb}[Z.tab])();
    if (Z.tab === 'cross') zres();
    const m = $('#m');
    m.onclick = e => {
      const t = e.target.closest('[data-zt],[data-zp],[data-zc],[data-zimg],[data-ztf],[data-ztc],[data-ztrob],[data-ztsp],#ztr'); if (!t) return;
      const d = t.dataset;
      if (d.zt) { Z.tab = d.zt; draw(); }
      else if (d.zp) { const [s, id] = d.zp.split(':'); Z[s] = id; draw(); scrollTo({top:0, behavior:'smooth'}); }
      else if (d.zc) { Z[d.zc] = ''; draw(); }
      else if (d.zimg) cardImg(d.zimg);
      else if (d.ztf) { Z.fl.has(d.ztf) ? Z.fl.delete(d.ztf) : Z.fl.add(d.ztf); draw(); }
      else if (d.ztc) { Z.fl.clear(); draw(); }
      else if (d.ztrob) zRob();
      else if (d.ztsp) zSplit();
      else if (t.id === 'ztr') tmRun();
    };
    m.oninput = e => {
      const q = e.target.closest('[data-zq]');
      if (q) {
        const [s, only] = q.dataset.zq.split(':'), t = q.value.toLowerCase().trim(), r = $('#zs' + s);
        if (r) r.innerHTML = t ? [...S.F.values()].filter(f => (only === 'c' ? Z.cards && Z.cards[f.id] : true) && (f.name + ' ' + f.nick).toLowerCase().includes(t)).slice(0, 6).map(f => `<button data-zp="${s}:${f.id}"><span>${esc(f.name)}</span><span class="mu">${esc(f.record)}</span></button>`).join('') : '';
        return;
      }
      const ph = e.target.closest('[data-zph]'); if (ph) { if (ph.files[0]) upPhoto(ph.dataset.zph, ph.files[0]); return; }
      const cf = e.target.closest('[data-zcf]'); if (cf) { Z[cf.dataset.zcf] = cf.dataset.zcf === 'csort' ? +cf.value : cf.value; draw(); return; }
      const f = e.target.closest('[data-zf]'); if (!f) return;
      const k = f.dataset.zf, num = ['T', 'from', 'e3'].includes(k); Z[k] = num ? +f.value : f.value;
      if (k === 'v') { Z.T = VARS().find(v => v.k === Z.v).T; Z.side = 'more'; draw(); }
      else if (k === 'met') draw();
      else zres();
    };
  }
  async function vStudio(a) {
    if (a) { Z.a = mid(a); Z.tab = 'cards'; }
    M(`<h1>${T('Studio', 'Estúdio')}</h1><div id="zx"><p class="mu">${T('Loading…', 'Carregando…')}</p></div>`);
    if (window.XLOAD) await window.XLOAD();
    draw();
  }
  const pxt = window.XT; window.XT = () => [...(pxt ? pxt() : []), ['studio', T('Studio', 'Estúdio')]];
  window.XCARD = id => { Z.tab = 'cards'; Z.a = id; if (location.hash === '#/studio') vStudio(); };
  window.XV = {...(window.XV || {}), studio: vStudio};
  const pxp = window.XP; window.XP = id => (pxp ? pxp(id) : '') + (Z.cards && Z.cards[id] ? `<div class="acts"><a class="btn" href="#/studio/${id}">${T('See the card', 'Ver o card')}</a></div>` : '');
})();

init();
</script>
  <script src="sherdog.js"></script>
  <script src="extras.js"></script>
</body>
