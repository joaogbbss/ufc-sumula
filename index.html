<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Súmula UFC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M20 4h24l16 16v24L44 60H20L4 44V20z' fill='%231b4fd8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{--mat:#e4e7ec;--chalk:#f8f9fb;--ink:#14171f;--mute:#5d6577;--line:#cdd2db;--win:#1b4fd8;--loss:#c8283d;--belt:#9a6f12;--r:6px}
@media(prefers-color-scheme:dark){:root{--mat:#12151c;--chalk:#1a1e28;--ink:#eef0f5;--mute:#98a0b3;--line:#2c3240;--win:#6b93ff;--loss:#ff6b7d;--belt:#e0b24a}}
*{box-sizing:border-box}
body{margin:0;background:var(--mat);color:var(--ink);font:400 16px/1.45 Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--win);outline-offset:2px}
header{display:flex;align-items:center;max-width:960px;margin:auto;padding:1rem clamp(1rem,4vw,2.5rem) .25rem}
.brand{font-stretch:125%;font-weight:900;font-size:1.4rem;margin-right:auto}
nav{display:flex;position:fixed;inset:auto 0 0;background:var(--chalk);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:.95rem 0;color:var(--mute);text-decoration:none;font-weight:700}
nav a.on{color:var(--ink);box-shadow:inset 0 3px var(--win)}
main{max-width:960px;margin:auto;padding:0 clamp(1rem,4vw,2.5rem) 2rem}
h1{font-stretch:125%;font-weight:800;font-size:clamp(1.8rem,6vw,2.9rem);line-height:1.05;margin:.6rem 0 1rem}
h2{font-stretch:112%;font-weight:800;font-size:1.2rem;margin:1.6rem 0 .6rem}
.mute{color:var(--mute)}.sub{font-size:.9rem}
input,select{width:100%;padding:.7rem .85rem;border:1px solid var(--line);border-radius:var(--r);background:var(--chalk);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--chalk);color:var(--ink);border-radius:var(--r);padding:.4rem .7rem}
a{color:inherit}
.ev{display:grid;grid-template-columns:3.4rem 1fr;column-gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line);text-decoration:none}
.day{grid-row:span 2;text-align:right;font-stretch:125%;font-weight:800;font-size:2rem;line-height:1}
.en{font-weight:700}
.fight{border-bottom:1px solid var(--line);padding:.9rem 0}
.fh{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center}
.p{display:block;padding:.1rem 0 .1rem .7rem;border-left:4px solid var(--line);text-decoration:none}
.p.w{border-color:var(--win);font-weight:800}.p.l{border-color:var(--loss);color:var(--mute)}
.info{text-align:right;font-size:.85rem;color:var(--mute);display:grid;gap:.3rem;justify-items:end}
.tag{border:1px solid var(--belt);color:var(--belt);border-radius:99px;padding:0 .5rem;font-size:.8rem;font-weight:700}
.st{display:none;padding-top:.8rem}.open .st{display:block}
.sr{display:grid;grid-template-columns:1fr auto 1fr;gap:.2rem .6rem;font-size:.9rem;padding:.3rem 0}
.sr span:last-of-type{text-align:right}.sr .lb{color:var(--mute);text-align:center}
.bar{grid-column:1/-1;display:flex;gap:2px;height:4px}.bar i{display:block}
.t-w{background:var(--win)}.t-l{background:var(--loss)}.t-d{background:var(--mute)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1rem}
.ctl label{display:grid;gap:.25rem;font-size:.85rem;color:var(--mute)}
.rk{display:grid;grid-template-columns:3.2rem 1fr auto;align-items:center;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--line);text-decoration:none}
.pos{font-stretch:125%;font-weight:800;font-size:1.6rem;color:var(--mute)}
.rk:nth-child(-n+3) .pos{color:var(--ink)}.rk:first-child .pos{color:var(--belt)}
.nm{font-weight:700}.nm small{display:block;font-weight:400;color:var(--mute)}
.rt{font-stretch:125%;font-weight:800;font-size:1.3rem}
.bio{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.7rem 1rem;margin:0}
.bio dt{font-size:.8rem;color:var(--mute)}.bio dd{margin:0;font-weight:700}
.h{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.up{color:var(--win)}.dn{color:var(--loss)}
.empty{padding:2rem 0;color:var(--mute)}
footer{max-width:960px;margin:auto;padding:0 clamp(1rem,4vw,2.5rem) 1.5rem;font-size:.8rem;color:var(--mute)}
@media(min-width:760px){body{padding-bottom:0}
nav{position:static;border:0;background:none;padding:0;gap:.25rem}
nav a{flex:none;padding:.4rem .9rem;border-radius:var(--r);box-shadow:none}
nav a.on{background:var(--ink);color:var(--mat);box-shadow:none}}
</style>
</head>
<body>
<header><span class="brand">Súmula UFC</span>
<nav><a href="#/events" data-p="events">Eventos</a><a href="#/ranking" data-p="ranking">Rankings</a><a href="#/fighters" data-p="fighters">Lutadores</a></nav></header>
<main id="m"></main>
<footer id="ft"></footer>
<script>
const $=s=>document.querySelector(s),M=h=>$('#m').innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={ev:[],fg:[],F:new Map(),ov:{merges:{},div:{},exclude:[]},meta:{},P:{k:32,fin:.25,title:.25,min:3,years:0},div:'ALL',last:null};
const mid=id=>S.ov.merges[id]||id;
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
const name=x=>S.F.get(mid(x.id))?.name||x.name;
const empty=()=>`<p class="empty">${S.ev.length?'Nada encontrado.':'Ainda não há dados. No GitHub, abra Actions, escolha "Atualizar base UFC" e clique em Run workflow.'}</p>`;
const L={KD:'Knockdowns','Sig. str.':'Golpes significativos','Total str.':'Golpes totais',Td:'Quedas','Sub. att':'Tentativas de finalização','Rev.':'Viradas',Ctrl:'Controle',Head:'Cabeça',Body:'Corpo',Leg:'Perna',Distance:'Distância',Clinch:'Clinch',Ground:'Solo'};

async function init(){
 const g=async n=>{try{const r=await fetch('data/'+n+'.json',{cache:'no-cache'});return r.ok?r.json():null}catch{return null}};
 const [ev,fg,fi,ov,meta]=await Promise.all(['events','fights','fighters','overrides','meta'].map(g));
 if(ov)S.ov={merges:{},div:{},exclude:[],...ov};
 S.ev=ev||[];S.meta=meta||{};(fi||[]).forEach(f=>S.F.set(f.id,f));
 S.fg=(fg||[]).filter(f=>!S.ov.exclude.includes(f.id)).map(f=>({...f,div:S.ov.div[f.id]||f.div}));
 $('#ft').textContent=S.meta.updated?`Base atualizada em ${new Date(S.meta.updated).toLocaleString('pt-BR')}. Fonte: ufcstats.com`:'Fonte: ufcstats.com';
 addEventListener('hashchange',route);route();
}

/* Ranking: Elo calculado só com as lutas do escopo escolhido */
function elo(){
 const P=S.P,R=new Map(),H=new Map();
 const g=id=>{if(!R.has(id)){R.set(id,{id,r:1500,w:0,l:0,d:0,n:0,last:''});H.set(id,new Map())}return R.get(id)};
 const L=S.fg.filter(f=>f.res!=='nc'&&(S.div==='ALL'||f.div===S.div))
  .sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(y.ord||0)-(x.ord||0));
 for(const f of L){
  const A=g(mid(f.a.id)),B=g(mid(f.b.id));if(A===B)continue;
  const ea=1/(1+10**((B.r-A.r)/400)),sa=f.res==='a'?1:f.res==='b'?0:.5;
  const k=P.k*(/^(ko|tko|sub)/i.test(f.method)?1+P.fin:1)*(f.title?1+P.title:1),d=k*(sa-ea);
  H.get(A.id).set(f.id,{b:A.r,d});H.get(B.id).set(f.id,{b:B.r,d:-d});
  A.r+=d;B.r-=d;
  for(const [X,s] of [[A,sa],[B,1-sa]]){X.n++;X.last=f.date;s===1?X.w++:s===0?X.l++:X.d++}
 }
 return {rows:[...R.values()],H};
}

function vEvents(){
 M(`<h1>Eventos</h1><input id="q" type="search" placeholder="Buscar evento, cidade ou ano" aria-label="Buscar evento"><div id="l"></div>`);
 const draw=()=>{const q=$('#q').value.toLowerCase();
  const r=S.ev.filter(e=>(e.name+' '+e.location+' '+e.date).toLowerCase().includes(q));
  $('#l').innerHTML=r.length?r.map(e=>{const d=new Date(e.date+'T00:00');
   return `<a class="ev" href="#/event/${e.id}"><b class="day">${d.getDate()}</b><span class="en">${esc(e.name)}</span><span class="mute sub">${d.toLocaleDateString('pt-BR',{month:'short',year:'numeric'})}, ${esc(e.location)}</span></a>`}).join(''):empty()};
 $('#q').oninput=draw;draw();
}

function statRows(f){
 if(!f.totals&&!f.sig)return '<p class="mute">Sem estatísticas detalhadas para esta luta.</p>';
 const tone=s=>f.res==='draw'||f.res==='nc'?'t-d':(f.res===s?'t-w':'t-l'),n=v=>parseFloat(String(v).split(' of ')[0])||0;
 const row=(k,a,b)=>{const x=n(a),y=n(b),t=x+y||1;
  return `<div class="sr"><span>${esc(a)}</span><span class="lb">${L[k]}</span><span>${esc(b)}</span><div class="bar"><i class="${tone('a')}" style="flex:${x/t||.0001}"></i><i class="${tone('b')}" style="flex:${y/t||.0001}"></i></div></div>`};
 let h='';
 for(const [src,keys] of [[f.totals,['KD','Sig. str.','Total str.','Td','Sub. att','Rev.','Ctrl']],[f.sig,['Head','Body','Leg','Distance','Clinch','Ground']]])
  if(src)for(const k of keys)if(src.a?.[k]!==undefined)h+=row(k,src.a[k],src.b[k]);
 const rt=f.rounds?.totals||[];
 if(rt.length)h+='<h2>Golpes significativos por round</h2>'+rt.map((r,i)=>row('Sig. str.',r.a?.['Sig. str.']??'-',r.b?.['Sig. str.']??'-').replace('Golpes significativos','Round '+(i+1))).join('');
 return h+(f.detail?`<p class="mute sub">${esc(f.detail)}</p>`:'');
}

function fightRow(f){
 const w=s=>f.res==='draw'||f.res==='nc'?'':(f.res===s?'w':'l');
 const side=(s)=>`<a class="p ${w(s)}" href="#/fighter/${mid(f[s].id)}">${esc(name(f[s]))}</a>`;
 const out=f.res==='draw'?'Empate':f.res==='nc'?'Sem resultado':esc(f.method);
 return `<article class="fight" id="f${f.id}"><div class="fh"><div>${side('a')}${side('b')}</div>
 <div class="info"><span>${out}</span><span>${f.round?'R'+esc(f.round)+' '+esc(f.time):''}</span><span class="sub">${esc(f.div)}</span>${f.title?'<span class="tag">Cinturão</span>':''}<button data-f="${f.id}">Estatísticas</button></div></div><div class="st"></div></article>`;
}

function vEvent(id){
 const e=S.ev.find(x=>x.id===id);if(!e)return M(empty());
 const fs=S.fg.filter(f=>f.ev===id).sort((a,b)=>a.ord-b.ord);
 M(`<a class="mute" href="#/events">Todos os eventos</a><h1>${esc(e.name)}</h1><p class="mute">${fmt(e.date)}, ${esc(e.location)}</p>${fs.map(fightRow).join('')||empty()}`);
 $('#m').onclick=ev=>{const b=ev.target.closest('button[data-f]');if(!b)return;
  const a=b.closest('.fight'),f=fs.find(x=>x.id===b.dataset.f);
  if(!a.classList.contains('open')&&!a.querySelector('.st').innerHTML)a.querySelector('.st').innerHTML=statRows(f);
  a.classList.toggle('open')};
}

function vRank(){
 const divs=[...new Set(S.fg.map(f=>f.div))].sort(),P=S.P;
 M(`<h1>Rankings</h1><div class="ctl"><label>Divisão<select id="dv"><option value="ALL">Geral (todas as lutas)</option>${divs.map(d=>`<option>${esc(d)}</option>`).join('')}</select></label>
 ${[['k','Peso de cada luta (K)',1],['fin','Bônus por finalização',.05],['title','Bônus de cinturão',.05],['min','Mínimo de lutas',1],['years','Ativo nos últimos anos (0 = todos)',1]].map(([k,l,s])=>`<label>${l}<input data-p="${k}" type="number" step="${s}" min="0" value="${P[k]}"></label>`).join('')}</div>
 <p class="mute sub">Todos começam com 1500 pontos. Vencer um adversário forte rende mais. Finalizações e lutas de cinturão aumentam a variação. Só contam lutas da divisão escolhida.</p><div id="rk"></div>`);
 $('#dv').value=S.div;
 const draw=()=>{const E=S.last=elo(),cut=P.years?new Date(Date.now()-P.years*31557600000).toISOString().slice(0,10):'';
  const r=E.rows.filter(x=>x.n>=P.min&&(!cut||x.last>=cut)).sort((a,b)=>b.r-a.r).slice(0,150);
  $('#rk').innerHTML=r.length?r.map((x,i)=>`<a class="rk" href="#/fighter/${x.id}"><b class="pos">${i+1}</b><span class="nm">${esc(S.F.get(x.id)?.name||x.id)}<small>${x.w}-${x.l}-${x.d}, última luta em ${fmt(x.last)}</small></span><span class="rt">${Math.round(x.r)}</span></a>`).join(''):empty()};
 $('#dv').onchange=e=>{S.div=e.target.value;draw()};
 document.querySelectorAll('[data-p]').forEach(i=>i.oninput=e=>{if(e.target.tagName==='INPUT'){P[e.target.dataset.p]=+e.target.value||0;draw()}});
 draw();
}

function vFighters(){
 M(`<h1>Lutadores</h1><input id="q" type="search" placeholder="Buscar por nome ou apelido" aria-label="Buscar lutador"><div id="l"></div>`);
 const draw=()=>{const q=$('#q').value.toLowerCase().trim();
  const r=q?[...S.F.values()].filter(f=>(f.name+' '+f.nick).toLowerCase().includes(q)).slice(0,80):[];
  $('#l').innerHTML=r.length?r.map(f=>`<a class="rk" href="#/fighter/${f.id}" style="grid-template-columns:1fr auto"><span class="nm">${esc(f.name)}<small>${esc(f.nick)}</small></span><span>${esc(f.record)}</span></a>`).join(''):`<p class="empty">${q?'Nenhum lutador encontrado.':'Digite um nome para buscar.'}</p>`};
 $('#q').oninput=draw;draw();
}

function vFighter(id){
 id=mid(id);const p=S.F.get(id);if(!p)return M(empty());
 const E=S.last||(S.last=elo()),H=E.H.get(id)||new Map();
 const fs=S.fg.filter(f=>mid(f.a.id)===id||mid(f.b.id)===id).sort((a,b)=>b.date<a.date?-1:1);
 const skip=['id','name','nick','record'];
 const hist=fs.map(f=>{const a=mid(f.a.id)===id,o=a?f.b:f.a,r=f.res==='draw'?'E':f.res==='nc'?'SR':(f.res===(a?'a':'b')?'V':'D'),h=H.get(f.id);
  const d=h?`<span class="${h.d>=0?'up':'dn'}">${h.d>=0?'+':''}${h.d.toFixed(1)}</span>`:'<span class="mute">fora do escopo</span>';
  return `<div class="h"><span class="mute">${fmt(f.date)}</span><span><b class="${r==='V'?'up':r==='D'?'dn':''}">${r}</b> <a href="#/fighter/${mid(o.id)}">${esc(name(o))}</a><br><span class="mute sub">${esc(f.method)} ${f.round?'R'+esc(f.round):''}, ${esc(f.div)}${f.title?', cinturão':''}</span></span>${d}</div>`}).join('');
 M(`<a class="mute" href="#/fighters">Buscar lutadores</a><h1>${esc(p.name)}</h1><p class="mute">${esc(p.nick)} ${esc(p.record)}</p>
 <dl class="bio">${Object.entries(p).filter(([k])=>!skip.includes(k)).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
 <h2>Histórico</h2><p class="mute sub">Variação de pontos conforme o ranking selecionado: ${S.div==='ALL'?'geral':esc(S.div)}.</p>${hist||empty()}`);
}

function route(){
 const [,p,id]=location.hash.split('/'),k=p||'events';
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===(k==='event'?'events':k==='fighter'?'fighters':k)));
 $('#m').onclick=null;
 ({events:vEvents,event:vEvent,ranking:vRank,fighters:vFighters,fighter:vFighter}[k]||vEvents)(decodeURIComponent(id||''));
 scrollTo(0,0);
}
init();
</script>
</body>
</html>
