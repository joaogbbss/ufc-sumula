<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<title>Súmula UFC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpolygon points='12,1 28,1 39,12 39,28 28,39 12,39 1,28 1,12' fill='%23090a0d' stroke='%23f5c518' stroke-width='3'/%3E%3Cpolygon points='14,9 26,9 31,14 31,26 26,31 14,31 9,26 9,14' fill='%23f5c518'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=Big+Shoulders+Display:wght@600..900&display=swap">
<style>
:root{color-scheme:dark;--bg:#090a0d;--s1:#13151a;--s2:#1b1e25;--ln:#2a2e38;--tx:#eef1f6;--mu:#8b94a5;--gd:#f5c518;--win:#34d399;--loss:#ff4d5e;
--oct:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
--ch:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));
--d:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:400 16px/1.45 Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums;
background:radial-gradient(60% 320px at 50% 0,color-mix(in srgb,var(--gd) 14%,transparent),transparent),linear-gradient(45deg,#ffffff09 1px,transparent 1px) 0 0/28px 28px,linear-gradient(-45deg,#ffffff09 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;max-width:980px;margin:auto;padding:.9rem clamp(1rem,4vw,2rem)}
.brand{display:flex;align-items:center;gap:.6rem;margin-right:auto;font:900 1.7rem var(--d);letter-spacing:.07em}
.brand svg{width:1.9rem}.brand em{font-style:normal;color:var(--gd)}
nav{position:fixed;inset:auto 0 0;display:flex;z-index:9;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:.85rem 0;font:700 1.15rem var(--d);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
nav a.on{color:var(--gd);box-shadow:inset 0 3px var(--gd)}
main{max-width:980px;margin:auto;padding:0 clamp(1rem,4vw,2rem) 2rem}
h1{font:900 clamp(2.4rem,9vw,4.2rem)/.95 var(--d);text-transform:uppercase;margin:.8rem 0 1.5rem;text-wrap:balance}
h1::after{content:"";display:block;width:4.5rem;height:7px;margin-top:.7rem;background:repeating-linear-gradient(-45deg,var(--gd) 0 6px,#000 6px 12px)}
h2{font:800 1.5rem var(--d);letter-spacing:.05em;text-transform:uppercase;margin:1.8rem 0 .6rem;color:var(--gd)}
.mu{color:var(--mu)}.sm{font-size:.85rem}
input,select{width:100%;padding:.7rem .85rem;border:0;box-shadow:inset 0 0 0 1px var(--ln);background:var(--s1);color:var(--tx);font:inherit;clip-path:var(--ch)}
button{font:700 .85rem Archivo,sans-serif;cursor:pointer;border:0;background:var(--s2);color:var(--tx);padding:.45rem .9rem;clip-path:var(--ch)}
button:hover{background:color-mix(in srgb,var(--gd) 22%,var(--s2))}
.card{background:linear-gradient(180deg,var(--s1),color-mix(in srgb,var(--s1) 75%,var(--bg)));clip-path:var(--ch);box-shadow:inset 0 0 0 1px var(--ln);margin-bottom:.7rem}
.ring{position:relative;flex:none;width:2.7rem;aspect-ratio:1;clip-path:var(--oct);background:var(--rc,var(--ln))}
.ring>span{position:absolute;inset:2px;clip-path:var(--oct);background:var(--s1);display:grid;place-items:center;font:800 1.15rem var(--d)}
.ring.big{width:5.5rem;--rc:var(--gd)}.ring.big>span{inset:3px;font-size:2rem}
.ev{display:grid;grid-template-columns:3.6rem 1fr;gap:0 1rem;padding:.9rem 1.1rem}
.day{grid-row:span 2;font:900 2.6rem/1 var(--d);color:var(--gd);text-align:center}
.en{font-weight:700}
.fight{container-type:inline-size;padding:1rem 1.1rem}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:center}
.fa{font:800 1.3rem/1.1 var(--d);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.fa.w{color:var(--tx)}.fa.l{color:var(--mu)}.fa:last-child{text-align:right}
.fa.w::before{content:"V ";color:var(--win)}
.fi{display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:center;margin-top:.7rem;font-size:.85rem;color:var(--mu)}
.fi button{margin-left:auto}
.tag{color:#000;background:var(--gd);padding:0 .5rem;font-weight:800;clip-path:var(--ch)}
@container (min-width:560px){.fa{font-size:1.7rem}}
.st{display:none;padding-top:.8rem}.open .st{display:block}
.sr{display:grid;grid-template-columns:1fr auto 1fr;gap:.15rem .7rem;font-size:.9rem;padding:.3rem 0}
.sr .lb{color:var(--mu);text-align:center}.sr span:last-of-type{text-align:right}
.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.bar i{display:block;height:5px;width:var(--w);background:var(--c)}.bar i:first-child{justify-self:end}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1rem}
.ctl label{display:grid;gap:.25rem;font-size:.8rem;color:var(--mu)}
.rk{display:grid;grid-template-columns:2.7rem 1fr auto;align-items:center;gap:.9rem;padding:.7rem 1rem}
.rk:nth-child(-n+3){--rc:#aab3c2}.rk:first-child{--rc:var(--gd)}
.nm{font-weight:700}.nm small{display:block;font-weight:400;color:var(--mu)}
.mb{display:block;height:3px;margin-top:.4rem;background:var(--ln)}.mb b{display:block;height:100%;background:var(--gd)}
.rt{font:900 1.9rem/1 var(--d);text-align:right}.rt small{display:block;font:400 .75rem Archivo;color:var(--mu)}
details{padding:1rem 1.1rem}summary{cursor:pointer;font:800 1.2rem var(--d);letter-spacing:.05em;text-transform:uppercase}
details p,details li{font-size:.9rem;color:var(--mu)}details b{color:var(--tx)}
.hero{display:flex;gap:1.2rem;align-items:center;margin:.8rem 0 1.2rem}.hero h1{margin:0}
.sp{width:100%;height:130px;display:block}
.bio{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem 1rem;margin:0;padding:1rem 1.1rem}
.bio dt{font-size:.75rem;color:var(--mu)}.bio dd{margin:0;font-weight:700}
.h{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--ln);font-size:.92rem}
.up{color:var(--win)}.dn{color:var(--loss)}
.empty{padding:2rem 0;color:var(--mu)}
footer{max-width:980px;margin:auto;padding:0 clamp(1rem,4vw,2rem) 1.5rem;font-size:.8rem;color:var(--mu)}
@media(min-width:760px){body{padding-bottom:0}nav{position:static;border:0;background:none;backdrop-filter:none;padding:0;gap:.3rem}nav a{flex:none;padding:.4rem 1rem;box-shadow:none}nav a.on{background:var(--gd);color:#000;clip-path:var(--ch);box-shadow:none}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
</head>
<body>
<div class="top"><span class="brand"><svg viewBox="0 0 40 40"><polygon points="12,1 28,1 39,12 39,28 28,39 12,39 1,28 1,12" fill="none" stroke="#f5c518" stroke-width="3"/><polygon points="14,9 26,9 31,14 31,26 26,31 14,31 9,26 9,14" fill="#f5c518"/></svg>SÚMULA <em>UFC</em></span>
<nav><a href="#/events" data-p="events">Eventos</a><a href="#/ranking" data-p="ranking">Rankings</a><a href="#/fighters" data-p="fighters">Lutadores</a></nav></div>
<main id="m"></main>
<footer id="ft"></footer>
<script>
const $=s=>document.querySelector(s),M=h=>$('#m').innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={ev:[],fg:[],F:new Map(),ov:{merges:{},div:{},exclude:[]},meta:{},P:{fin:1,title:.25,z:1,yrs:4,min:3,act:0},div:'ALL',E:null};
try{Object.assign(S.P,JSON.parse(localStorage.sumulaP||'{}'))}catch{}
const mid=id=>S.ov.merges[id]||id,fmt=d=>new Date(d+'T00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
const name=x=>S.F.get(mid(x.id))?.name||x.name,ini=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const empty=()=>`<p class="empty">${S.ev.length?'Nada encontrado.':'Ainda não há dados. No GitHub, abra Actions, escolha "Atualizar base UFC" e clique em Run workflow.'}</p>`;
const L={KD:'Knockdowns','Sig. str.':'Golpes significativos','Total str.':'Golpes totais',Td:'Quedas','Sub. att':'Finalizações tentadas','Rev.':'Viradas',Ctrl:'Controle',Head:'Cabeça',Body:'Corpo',Leg:'Perna',Distance:'Distância',Clinch:'Clinch',Ground:'Solo'};

async function init(){
 const g=async n=>{try{const r=await fetch('data/'+n+'.json',{cache:'no-cache'});return r.ok?r.json():null}catch{return null}};
 const [ev,fg,fi,ov,meta]=await Promise.all(['events','fights','fighters','overrides','meta'].map(g));
 if(ov)S.ov={merges:{},div:{},exclude:[],...ov};
 S.ev=ev||[];S.meta=meta||{};(fi||[]).forEach(f=>S.F.set(f.id,f));
 S.fg=(fg||[]).filter(f=>!S.ov.exclude.includes(f.id)).map(f=>({...f,div:S.ov.div[f.id]||f.div}));
 $('#ft').textContent=(S.meta.updated?`Base atualizada em ${new Date(S.meta.updated).toLocaleString('pt-BR')}. `:'')+'Fonte: ufcstats.com';
 addEventListener('hashchange',route);route();
}

/* Ranking Glicko (Glickman, 1999): nota r + incerteza RD, atualizado luta a luta. */
const Q=Math.LN10/400,RD0=300,RDMIN=45,YR=31557600000,G=rd=>1/Math.sqrt(1+3*Q*Q*rd*rd/Math.PI**2);
function dom(f){const m=f.method||'';if(/^(ko|tko|sub)/i.test(m))return 1;
 return 1-(/dq|split/i.test(m)?.3:/major/i.test(m)?.2:/decision/i.test(m)?.1:0)*S.P.fin}
function glicko(){
 const P=S.P,c2=(RD0**2-RDMIN**2)/Math.max(P.yrs,.5),R=new Map(),H=new Map(),ev={n:0,ok:0,ll:0};
 const g=id=>{if(!R.has(id)){R.set(id,{id,r:1500,rd:RD0,w:0,l:0,d:0,n:0,last:''});H.set(id,new Map())}return R.get(id)};
 const age=(x,t)=>{if(x.last)x.rd=Math.min(RD0,Math.hypot(x.rd,Math.sqrt(c2*Math.max(0,(Date.parse(t)-Date.parse(x.last))/YR))))};
 const step=(X,Y,s)=>{const q=G(Y.rd),e=1/(1+Math.exp(-Q*q*(X.r-Y.r))),pre=1/X.rd**2+Q*Q*q*q*e*(1-e);return{e,dr:Q/pre*q*(s-e),rd:Math.max(RDMIN,Math.sqrt(1/pre))}};
 const L=S.fg.filter(f=>f.res!=='nc'&&(S.div==='ALL'||f.div===S.div)).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(y.ord||0)-(x.ord||0));
 for(const f of L){
  const A=g(mid(f.a.id)),B=g(mid(f.b.id));if(A===B)continue;
  age(A,f.date);age(B,f.date);
  const w=f.res==='draw'?.5:dom(f),sa=f.res==='a'?w:f.res==='b'?1-w:.5,m=f.title?1+P.title:1,pa=A.r,pb=B.r,ua=step(A,B,sa),ub=step(B,A,1-sa);
  if(A.n>=3&&B.n>=3&&f.res!=='draw'){const pw=f.res==='a'?ua.e:ub.e;ev.n++;ev.ok+=pw>.5;ev.ll-=Math.log(Math.max(pw,1e-6))}
  for(const [X,u,s,po] of [[A,ua,sa,pb],[B,ub,1-sa,pa]]){const d=u.dr*m,b=X.r;X.r+=d;X.rd=u.rd;X.n++;X.last=f.date;s>.5?X.w++:s<.5?X.l++:X.d++;
   H.get(X.id).set(f.id,{e:u.e,s,b,o:po,d,a:X.r,rd:X.rd})}
 }
 const today=new Date().toISOString().slice(0,10);
 const rows=[...R.values()].map(x=>{const y={...x};age(y,today);y.sc=y.r-P.z*y.rd;return y});
 return{rows,H,ev};
}

function vEvents(){
 M(`<h1>Eventos</h1><input id="q" type="search" placeholder="Buscar evento, cidade ou ano" aria-label="Buscar evento"><div id="l" style="margin-top:1rem"></div>`);
 const draw=()=>{const q=$('#q').value.toLowerCase();
  const r=S.ev.filter(e=>(e.name+' '+e.location+' '+e.date).toLowerCase().includes(q));
  $('#l').innerHTML=r.length?r.map(e=>{const d=new Date(e.date+'T00:00');
   return `<a class="card ev" href="#/event/${e.id}"><b class="day">${d.getDate()}</b><span class="en">${esc(e.name)}</span><span class="mu sm">${d.toLocaleDateString('pt-BR',{month:'short',year:'numeric'})}, ${esc(e.location)}</span></a>`}).join(''):empty()};
 $('#q').oninput=draw;draw();
}

function statRows(f){
 if(!f.totals&&!f.sig)return '<p class="mu">Sem estatísticas detalhadas para esta luta.</p>';
 const tone=s=>f.res==='draw'||f.res==='nc'?'var(--mu)':f.res===s?'var(--win)':'var(--loss)',n=v=>parseFloat(String(v).split(' of ')[0])||0;
 const row=(lb,a,b)=>{const x=n(a),y=n(b),t=x+y||1;
  return `<div class="sr"><span>${esc(a)}</span><span class="lb">${lb}</span><span>${esc(b)}</span><div class="bar"><i style="--w:${x/t*100}%;--c:${tone('a')}"></i><i style="--w:${y/t*100}%;--c:${tone('b')}"></i></div></div>`};
 let h='';
 for(const [src,keys] of [[f.totals,['KD','Sig. str.','Total str.','Td','Sub. att','Rev.','Ctrl']],[f.sig,['Head','Body','Leg','Distance','Clinch','Ground']]])
  if(src)for(const k of keys)if(src.a?.[k]!==undefined)h+=row(L[k],src.a[k],src.b[k]);
 const rt=f.rounds?.totals||[];
 if(rt.length)h+='<h2>Golpes significativos por round</h2>'+rt.map((r,i)=>row('Round '+(i+1),r.a?.['Sig. str.']??'-',r.b?.['Sig. str.']??'-')).join('');
 return h+(f.detail?`<p class="mu sm">${esc(f.detail)}</p>`:'');
}

function fightRow(f){
 const w=s=>f.res==='draw'||f.res==='nc'?'':(f.res===s?'w':'l'),side=s=>`<a class="fa ${w(s)}" href="#/fighter/${mid(f[s].id)}">${esc(name(f[s]))}</a>`;
 const out=f.res==='draw'?'Empate':f.res==='nc'?'Sem resultado':esc(f.method);
 return `<article class="card fight" id="f${f.id}"><div class="fx">${side('a')}<span class="ring"><span>VS</span></span>${side('b')}</div>
 <div class="fi"><span>${out}</span>${f.round?`<span>R${esc(f.round)} ${esc(f.time)}</span>`:''}<span>${esc(f.div)}</span>${f.title?'<span class="tag">Cinturão</span>':''}<button data-f="${f.id}">Estatísticas</button></div><div class="st"></div></article>`;
}

function vEvent(id){
 const e=S.ev.find(x=>x.id===id);if(!e)return M(empty());
 const fs=S.fg.filter(f=>f.ev===id).sort((a,b)=>a.ord-b.ord);
 M(`<a class="mu" href="#/events">Todos os eventos</a><h1>${esc(e.name)}</h1><p class="mu" style="margin-top:-.6rem">${fmt(e.date)}, ${esc(e.location)}</p>${fs.map(fightRow).join('')||empty()}`);
 $('#m').onclick=ev=>{const b=ev.target.closest('button[data-f]');if(!b)return;
  const a=b.closest('.fight'),f=fs.find(x=>x.id===b.dataset.f),st=a.querySelector('.st');
  if(!st.innerHTML)st.innerHTML=statRows(f);a.classList.toggle('open')};
}

function vRank(){
 const divs=[...new Set(S.fg.map(f=>f.div))].sort(),P=S.P;
 const C=[['z','Cautela com a incerteza (z)',.25],['fin','Peso do método de vitória (0 a 1)',.1],['title','Bônus de cinturão',.05],['yrs','Anos parado até incerteza máxima',1],['min','Mínimo de lutas',1],['act','Ativo nos últimos anos (0 = todos)',1]];
 M(`<h1>Rankings</h1><div class="ctl"><label>Divisão<select id="dv"><option value="ALL">Geral (todas as lutas)</option>${divs.map(d=>`<option>${esc(d)}</option>`).join('')}</select></label>
 ${C.map(([k,l,s])=>`<label>${l}<input data-p="${k}" type="number" step="${s}" min="0" value="${P[k]}"></label>`).join('')}</div>
 <p class="mu sm" id="cal"></p><div id="rk"></div>
 <details class="card"><summary>Como a nota é calculada</summary>
 <p><b>Base:</b> sistema Glicko (Glickman, 1999). Cada lutador tem uma nota <b>r</b> e uma incerteza <b>RD</b>. A chance esperada de vitória usa a curva logística de Bradley–Terry (1952) e Elo (1978), e a incerteza do adversário reduz o peso do resultado.</p>
 <p><b>A balança:</b> vencer um favorito rende pouco e vencer um azarão rende muito. Perder para um favorito custa pouco, e perder para um azarão custa muito. Vencer quem tem nota alta e bem estabelecida vale mais do que vencer quem tem poucas lutas.</p>
 <p><b>Incerteza:</b> a RD diminui a cada luta e volta a crescer com a inatividade (Glickman, 2001, Glicko-2). O ranking ordena por <b>r − z·RD</b>, um limite inferior conservador, na mesma lógica do μ−3σ do TrueSkill (Herbrich, Minka e Graepel, 2006). Quem tem poucas lutas ou está parado há anos sobe menos.</p>
 <p><b>Método e cinturão:</b> finalizações valem vitória cheia, decisões valem um pouco menos (unânime, majoritária, dividida), e lutas de cinturão ampliam a variação. É um ajuste de margem de vitória, no espírito das variantes de Elo para esportes, mas com valores escolhidos por mim e não calibrados.</p>
 <p><b>Validação:</b> a linha acima das posições testa o modelo de forma sequencial. Cada luta é prevista só com o que se sabia antes dela, então ajustar os parâmetros e ver a precisão e o log-loss melhorarem é um jeito honesto de calibrar.</p>
 <p><b>Referências:</b> Elo, A. (1978) <i>The Rating of Chessplayers, Past and Present</i>. Bradley &amp; Terry (1952) <i>Biometrika</i> 39. Glickman (1999) <i>Applied Statistics</i> 48(3). Glickman (2001) <i>J. Applied Statistics</i> 28(6). Herbrich, Minka &amp; Graepel (2006) TrueSkill, <i>NIPS</i> 19. Kovalchik (2016) <i>J. Quantitative Analysis in Sports</i> 12(3).</p></details>`);
 $('#dv').value=S.div;
 const draw=()=>{const E=S.E=glicko(),cut=P.act?new Date(Date.now()-P.act*YR).toISOString().slice(0,10):'';
  const r=E.rows.filter(x=>x.n>=P.min&&(!cut||x.last>=cut)).sort((a,b)=>b.sc-a.sc).slice(0,150);
  const v=E.ev;$('#cal').textContent=v.n?`Validação sequencial: o favorito venceu em ${(v.ok/v.n*100).toFixed(1)}% de ${v.n.toLocaleString('pt-BR')} lutas, log-loss ${(v.ll/v.n).toFixed(3)} (menor é melhor; 0,693 equivale a chutar).`:'';
  const hi=r[0]?.sc,lo=r.at(-1)?.sc;
  $('#rk').innerHTML=r.length?r.map((x,i)=>`<a class="card rk" href="#/fighter/${x.id}"><span class="ring"><span>${i+1}</span></span><span class="nm">${esc(S.F.get(x.id)?.name||x.id)}<small>${x.w}-${x.l}-${x.d}, última luta em ${fmt(x.last)}</small><i class="mb"><b style="width:${hi===lo?100:(x.sc-lo)/(hi-lo)*100}%"></b></i></span><span class="rt">${Math.round(x.sc)}<small>${Math.round(x.r)} ± ${Math.round(x.rd)}</small></span></a>`).join(''):empty()};
 $('#dv').onchange=e=>{S.div=e.target.value;draw()};
 document.querySelectorAll('input[data-p]').forEach(i=>i.oninput=e=>{P[e.target.dataset.p]=+e.target.value||0;try{localStorage.sumulaP=JSON.stringify(P)}catch{}draw()});
 draw();
}

function vFighters(){
 M(`<h1>Lutadores</h1><input id="q" type="search" placeholder="Buscar por nome ou apelido" aria-label="Buscar lutador"><div id="l" style="margin-top:1rem"></div>`);
 const draw=()=>{const q=$('#q').value.toLowerCase().trim(),r=q?[...S.F.values()].filter(f=>(f.name+' '+f.nick).toLowerCase().includes(q)).slice(0,80):[];
  $('#l').innerHTML=r.length?r.map(f=>`<a class="card rk" href="#/fighter/${f.id}"><span class="ring"><span>${esc(ini(f.name))}</span></span><span class="nm">${esc(f.name)}<small>${esc(f.nick)}</small></span><span class="mu">${esc(f.record)}</span></a>`).join(''):`<p class="empty">${q?'Nenhum lutador encontrado.':'Digite um nome para buscar.'}</p>`};
 $('#q').oninput=draw;draw();
}

function spark(h){
 if(h.length<2)return'';
 const W=600,Hh=130,v=h.flatMap(x=>[x.a+x.rd,x.a-x.rd]),lo=Math.min(...v),hi=Math.max(...v),X=i=>i/(h.length-1)*W,Y=y=>Hh-5-(y-lo)/(hi-lo||1)*(Hh-10);
 const band=h.map((x,i)=>`${X(i)},${Y(x.a+x.rd)}`).concat(h.map((x,i)=>`${X(i)},${Y(x.a-x.rd)}`).reverse()).join(' '),line=h.map((x,i)=>`${X(i)},${Y(x.a)}`).join(' ');
 return `<svg class="sp" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Evolução da nota"><polygon points="${band}" fill="var(--gd)" opacity=".16"/><polyline points="${line}" fill="none" stroke="var(--gd)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
}

function vFighter(id){
 id=mid(id);const p=S.F.get(id);if(!p)return M(empty());
 const E=S.E||(S.E=glicko()),H=E.H.get(id)||new Map(),me=E.rows.find(x=>x.id===id);
 const fs=S.fg.filter(f=>mid(f.a.id)===id||mid(f.b.id)===id).sort((a,b)=>b.date<a.date?-1:1);
 const skip=['id','name','nick','record'],ser=fs.map(f=>H.get(f.id)).filter(Boolean);
 const hist=[...fs].reverse().map(f=>{const a=mid(f.a.id)===id,o=a?f.b:f.a,r=f.res==='draw'?'E':f.res==='nc'?'SR':(f.res===(a?'a':'b')?'V':'D'),h=H.get(f.id);
  const d=h?`<span class="${h.d>=0?'up':'dn'}">${h.d>=0?'+':''}${h.d.toFixed(1)}</span>`:'<span class="mu sm">fora do escopo</span>';
  return `<div class="h"><span class="mu">${fmt(f.date)}</span><span><b class="${r==='V'?'up':r==='D'?'dn':''}">${r}</b> <a href="#/fighter/${mid(o.id)}"><b>${esc(name(o))}</b></a><br><span class="mu sm">${esc(f.method)} ${f.round?'R'+esc(f.round):''}, ${esc(f.div)}${f.title?', cinturão':''}${h?`, chance prevista ${Math.round(h.e*100)}% (rival ${Math.round(h.o)})`:''}</span></span>${d}</div>`}).join('');
 M(`<a class="mu" href="#/fighters">Buscar lutadores</a>
 <div class="hero"><span class="ring big"><span>${esc(ini(p.name))}</span></span><div><h1>${esc(p.name)}</h1><span class="mu">${esc(p.nick)} ${esc(p.record)}</span></div></div>
 ${me?`<div class="card" style="padding:1rem 1.1rem"><div style="display:flex;justify-content:space-between;align-items:end;gap:1rem"><div><span class="mu sm">Nota ${S.div==='ALL'?'geral':esc(S.div)}</span><div class="rt" style="text-align:left;font-size:3rem">${Math.round(me.sc)}</div></div><span class="mu sm" style="text-align:right">r ${Math.round(me.r)} ± ${Math.round(me.rd)}<br>${me.w}-${me.l}-${me.d} no escopo</span></div>${spark(ser)}</div>`:''}
 <h2>Ficha</h2><dl class="card bio">${Object.entries(p).filter(([k])=>!skip.includes(k)).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
 <h2>Histórico</h2><p class="mu sm">Pontos ganhos ou perdidos em cada luta, no ranking selecionado em Rankings.</p>${hist||empty()}`);
}

function route(){
 const [,p,id]=location.hash.split('/'),k=p||'events';
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===(k==='event'?'events':k==='fighter'?'fighters':k)));
 const run=()=>{$('#m').onclick=null;({events:vEvents,event:vEvent,ranking:vRank,fighters:vFighters,fighter:vFighter}[k]||vEvents)(decodeURIComponent(id||''));scrollTo(0,0)};
 document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches?document.startViewTransition(run):run();
}
init();
</script>
