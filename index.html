<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Súmula UFC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpolygon points='12,1 28,1 39,12 39,28 28,39 12,39 1,28 1,12' fill='%23090a0d' stroke='%23f5c518' stroke-width='3'/%3E%3Cpolygon points='14,9 26,9 31,14 31,26 26,31 14,31 9,26 9,14' fill='%23f5c518'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=Big+Shoulders+Display:wght@600..900&display=swap">
<style>
:root{color-scheme:dark;--bg:#090a0d;--s1:#13151a;--s2:#1b1e25;--ln:#2a2e38;--tx:#eef1f6;--mu:#8b94a5;--gd:#f5c518;--cb:#6c8cff;--win:#34d399;--loss:#ff4d5e;
--oct:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);
--ch:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));
--d:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:400 16px/1.45 Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums;
background:radial-gradient(60% 320px at 50% 0,color-mix(in srgb,var(--gd) 14%,transparent),transparent),linear-gradient(45deg,#ffffff09 1px,transparent 1px) 0 0/28px 28px,linear-gradient(-45deg,#ffffff09 1px,transparent 1px) 0 0/28px 28px,var(--bg);background-attachment:fixed;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;max-width:980px;margin:auto;padding:.9rem clamp(1rem,4vw,2rem)}
.brand{display:flex;align-items:center;gap:.6rem;margin-right:auto;font:900 1.7rem var(--d);letter-spacing:.07em}
.brand svg{width:1.9rem}.brand em{font-style:normal;color:var(--gd)}
nav{position:fixed;inset:auto 0 0;display:flex;z-index:9;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:.85rem 0;font:700 1.1rem var(--d);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
nav a.on{color:var(--gd);box-shadow:inset 0 3px var(--gd)}
main{max-width:980px;margin:auto;padding:0 clamp(1rem,4vw,2rem) 2rem}
h1{font:900 clamp(2.4rem,9vw,4.2rem)/.95 var(--d);text-transform:uppercase;margin:.8rem 0 1.5rem;text-wrap:balance}
h1::after{content:"";display:block;width:4.5rem;height:7px;margin-top:.7rem;background:repeating-linear-gradient(-45deg,var(--gd) 0 6px,#000 6px 12px)}
h2{font:800 1.5rem var(--d);letter-spacing:.05em;text-transform:uppercase;margin:1.8rem 0 .6rem;color:var(--gd)}
.mu{color:var(--mu)}.sm{font-size:.85rem}
input,select,textarea{width:100%;padding:.7rem .85rem;border:0;box-shadow:inset 0 0 0 1px var(--ln);background:var(--s1);color:var(--tx);font:inherit;clip-path:var(--ch)}
textarea{min-height:4.5rem}
button,.btn{display:inline-block;font:700 .85rem Archivo,sans-serif;cursor:pointer;border:0;background:var(--s2);color:var(--tx);padding:.45rem .9rem;clip-path:var(--ch)}
button:hover,.btn:hover{background:color-mix(in srgb,var(--gd) 22%,var(--s2))}
.lg{margin-left:.6rem;font:800 .95rem var(--d);letter-spacing:.08em}
.card{background:linear-gradient(180deg,var(--s1),color-mix(in srgb,var(--s1) 75%,var(--bg)));clip-path:var(--ch);box-shadow:inset 0 0 0 1px var(--ln);margin-bottom:.7rem}
.ring{position:relative;flex:none;width:2.7rem;aspect-ratio:1;clip-path:var(--oct);background:var(--rc,var(--ln))}
.ring>span{position:absolute;inset:2px;clip-path:var(--oct);background:var(--s1);display:grid;place-items:center;font:800 1.15rem var(--d)}
.ring.sm{width:2.2rem}.ring.sm>span{font-size:.9rem}
.ring.big{width:5.5rem;--rc:var(--gd)}.ring.big>span{inset:3px;font-size:2rem}
.ev{display:grid;grid-template-columns:3.6rem 1fr;gap:0 1rem;padding:.9rem 1.1rem}
.day{grid-row:span 2;font:900 2.6rem/1 var(--d);color:var(--gd);text-align:center}
.en{font-weight:700}
.fight{container-type:inline-size;padding:1rem 1.1rem}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:center}
.fa{font:800 1.3rem/1.1 var(--d);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.fa.w{color:var(--tx)}.fa.l{color:var(--mu)}.fa:last-child{text-align:right}
.fa.w::before{content:"W ";color:var(--win)}
html[lang^=pt] .fa.w::before{content:"V "}
.fi{display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:center;margin-top:.7rem;font-size:.85rem;color:var(--mu)}
.fi button{margin-left:auto}
.tag{color:#000;background:var(--gd);padding:0 .5rem;font-weight:800;clip-path:var(--ch)}
@container (min-width:560px){.fa{font-size:1.7rem}}
.hl{box-shadow:inset 0 0 0 2px var(--gd)}
.st{display:none;padding-top:.8rem}.open .st{display:block}
.sr{display:grid;grid-template-columns:1fr auto 1fr;gap:.15rem .7rem;font-size:.9rem;padding:.3rem 0}
.sr .lb{color:var(--mu);text-align:center}.sr span:last-of-type{text-align:right}
.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.bar i{display:block;height:5px;width:var(--w);background:var(--c)}.bar i:first-child{justify-self:end}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1rem}
.ctl label{display:grid;gap:.25rem;font-size:.8rem;color:var(--mu)}
.rk{display:grid;grid-template-columns:2.7rem 1fr auto;align-items:center;gap:.9rem;padding:.7rem 1rem}
.rk:nth-child(-n+3){--rc:#aab3c2}.rk:first-child{--rc:var(--gd)}
.nm{font-weight:700}.nm small{display:block;font-weight:400;color:var(--mu)}
.mb{display:block;height:3px;margin-top:.4rem;background:var(--ln)}.mb b{display:block;height:100%;background:var(--gd)}
.rt{font:900 1.9rem/1 var(--d);text-align:right}.rt small{display:block;font:400 .75rem Archivo;color:var(--mu)}
details{padding:1rem 1.1rem}summary{cursor:pointer;font:800 1.2rem var(--d);letter-spacing:.05em;text-transform:uppercase}
details p,details li{font-size:.9rem;color:var(--mu)}details b{color:var(--tx)}
.hero{display:flex;gap:1.2rem;align-items:center;margin:.8rem 0 1.2rem}.hero h1{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.sp{width:100%;height:130px;display:block}
.bio{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem 1rem;margin:0;padding:1rem 1.1rem}
.bio dt{font-size:.75rem;color:var(--mu)}.bio dd{margin:0;font-weight:700}
.h{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--ln);font-size:.92rem}
.up{color:var(--win)}.dn{color:var(--loss)}
.sel{display:flex;align-items:center;gap:.7rem}.sel button{margin-left:auto}
.res button{display:flex;width:100%;justify-content:space-between;margin-top:.3rem;text-align:left}
.pb{display:flex;height:2.4rem;margin:.7rem 0;font:800 1.3rem var(--d)}.pb i{display:flex;align-items:center;padding:0 .7rem;font-style:normal;color:#000;min-width:3rem}
.tb{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr;gap:.3rem .6rem;padding:.4rem 0;border-bottom:1px solid var(--ln);font-size:.88rem}
.tb.best{color:var(--gd)}.tb.hd{color:var(--mu);font-size:.75rem}
.pk.on{background:var(--gd);color:#000}
.empty{padding:2rem 0;color:var(--mu)}
footer{max-width:980px;margin:auto;padding:0 clamp(1rem,4vw,2rem) 1.5rem;font-size:.8rem;color:var(--mu)}
@media(min-width:760px){body{padding-bottom:0}nav{position:static;border:0;background:none;backdrop-filter:none;padding:0;gap:.3rem}nav a{flex:none;padding:.4rem 1rem;box-shadow:none}nav a.on{background:var(--gd);color:#000;clip-path:var(--ch);box-shadow:none}}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.seg{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}.seg button.on{background:var(--gd);color:#000}
.xs{display:grid;grid-template-columns:1fr;gap:.6rem}
@media(min-width:620px){.xs{grid-template-columns:1fr 1fr}}
.stk{display:flex;height:10px;margin:.5rem 0}.stk i{display:block}
.xg{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.85rem;color:var(--mu)}.xg b{color:var(--tx)}
@media(max-width:480px){nav a{font-size:.95rem;letter-spacing:.02em}}
.fc{max-width:340px;padding:1rem 1.2rem 1.1rem;clip-path:var(--ch);color:#14110a;background:linear-gradient(155deg,var(--c1),var(--c2));margin:.4rem 0 1rem}
.fc.legend{--c1:#fff2a8;--c2:#e0a800}.fc.elite{--c1:#ffe484;--c2:#c9920e}.fc.gold{--c1:#f3d27a;--c2:#a67c1e}.fc.silver{--c1:#e6ebf2;--c2:#8e98a8}.fc.bronze{--c1:#e0a877;--c2:#8a5428}
.fct{display:flex;justify-content:space-between;align-items:center}.fco{font:900 3.6rem/1 var(--d)}.fco small{display:block;font:800 .9rem var(--d);letter-spacing:.1em}.fco em{display:block;font:800 .95rem var(--d);letter-spacing:.08em;font-style:normal;text-transform:uppercase;opacity:.75}
.fc .ring.big{--rc:#14110a}.fc .ring>span{background:#f3efe2;color:#14110a}
.fcn{font:900 1.7rem/1.05 var(--d);text-transform:uppercase;margin-top:.5rem}.fcd{font-size:.8rem;opacity:.7;margin-bottom:.6rem}
.fca{display:grid;grid-template-columns:2.6rem 1fr 2rem;gap:.5rem;align-items:center;font:800 .95rem var(--d);letter-spacing:.05em}
.fca i{display:block;height:7px;background:rgba(0,0,0,.18)}.fca u{display:block;height:100%;background:#14110a}.fca span{text-align:right}
.fcf{margin-top:.6rem;font:800 .75rem var(--d);letter-spacing:.2em;opacity:.55}
.rdr{width:100%;max-width:340px;display:block;margin:0 auto}
@media(max-width:560px){nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav a{flex:1 0 auto;padding-left:.7rem;padding-right:.7rem}}

.up-ev{padding:0;overflow:hidden}
.up-ev>summary{list-style:none;display:grid;grid-template-columns:auto 1fr;column-gap:.7rem;row-gap:.25rem;align-items:center;cursor:pointer;padding:.85rem 1.1rem;-webkit-tap-highlight-color:transparent}
.up-ev>summary::-webkit-details-marker{display:none}
.up-ev>summary::before{content:'▸';grid-row:1/3;color:var(--gd);font-size:1.4rem;line-height:1;transition:transform .18s ease}
.up-ev[open]>summary::before{transform:rotate(90deg)}
.up-ev .ue-t{font:900 1.3rem var(--d);text-transform:uppercase;line-height:1.1}
.up-ev .ue-b{grid-column:2;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.up-ev .ue-body{padding:0 1rem 1rem}
.up-ev .ue-body>.card.fight{margin:.6rem 0 0}
.up-ev .fight .st{display:none}
.up-ev .fight.open .st{display:block}
.rdrow{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;margin:.3rem 0}
.rdrow b{min-width:2rem}

/* ---- reforma de UI/UX ---- */
.up-fx .fa{display:flex;align-items:center;gap:.5rem;min-width:0}.up-fx .fa:last-child{justify-content:flex-end;text-align:right}
.fa .ring{display:inline-block;vertical-align:middle;flex:none}.fx .fa>.ring{margin:0 .35rem}
.fav{height:7px;background:var(--cb);overflow:hidden;margin:.6rem 0 .2rem}.fav i{display:block;height:100%;background:var(--gd)}
.fvl{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.fa2{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}.fa2 .pickbox{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.xbar{display:inline-flex;gap:.3rem;flex-wrap:wrap;align-items:center;margin-left:auto;font-family:Archivo,sans-serif;text-transform:none;letter-spacing:0}
.xbar button{font:700 .72rem Archivo,sans-serif;padding:.28rem .55rem;color:var(--mu);text-transform:none;letter-spacing:0}
h2.xh{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .8rem}h1 .xbar{margin-left:.8rem;vertical-align:middle}.xrow{display:flex;justify-content:flex-end;margin:.2rem 0 .5rem}
nav .more{display:none;flex:1;font:700 1.1rem var(--d);letter-spacing:.06em;text-transform:uppercase;color:var(--mu);background:none;border:0;padding:.85rem 0;clip-path:none}
nav .more.on{color:var(--gd);box-shadow:inset 0 3px var(--gd)}
@media(max-width:759px){nav a.mo{display:none}nav .more{display:block}}
.sheet{position:fixed;inset:0;z-index:40;display:none}.sheet.open{display:block}.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;background:var(--s1);border-top:2px solid var(--gd);border-radius:18px 18px 0 0;padding:.9rem 1rem calc(1.2rem + env(safe-area-inset-bottom));max-width:620px;margin:auto}
.sheet .grab{width:42px;height:4px;background:var(--ln);border-radius:2px;margin:0 auto .9rem}
.sheet .gr{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.shc{display:flex;align-items:center;gap:.7rem;padding:1rem;background:var(--s2);clip-path:var(--ch);font:800 1.15rem var(--d);text-transform:uppercase;color:var(--tx)}.shc.on{background:var(--gd);color:#000}
.sheet.gs .pn{top:0;bottom:auto;border-top:0;border-bottom:2px solid var(--gd);border-radius:0 0 18px 18px}
.gsr{display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;margin:.4rem 0}.gsr .nm{flex:1;min-width:0;font:800 1.05rem var(--d);text-transform:uppercase}.gsr .nm small{display:block;font:400 .75rem Archivo;color:var(--mu);text-transform:none}
.gsb{display:flex;gap:.3rem;flex-wrap:wrap}.gsb a{font:700 .75rem Archivo;padding:.3rem .6rem;background:var(--s2);clip-path:var(--ch);color:var(--tx)}
#gsi{width:100%;margin-bottom:.4rem}
.totop{position:fixed;right:1rem;bottom:calc(4.6rem + env(safe-area-inset-bottom));z-index:20;display:none;width:2.7rem;height:2.7rem;padding:0;font:900 1.3rem var(--d);background:var(--gd);color:#000;clip-path:var(--oct)}.totop.show{display:block}
@media(min-width:760px){.totop{bottom:1.2rem}}
.seg.jmp{position:sticky;top:0;z-index:6;background:var(--bg);padding:.5rem 0;margin-bottom:.6rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.seg.jmp::-webkit-scrollbar{display:none}.seg.jmp button{flex:none;white-space:nowrap}
[id^=sc-],[id^=lb-]{scroll-margin-top:3.6rem}
.tb.hd{color:var(--tx);background:var(--s2);font-weight:700;padding-left:.4rem;padding-right:.4rem}.tb:not(.hd){padding-left:.4rem;padding-right:.4rem}.tb:not(.hd):nth-child(even){background:color-mix(in srgb,var(--s2) 38%,transparent)}
.spw{margin-top:.6rem}.spi{font-size:.85rem;color:var(--mu);min-height:1.4rem}.spc{position:relative}
.spd{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);padding:0;background:transparent;clip-path:none;border-radius:50%}.spd::after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--gd)}.spd.on::after{inset:5px;background:#fff}

.ub{display:inline-block;margin-left:.4rem;padding:.04rem .4rem;font:800 .68rem Archivo,sans-serif;letter-spacing:.02em;background:var(--s2);color:var(--gd);border:1px solid var(--gd);vertical-align:middle;white-space:nowrap;text-transform:none}.ub.c{background:var(--gd);color:#000}.ub.p{color:var(--cb);border-color:var(--cb)}
.bn{font:700 .7rem Archivo,sans-serif;color:var(--gd);white-space:nowrap}
</style>
</head>
<body>
<div class="top"><span class="brand"><svg viewBox="0 0 40 40"><polygon points="12,1 28,1 39,12 39,28 28,39 12,39 1,28 1,12" fill="none" stroke="#f5c518" stroke-width="3"/><polygon points="14,9 26,9 31,14 31,26 26,31 14,31 9,26 9,14" fill="#f5c518"/></svg>SÚMULA <em>UFC</em></span><nav id="nv"></nav><button class="lg" id="gs" aria-label="Buscar" title="/ ou Ctrl+K" style="margin-left:auto">🔍</button><button class="lg" id="lg">PT</button></div>
<main id="m"><p class="mu" style="padding:2rem 0">Carregando base de dados do UFC…</p></main>
<footer id="ft"></footer>

<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('m');
  if (el) el.innerHTML = '<div class="card" style="padding:1rem"><b class="dn">Erro JS detectado:</b><p class="mu sm">' + (e.message || e) + ' (linha ' + (e.lineno || '?') + ')</p></div>';
});
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('m');
  if (el) el.innerHTML = '<div class="card" style="padding:1rem"><b class="dn">Erro de Promise:</b><p class="mu sm">' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</p></div>';
});
</script>

<script>
const $ = s => document.querySelector(s);
const M = h => { $('#m').innerHTML = h; if (window.XEXP) window.XEXP.attach(); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S = {
  ev: [], fg: [], F: new Map(),
  ov: {merges:{}, div:{}, exclude:[]},
  meta: {},
  P: {vol:80, fin:1, title:.25, tw:1, min:1, act:2},
  mode: 'cur', div: 'ALL', pt: true,
  sim: {a:'', b:'', m:'cur', d:'ALL'},
  ps: {}, cache: new Map(), lg: null,
  me: {ph:{}, fav:{}, note:{}, log:{}},
  up: [], simLast: null
};

/* sumulaP4: o mínimo de lutas padrão caiu de 3 para 1; preferências antigas (P3) são aproveitadas, menos esse campo */
try { const o = JSON.parse(localStorage.sumulaP4 || 'null'); if (o) Object.assign(S.P, o); else { const { min, ...r } = JSON.parse(localStorage.sumulaP3 || '{}'); Object.assign(S.P, r); } } catch {}
try { Object.assign(S.me, JSON.parse(localStorage.sumulaMe || '{}')); } catch {}
try { if (localStorage.sumulaLang) S.pt = localStorage.sumulaLang === 'pt'; } catch {}

const T = (en, pt) => S.pt ? pt : en;
const saveMe = () => {
  try { localStorage.sumulaMe = JSON.stringify(S.me); }
  catch { alert(T('Storage is full. Remove some photos.', 'Armazenamento cheio. Remova algumas fotos.')); }
};
const mid = id => S.ov.merges[id] || id;
const fmt = d => new Date(d + 'T00:00').toLocaleDateString(S.pt ? 'pt-BR' : 'en-US', {day:'2-digit', month:'short', year:'numeric'});
const name = x => S.F.get(mid(x.id))?.name || x.name;
const ini = n => String(n || '').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
// Foto do lutador: 1) a que você colocou; 2) a VERIFICADA (data/photos.json); 3) a do scraper, enquanto ainda não foi auditada
const photoOf = id => { const k = mid(id); return S.me.ph[id] || S.me.ph[k] || S.pu?.[k] || (S.rej?.has(k) ? null : S.F.get(k)?.img) || null; };
// As iniciais ficam SEMPRE por baixo; se a foto não carregar, ela some e as iniciais aparecem (nunca mais octógono vazio)
const av = (id, n, c = '') => {
  const im = photoOf(id);
  return `<span class="ring ${c}"><span>${esc(ini(n))}${im ? `<img src="${esc(im)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top">` : ''}</span></span>`;
};
const empty = () => `<p class="empty">${
  S.ev.length
    ? T('Nothing found.', 'Nada encontrado.')
    : location.protocol === 'file:'
      ? T('Opened via file:// — Run "python -m http.server 8000" or open via GitHub Pages.', 'Aberto via file:// — Rode "python -m http.server 8000" ou abra pelo GitHub Pages.')
      : T('No data yet. On GitHub, open Actions and run "Atualizar base UFC".', 'Ainda não há dados. No GitHub, abra Actions e rode "Atualizar base UFC".')
}</p>`;

const LB = {
  KD: ['Knockdowns', 'Knockdowns'],
  'Sig. str.': ['Significant strikes', 'Golpes significativos'],
  'Total str.': ['Total strikes', 'Golpes totais'],
  Td: ['Takedowns', 'Quedas'],
  'Sub. att': ['Submission attempts', 'Finalizações tentadas'],
  'Rev.': ['Reversals', 'Viradas'],
  Ctrl: ['Control time', 'Controle'],
  Head: ['Head', 'Cabeça'],
  Body: ['Body', 'Corpo'],
  Leg: ['Leg', 'Perna'],
  Distance: ['Distance', 'Distância'],
  Clinch: ['Clinch', 'Clinch'],
  Ground: ['Ground', 'Solo']
};
const lb = k => LB[k][S.pt ? 1 : 0];

/* ---------- Rating engine: Whole-History Rating (Coulom, 2008) ---------- */
function dom(f) {
  const m = f.method || '';
  if (/^(ko|tko|sub)/i.test(m)) return 1;
  return 1 - (/dq|split/i.test(m) ? .3 : /major/i.test(m) ? .2 : /decision/i.test(m) ? .1 : 0) * S.P.fin;
}
const scope = (d = S.div) => S.fg.filter(f => f.res !== 'nc' && (d === 'ALL' || f.div === d)).sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : (y.ord || 0) - (x.ord || 0));
const TG = (t, won) => !t ? '' : ({
  conq: won ? T('won the belt', 'conquistou o cinturão') : T('lost the belt', 'perdeu o cinturão'),
  vago: won ? T('won the vacant belt', 'conquistou o cinturão vago') : T('fought for the vacant belt', 'disputou o cinturão vago'),
  def: won ? T('defended the belt', 'defendeu o cinturão') : T('fought for the belt', 'disputou o cinturão'),
  int: won ? T('won the interim belt', 'conquistou o interino') : T('fought for the interim belt', 'disputou o interino')
})[t];

function whr(L, P) {
  const w2 = (P.vol / U) ** 2, tau2 = 6.25;
  const N = new Map(), tag = new Map(), ch = new Map(), cnt = new Map(), rg = [], op = new Map();
  for (const f of L) {
    if (!f.title || (f.res !== 'a' && f.res !== 'b')) continue;
    const W = mid(f[f.res].id), Lo = mid(f[f.res === 'a' ? 'b' : 'a'].id);
    const c = cnt.get(W) || {cq:0, df:0, iv:0};
    cnt.set(W, c);
    if (/interim/i.test(f.tt || '')) { tag.set(f.id, 'int'); c.iv++; continue; }
    const cur = ch.get(f.div), o = op.get(f.div);
    if (cur === W) {
      tag.set(f.id, 'def'); c.df++;
      if (o) { o.def++; o.last = f.date; }
    } else {
      tag.set(f.id, cur === Lo ? 'conq' : 'vago'); c.cq++; ch.set(f.div, W);
      if (o) o.end = f.date;
      const n = {id:W, div:f.div, start:f.date, last:f.date, end:null, def:0};
      op.set(f.div, n); rg.push(n);
    }
  }
  for (const f of L) {
    const ia = mid(f.a.id), ib = mid(f.b.id);
    if (ia === ib) continue;
    const t = Date.parse(f.date) / YR, w = f.res === 'draw' ? .5 : dom(f);
    const sa = f.res === 'a' ? w : f.res === 'b' ? 1 - w : .5;
    const m = f.title ? 1 + P.title : 1, ip = /interim/i.test(f.tt || ''), ti = !!f.title;
    const na = {t, r:0, gs:[], f:f.id, id:ia, dt:f.date, ti, ip};
    const nb = {t, r:0, gs:[], f:f.id, id:ib, dt:f.date, ti, ip};
    na.gs.push({o:nb, s:sa, m}); nb.gs.push({o:na, s:1 - sa, m});
    for (const [id, n] of [[ia, na], [ib, nb]]) {
      if (!N.has(id)) N.set(id, []);
      N.get(id).push(n);
    }
  }
  const solve = a => {
    const n = a.length, d = new Array(n), e = new Array(n), g = new Array(n);
    let mx = 0;
    for (let i = 0; i < n; i++) {
      const x = a[i]; let gi = 0, di = 0;
      for (const k of x.gs) {
        const p = 1 / (1 + Math.exp(k.o.r - x.r));
        gi += k.m * (k.s - p); di += k.m * p * (1 - p);
      }
      if (i === 0) { gi -= x.r / tau2; di += 1 / tau2; }
      else { const v = w2 * Math.max(x.t - a[i - 1].t, .05); gi -= (x.r - a[i - 1].r) / v; di += 1 / v; e[i - 1] = -1 / v; }
      if (i < n - 1) { const v = w2 * Math.max(a[i + 1].t - x.t, .05); gi += (a[i + 1].r - x.r) / v; di += 1 / v; }
      d[i] = di; g[i] = gi;
    }
    for (let i = 1; i < n; i++) { const f = e[i - 1] / d[i - 1]; d[i] -= f * e[i - 1]; g[i] -= f * g[i - 1]; }
    for (let i = 0; i < n; i++) a[i].vr = 1 / d[i];
    g[n - 1] /= d[n - 1];
    for (let i = n - 2; i >= 0; i--) g[i] = (g[i] - e[i] * g[i + 1]) / d[i];
    for (let i = 0; i < n; i++) { const st = Math.max(-2, Math.min(2, g[i])); a[i].r += st; mx = Math.max(mx, Math.abs(st)); }
    return mx;
  };
  const A = [...N.values()];
  for (let it = 0; it < 40; it++) {
    let mx = 0;
    for (const a of A) mx = Math.max(mx, solve(a));
    if (mx < 2e-3) break;
  }
  const rs = [];
  for (const a of A) for (const x of a) rs.push(x.r);
  rs.sort((u, v) => u - v);
  const ref = rs.length ? rs[Math.floor(.85 * (rs.length - 1))] : 0;
  const rows = [...N].map(([id, a]) => {
    let w = 0, l = 0, d = 0, pk = a[0], v = 0;
    for (const x of a) {
      const g = x.gs[0], s = g.s, pf = 1 / (1 + Math.exp(g.o.r - ref));
      s > .5 ? w++ : s < .5 ? l++ : d++;
      if (x.r > pk.r) pk = x;
      v += (s > .5 ? s * (1 - pf) : s < .5 ? -pf : .5 - pf) * (x.ti ? (x.ip ? 1 + P.tw / 2 : 1 + P.tw) : 1);
    }
    return {id, n:a.length, w, l, d, last:a.at(-1).dt, cur:1500 + U * a.at(-1).r, pk:1500 + U * pk.r, pkd:pk.dt, hs:10 * v, pn:pk, ln:a.at(-1), ...(cnt.get(id) || {cq:0, df:0, iv:0})};
  });
  return {rows, N, tag, rg, RM: new Map(rows.map(x => [x.id, x]))};
}

function getE(d) {
  const k = d + '|' + JSON.stringify(S.P);
  if (!S.cache.has(k)) {
    if (S.cache.size > 20) S.cache.clear();
    S.cache.set(k, whr(scope(d), S.P));
  }
  return S.cache.get(k);
}

/* Divisões de cada lutador: cartel, última luta e cinturões POR categoria.
   A força (WHR) é sempre a da carreira inteira; a divisão só decide quem aparece em cada lista. */
const NONSTD = new Set(['Catch Weight', 'Open Weight', 'Outros']);
function dm() {
  if (S.dmc && S.dmc.n === S.fg.length) return S.dmc.m;
  const m = new Map();
  for (const f of S.fg) {
    if (f.res === 'nc') continue;
    for (const s of ['a', 'b']) {
      const id = mid(f[s].id);
      if (!m.has(id)) m.set(id, new Map());
      const g = m.get(id), x = g.get(f.div) || {n:0, w:0, l:0, d:0, last:'', tw:0};
      g.set(f.div, x); x.n++;
      if (f.date > x.last) x.last = f.date;
      if (f.res === s) { x.w++; if (f.title) x.tw++; } else if (f.res === 'draw') x.d++; else x.l++;
    }
  }
  S.dmc = {n: S.fg.length, m};
  return m;
}
/* divisão atual = a da luta mais recente em categoria oficial; principal = a com mais lutas */
function divOf(id, main) {
  const g = dm().get(id); if (!g) return '';
  let best = '', key = '';
  for (const [d, x] of g) {
    if (NONSTD.has(d)) continue;
    const k = main ? String(x.n).padStart(4, '0') + x.last : x.last;
    if (k > key) { key = k; best = d; }
  }
  return best || [...g.keys()][0];
}
function holdoutAll(P) {
  const k = 'ho|' + JSON.stringify(P);
  if (!S.cache.has(k)) S.cache.set(k, holdout(scope('ALL'), P));
  return S.cache.get(k);
}

function holdout(L, P) {
  if (!L.length) return null;
  const cut = new Date(Date.parse(L.at(-1).date) - 2 * YR).toISOString().slice(0, 10);
  const cur = new Map(whr(L.filter(f => f.date < cut), P).rows.map(x => [x.id, x]));
  let n = 0, ok = 0, ll = 0;
  for (const f of L) {
    if (f.date < cut || f.res === 'draw') continue;
    const A = cur.get(mid(f.a.id)), B = cur.get(mid(f.b.id));
    if (!A || !B || A.n < 3 || B.n < 3) continue;
    const p = 1 / (1 + Math.exp(-(A.cur - B.cur) / U)), pw = f.res === 'a' ? p : 1 - p;
    n++; ok += pw > .5; ll -= Math.log(Math.max(pw, 1e-6));
  }
  return {n, ok, ll, cut};
}

/* ---------- Fight statistics ---------- */
const num = v => parseFloat(String(v ?? '').split(' of ')[0]) || 0;
const att = v => { const m = String(v ?? '').match(/of (\d+)/); return m ? +m[1] : 0; };
const secs = v => { const m = String(v ?? '').match(/^(\d+):(\d+)$/); return m ? +m[1] * 60 + +m[2] : 0; };
const mins = f => { const r = parseInt(f.round) || 0, m = String(f.time || '').match(/^(\d+):(\d+)$/); return r && m ? (r - 1) * 5 + +m[1] + +m[2] / 60 : 0; };
const cls = m => /^(ko|tko)/i.test(m) ? 'KO' : /^sub/i.test(m) ? 'SUB' : /decision/i.test(m) ? 'DEC' : 'OTH';
const KS = ['KO', 'SUB', 'DEC', 'OTH'];
const SIGK = ['Head', 'Body', 'Leg', 'Distance', 'Clinch', 'Ground'];
const blank = () => ({sg:{Head:0,Body:0,Leg:0,Distance:0,Clinch:0,Ground:0}, sgo:{Head:0,Body:0,Leg:0,Distance:0,Clinch:0,Ground:0}, n:0, min:0, sl:0, sa:0, al:0, aa:0, tdl:0, tda:0, tdo:0, tdoa:0, sub:0, kd:0, kdo:0, ct:0, cto:0, w:0, l:0, W:{KO:0,SUB:0,DEC:0,OTH:0}, Ls:{KO:0,SUB:0,DEC:0,OTH:0}});

function agg(id, mode) {
  let fs = S.fg.filter(f => f.res !== 'nc' && (mid(f.a.id) === id || mid(f.b.id) === id)).sort((x, y) => x.date < y.date ? -1 : 1);
  if (mode === 'cur') fs = fs.slice(-6);
  const o = blank(); o.n = fs.length;
  for (const f of fs) {
    const me = mid(f.a.id) === id ? 'a' : 'b', op = me === 'a' ? 'b' : 'a', m = mins(f);
    if (f.totals && m) {
      const A = f.totals[me], B = f.totals[op];
      o.min += m;
      o.sl += num(A['Sig. str.']); o.sa += att(A['Sig. str.']);
      o.al += num(B['Sig. str.']); o.aa += att(B['Sig. str.']);
      o.tdl += num(A.Td); o.tda += att(A.Td);
      o.tdo += num(B.Td); o.tdoa += att(B.Td);
      o.sub += num(A['Sub. att']);
      o.kd += num(A.KD); o.kdo += num(B.KD);
      o.ct += secs(A.Ctrl); o.cto += secs(B.Ctrl);
    }
    if (f.sig && f.sig[me] && f.sig[op]) for (const k of SIGK) { o.sg[k] += num(f.sig[me][k]); o.sgo[k] += num(f.sig[op][k]); }
    if (f.res !== 'draw') {
      const won = f.res === me;
      (won ? o.W : o.Ls)[cls(f.method)]++;
      won ? o.w++ : o.l++;
    }
  }

}

function league() {
  if (S.lg) return S.lg;
  const o = {min:0, sl:0, sa:0, tdl:0, tda:0, sub:0, kd:0, ct:0, W:{KO:0,SUB:0,DEC:0,OTH:0}, w:0};
  for (const f of S.fg) {
    if (f.res === 'draw' || f.res === 'nc') continue;
    const m = mins(f);
    if (f.totals && m) {
      o.min += 2 * m;
      for (const s of 'ab') {
        const A = f.totals[s];
        o.sl += num(A['Sig. str.']); o.sa += att(A['Sig. str.']);
        o.tdl += num(A.Td); o.tda += att(A.Td);
        o.sub += num(A['Sub. att']); o.kd += num(A.KD); o.ct += secs(A.Ctrl);
      }
    }
    o.W[cls(f.method)]++; o.w++;
  }
  return S.lg = o;
}

function rates(o, G) {
  if (!G.min || !G.sa) return null;
  const k = 20, m = o.min, pm = (x, g) => (x + g * k) / (m + k);
  const gs = G.sl / G.min, gt = G.tdl / G.min, pa = G.sl / G.sa, ta = G.tdl / Math.max(G.tda, 1), gc = G.ct / 60 / G.min, gf = (G.W.KO + G.W.SUB) / Math.max(G.w, 1);
  return {
    sl: pm(o.sl, gs), ab: pm(o.al, gs),
    acc: (o.sl + pa * 40) / (o.sa + 40), def: 1 - (o.al + pa * 40) / (o.aa + 40),
    td: 15 * pm(o.tdl, gt), tdab: 15 * pm(o.tdo, gt),
    tdacc: (o.tdl + ta * 5) / (o.tda + 5), tddef: 1 - (o.tdo + ta * 5) / (o.tdoa + 5),
    sub: 15 * pm(o.sub, G.sub / G.min), kd: 15 * pm(o.kd, G.kd / G.min), kda: 15 * pm(o.kdo, G.kd / G.min),
    ctl: pm(o.ct / 60, gc), cta: pm(o.cto / 60, gc),
    fin: (o.W.KO + o.W.SUB + gf * 3) / (o.w + 3), gs, gt15: 15 * gt, gc
  };
}

function meth(att, def, G) {
  const tot = KS.reduce((s, k) => s + G.W[k], 0) || 1;
  const sh = Object.fromEntries(KS.map(k => [k, (G.W[k] + 1) / (tot + 4)]));
  const v = Object.fromEntries(KS.map(k => [k, ((att.W[k] + 5 * sh[k]) / (att.w + 5)) * ((def.Ls[k] + 5 * sh[k]) / (def.l + 5)) / sh[k]]));
  const z = KS.reduce((s, k) => s + v[k], 0);
  return Object.fromEntries(KS.map(k => [k, v[k] / z]));
}

/* ---------- Pre-fight stats model ---------- */
const FN = [
  ['Elo rating', 'Nota Elo'],
  ['Experience (log fights)', 'Experiência (log de lutas)'],
  ['Age', 'Idade'],
  ['Reach', 'Envergadura'],
  ['Height', 'Altura'],
  ['Southpaw', 'Canhoto'],
  ['Layoff (years)', 'Tempo parado (anos)'],
  ['Recent form (last 3)', 'Forma recente (últimas 3)'],
  ['Strike differential / min', 'Diferencial de golpes / min'],
  ['Takedowns / 15 min', 'Quedas / 15 min']
];
const inch = s => {
  const m = String(s || '').match(/(\d+)'\s*(\d+)/);
  if (m) return +m[1] * 12 + +m[2];
  const r = String(s || '').match(/(\d+)/);
  return r ? +r[1] : null;
};
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return h & 1; };

function feat(X, id, date) {
  const p = S.F.get(id) || {}, t = Date.parse(date), b = Date.parse(p.DOB), rc = inch(p.Reach), ht = inch(p.Height), k = 20;
  return [
    (X.elo - 1500) / 400, Math.log(1 + X.n), isNaN(b) ? null : (t - b) / YR / 10,
    rc == null ? null : rc / 10, ht == null ? null : ht / 10, /south/i.test(p.STANCE || '') ? 1 : 0,
    X.last ? Math.min(2, (t - X.last) / YR) : null,
    X.rec.length ? X.rec.slice(-3).reduce((s, v) => s + v, 0) / Math.min(3, X.rec.length) : .5,
    (X.sl - X.al) / (X.min + k), 15 * X.td / (X.min + k)

}

function pre() {
  if (S.pf) return S.pf;
  const st = new Map(), rows = [];
  const g = id => st.get(id) || (st.set(id, {elo:1500, n:0, last:0, rec:[], min:0, sl:0, al:0, td:0}), st.get(id));
  const L = S.fg.filter(f => f.res !== 'nc').slice().sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : (y.ord || 0) - (x.ord || 0));
  for (const f of L) {
    const ia = mid(f.a.id), ib = mid(f.b.id);
    if (ia === ib) continue;
    const A = g(ia), B = g(ib), fa = feat(A, ia, f.date), fb = feat(B, ib, f.date);
    if (f.res !== 'draw') {
      const fl = hash(f.id), X = fl ? B : A, Y = fl ? A : B, u = fl ? fb : fa, v = fl ? fa : fb;
      rows.push({x: u.map((a, i) => a == null || v[i] == null ? 0 : a - v[i]), y: (f.res === 'a') !== (fl === 1) ? 1 : 0, date:f.date, nx:X.n, ny:Y.n, ix: fl ? ib : ia, iy: fl ? ia : ib, fid:f.id});
    }
    const s = f.res === 'draw' ? .5 : f.res === 'a' ? 1 : 0, e = 1 / (1 + 10 ** ((B.elo - A.elo) / 400)), m = mins(f), t = Date.parse(f.date);
    A.elo += 28 * (s - e); B.elo -= 28 * (s - e);

      }

function inv(M) {
  const n = M.length, A = M.map((r, i) => [...r, ...Array.from({length:n}, (_, j) => +(i === j))]);
  for (let i = 0; i < n; i++) {
    let p = i;
    for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
    [A[i], A[p]] = [A[p], A[i]];
    const d = A[i][i] || 1e-12;
    for (let j = 0; j < 2 * n; j++) A[i][j] /= d;
    for (let r = 0; r < n; r++) if (r !== i) {
      const f = A[r][i];
      if (f) for (let j = 0; j < 2 * n; j++) A[r][j] -= f * A[i][j];
    }
  }
  return A.map(r => r.slice(n));
}

function fitLR(rows, cols, lam = 1) {
  const k = cols.length, sd = cols.map(c => Math.sqrt(rows.reduce((s, r) => s + r.x[c] ** 2, 0) / rows.length) || 1), b = new Array(k).fill(0);
  let H;
  for (let it = 0; it < 30; it++) {
    const g = new Array(k).fill(0);
    H = Array.from({length:k}, () => new Array(k).fill(0));
    for (const r of rows) {
      const x = cols.map((c, j) => r.x[c] / sd[j]);
      let z = 0;
      for (let j = 0; j < k; j++) z += b[j] * x[j];
      const p = sg(z), w = p * (1 - p);
      for (let j = 0; j < k; j++) {
        g[j] += (r.y - p) * x[j];
        for (let l = 0; l < k; l++) H[j][l] += w * x[j] * x[l];
      }
    }
    for (let j = 0; j < k; j++) { g[j] -= lam * b[j]; H[j][j] += lam; }
    const Hi = inv(H);
    let mx = 0;
    for (let j = 0; j < k; j++) {
      let d = 0;
      for (let l = 0; l < k; l++) d += Hi[j][l] * g[l];
      b[j] += d; mx = Math.max(mx, Math.abs(d));
    }
    if (mx < 1e-6) break;
  }
  const Hi = inv(H);
  return {b, sd, cols, se: b.map((_, j) => Math.sqrt(Math.max(Hi[j][j], 0)))};
}

const predLR = (m, r) => sg(m.cols.reduce((z, c, j) => z + m.b[j] * r.x[c] / m.sd[j], 0));
const evl = (ps, ys) => {
  let ok = 0, ll = 0, br = 0;
  ps.forEach((p, i) => {
    const y = ys[i];
    ok += (p > .5) === (y === 1);
    ll -= Math.log(Math.max(y ? p : 1 - p, 1e-6));
    br += (p - y) ** 2;

  return {acc: ok / ps.length, ll: ll / ps.length, br: br / ps.length};
};

function lab() {
  const key = JSON.stringify(S.P) + S.fg.length;

const MM = {fin: false, a: '', b: '', G: {}};

    if (onlyFin && !/^(ko|tko|sub)/i.test(f.method || '')) continue;
    const w = mid((f.res === 'a' ? f.a : f.b).id), l = mid((f.res === 'a' ? f.b : f.a).id);

    if (!old || f.date > old.date) m.set(l, f);        /* várias lutas do mesmo par: vale a mais recente */
  }

}

/* Ranking oficial do UFC x nota WHR */
function urkRows() {
  const U = S.urk; if (!U || !U.divisions) return null;
  const E = getE('ALL'), cut = new Date(Date.now() - 2.5 * YR).toISOString().slice(0, 10), last = new Map();
  for (const f of S.fg) for (const q of 'ab') { const id = mid(f[q].id), d = last.get(id); if (!d || f.date >= d.date) last.set(id, {date: f.date, div: divKey(f.div)}); }
  const pools = new Map();
  for (const x of E.rows) { const l = last.get(x.id); if (!l || l.date < cut) continue; let a = pools.get(l.div); if (!a) pools.set(l.div, a = []); a.push(x); }
  pools.forEach(a => a.sort((p, q) => q.cur - p.cur));
  const rows = [];
  for (const [dn, d] of Object.entries(U.divisions)) {
    if (/pound/i.test(dn)) continue;
    const pool = pools.get(divKey(dn)) || [], pos = new Map(pool.map((x, i) => [x.id, i + 1])), off = new Map();
    if (d.champ) off.set(d.champ, 0); for (const [id, r] of Object.entries(d.ranks || {})) off.set(id, r);
    for (const [id, r] of off) {
      const x = E.RM.get(id), wp = pos.get(id) ?? null, o = r === 0 ? 1 : r;
      let status = '';
      if (wp != null && r >= 1 && r <= 10 && wp >= Math.max(15, r + 10)) status = 'over';
      else if (wp != null && r >= 11 && wp <= 10) status = 'under';
      else if (wp != null && r >= 1 && wp <= 5 && r - wp >= 5) status = 'under';
      rows.push({id, div: dn, off: r, wp, gap: wp == null ? null : wp - o, cur: x ? Math.round(x.cur) : null, last: x ? x.last : '', status, pool: pool.length});
    }
    pool.slice(0, 10).forEach((x, i) => { if (!off.has(x.id)) rows.push({id: x.id, div: dn, off: null, wp: i + 1, gap: null, cur: Math.round(x.cur), last: x.last, status: 'under', pool: pool.length}); });
  }
  return rows;
}
function urkPanel() {
  const rows = urkRows(), nm_ = id => (S.F.get(id) || {}).name || id, lbl = r => r.off === 0 ? '👑 C' : r.off == null ? 'NR' : '#' + r.off;
  if (!rows) return `<h2>${T('Official UFC ranking vs the math', 'Ranking oficial UFC vs. Matemática')}</h2><div class="card" style="padding:.8rem 1.1rem"><p class="mu">${T('data/ufc_rankings.json not found (the scraper generates it from the ESPN rankings).', 'data/ufc_rankings.json não encontrado (o scraper gera a partir do ranking da ESPN).')}</p></div>`;
  const both = rows.filter(r => r.off != null && r.wp != null), n = both.length;
  const mx = both.reduce((a, r) => a + (r.off === 0 ? 1 : r.off), 0) / (n || 1), my = both.reduce((a, r) => a + r.wp, 0) / (n || 1);
  let sxy = 0, sxx = 0, syy = 0; both.forEach(r => { const x = (r.off === 0 ? 1 : r.off) - mx, y = r.wp - my; sxy += x * y; sxx += x * x; syy += y * y; });
  const rho = sxx && syy ? sxy / Math.sqrt(sxx * syy) : 0;
  const under = rows.filter(r => r.status === 'under').sort((a, b) => (a.wp - (a.off ?? 16)) - (b.wp - (b.off ?? 16))), over = rows.filter(r => r.status === 'over').sort((a, b) => b.gap - a.gap);
  XEXP.reg('lab:ufc-vs-whr', () => ({kind: 'table', title: T('Official UFC ranking vs WHR', 'Ranking oficial UFC vs. WHR'), file: 'ranking-ufc-vs-whr', sub: `${T('Position inside the division among fighters active in the last 2.5 years', 'Posição dentro da divisão entre os ativos nos últimos 2,5 anos')} · ${T('correlation', 'correlação')} ${rho.toFixed(2)} (n=${n})`,
    cols: [T('Fighter', 'Lutador'), T('Division', 'Divisão'), T('Official', 'Oficial'), T('WHR position', 'Posição WHR'), T('Gap (WHR − official)', 'Diferença (WHR − oficial)'), T('WHR rating', 'Nota WHR'), T('Last fight', 'Última luta'), T('Verdict', 'Veredito')],
    rows: rows.map(r => [nm_(r.id), r.div, lbl(r), r.wp ?? '—', r.gap ?? '—', r.cur ?? '—', r.last || '—', r.status === 'under' ? T('Underrated', 'Subestimado') : r.status === 'over' ? T('Overrated', 'Superestimado') : ''])}));
  const tab = (list, k) => list.length ? `<div style="overflow-x:auto"><div class="tb hd" style="min-width:30rem;grid-template-columns:1.6fr 1.2fr .6fr .6fr .6fr .7fr"><span>${T('Fighter', 'Lutador')}</span><span>${T('Division', 'Divisão')}</span><span>${T('Official', 'Oficial')}</span><span>WHR</span><span>${T('Gap', 'Dif.')}</span><span>${T('Rating', 'Nota')}</span></div>
    ${list.slice(0, 12).map(r => `<div class="tb" style="min-width:30rem;grid-template-columns:1.6fr 1.2fr .6fr .6fr .6fr .7fr"><span><a href="#/fighter/${r.id}">${esc(nm_(r.id))}</a></span><span>${esc(r.div)}</span><b>${lbl(r)}</b><span>#${r.wp}</span><span class="${k === 'over' ? 'dn' : 'up'}">${r.gap == null ? '—' : (r.gap > 0 ? '+' : '') + r.gap}</span><span>${r.cur ?? '—'}</span></div>`).join('')}</div>` : `<p class="mu sm">${T('None found.', 'Nenhum encontrado.')}</p>`;
  return `<h2>${T('Official UFC ranking vs the math', 'Ranking oficial UFC vs. Matemática')}<span class="xbar" data-xk="lab:ufc-vs-whr"></span></h2><div class="card" style="padding:.8rem 1.1rem">
  <p class="mu sm" style="margin-top:0">${T(`${n} ranked fighters compared; agreement between the official order and the WHR order: r = ${rho.toFixed(2)}.`, `${n} lutadores ranqueados comparados; concordância entre a ordem oficial e a ordem do WHR: r = ${rho.toFixed(2)}.`)}</p>
  <p style="margin:.4rem 0 .2rem"><b>${T('Underrated (dark horses)', 'Subestimados (dark horses)')}</b> <span class="mu sm">${T('unranked or ranked 11–15 but already top 10 by WHR, or top 5 by WHR at least 5 places above their official rank', 'sem ranking ou no 11–15, mas já Top 10 pelo WHR, ou Top 5 pelo WHR com 5+ posições acima do ranking oficial')}</span></p>${tab(under, 'under')}
  <p style="margin:.8rem 0 .2rem"><b>${T('Overrated', 'Superestimados')}</b> <span class="mu sm">${T('official top 10 but at least 10 places lower by WHR (and below 15th)', 'Top 10 oficial, mas 10+ posições abaixo pelo WHR (e além da 15ª)')}</span></p>${tab(over, 'over')}
  <p class="mu sm">${T('The WHR position counts only fighters whose latest fight was in this division in the last 2.5 years. A large gap is a question, not a verdict: rankings also weigh style, activity and the voters’ opinion.', 'A posição no WHR conta só lutadores cuja última luta foi nesta divisão nos últimos 2,5 anos. Uma diferença grande é uma pergunta, não um veredito: o ranking também pesa estilo, atividade e a opinião dos votantes.')}</p></div>`;
}

  };
  let h = '';

function spark(h) {

  const W = 600, Hh = 130, v = h.map(x => x.a), lo = Math.min(...v), hi = Math.max(...v);
  const X = i => i / (h.length - 1) * W, Y = y => Hh - 5 - (y - lo) / (hi - lo || 1) * (Hh - 10);
  const svg = `<svg class="sp" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img"><polyline points="${h.map((x, i) => `${X(i)},${Y(x.a)}`).join(' ')}" fill="none" stroke="var(--gd)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
  const dots = h.map((x, i) => x.t ? `<button type="button" class="spd" style="left:${(X(i) / W * 100).toFixed(2)}%;top:${(Y(x.a) / Hh * 100).toFixed(2)}%" data-t="${esc(x.t)}" aria-label="${esc(x.t)}" onclick="spI(this)" onmouseenter="spI(this)" onfocus="spI(this)"></button>` : '').join('');

function fighterPack(id) {

  }
  const rv = rd.map(r => r.n >= 3 ? r.l / r.n : null), mx = Math.max(...rv.filter(v => v != null), 1), t1 = tg.Head + tg.Body + tg.Leg, t2 = tg.Distance + tg.Clinch + tg.Ground;

/* ---------- Fight simulator ---------- */
function rt(id, E, mode) {
  const x = E.RM.get(id); if (!x) return null;
  if (mode === 'peak') return {mu: x.pn.r, v: x.pn.vr, x};
  return {mu: x.ln.r, v: x.ln.vr + (S.P.vol / U) ** 2 * Math.max(0, Date.now() / YR - x.ln.t), x};
}
const sg = z => 1 / (1 + Math.exp(-z)), pc = x => (x * 100).toFixed(1) + '%', f1 = x => x.toFixed(2);
const sr = (l, a, b, x, y) => `<div class="sr"><span style="color:var(--gd)">${a}</span><span class="lb">${l}</span><span style="color:var(--cb)">${b}</span>${x != null ? `<div class="bar"><i style="--w:${x / ((x + y) || 1) * 100}%;--c:var(--gd)"></i><i style="--w:${y / ((x + y) || 1) * 100}%;--c:var(--cb)"></i></div>` : ''}</div>`;

function pick(q, s) {
  const id = q[s], p = S.F.get(id);
  return `<div class="card" style="padding:.8rem 1rem"><div class="mu sm">${s === 'a' ? T('Fighter A', 'Lutador A') : T('Fighter B', 'Lutador B')}</div>${p ? `<div class="sel">${av(id, p.name, 'sm')}<b>${esc(p.name)}</b>${ubadge(id)}<span class="mu sm">${esc(p.record)}</span><button data-clr="${s}">×</button></div>` : `<input data-q="${s}" type="search" placeholder="${T('Search a fighter…', 'Buscar lutador…')}"><div class="res" id="r${s}"></div>`}</div>`;
}


/* ---------- Assinatura de alvo e posição (a partir de f.sig) ---------- */
const ATL = () => [T('Striking', 'Trocação'), T('Defense', 'Defesa'), T('Wrestling', 'Luta agarrada'), T('Submissions', 'Finalizações'), T('Power', 'Pegada'), T('Cardio', 'Cardio')];
function sigShares(o) {
  const t1 = o.sg.Head + o.sg.Body + o.sg.Leg, t2 = o.sg.Distance + o.sg.Clinch + o.sg.Ground;
  return {t1, t2, tg: ['Head', 'Body', 'Leg'].map(k => t1 ? o.sg[k] / t1 : 0), ps: ['Distance', 'Clinch', 'Ground'].map(k => t2 ? o.sg[k] / t2 : 0)};
}
function sigAlerts(o) {
  const s = sigShares(o), out = [];
  if (s.t1 >= 60 && s.tg[2] >= .22) out.push(T('Low-kick specialist', 'Especialista em chutes baixos'));
  if (s.t1 >= 60 && s.tg[1] >= .22) out.push(T('Body-line hunter', 'Caçador de linha de cintura'));
  if (s.t2 >= 60 && s.ps[2] >= .25) out.push(T('Strong ground & pound', 'Forte Ground & Pound'));
  return out;
}
function sigRows(oa, ob, src) {
  const a = sigShares(src ? {sg: oa[src]} : oa), b = sigShares(src ? {sg: ob[src]} : ob), L = [T('Head', 'Cabeça'), T('Body', 'Corpo'), T('Leg', 'Perna'), T('Distance', 'Distância'), 'Clinch', T('Ground', 'Solo')];
  const va = [...a.tg, ...a.ps], vb = [...b.tg, ...b.ps];
  return L.map((l, i) => sr(l, pc(va[i]), pc(vb[i]), va[i], vb[i])).join('');
}
function sigHtml(oa, ob, A, B) {
  const a = sigShares(oa), b = sigShares(ob);
  if (a.t1 < 60 && b.t1 < 60) return '';
  const al = (o, p) => { const x = sigAlerts(o); return `<p style="margin:.3rem 0"><b>${esc(p.name)}</b>: ${x.length ? x.map(t => `<span class="tag">${t}</span>`).join(' ') : `<span class="mu">${T('no standout target or position tendency', 'sem tendência de alvo ou posição que se destaque')}</span>`}</p>`; };
  return `<h2>${T('Target & position signature', 'Assinatura de alvo e posição')}</h2><div class="card" style="padding:.8rem 1.1rem">${sigRows(oa, ob)}
  ${al(oa, A)}${al(ob, B)}<p class="mu sm">${T('Share of significant strikes landed, by target (head, body, leg) and by position (distance, clinch, ground). Alerts: legs or body from 22%, ground from 25%, with 60+ strikes on record.', 'Fração dos golpes significativos acertados, por alvo (cabeça, corpo, perna) e por posição (distância, clinch, solo). Alertas: perna ou corpo a partir de 22%, solo a partir de 25%, com 60+ golpes registrados.')}</p>
  <details><summary>${T('What they absorb', 'O que eles absorvem')}</summary>${sigRows(oa, ob, 'sgo')}</details></div>`;
}

function simOut(q) {
  const A = S.F.get(q.a), B = S.F.get(q.b);
  if (!A || !B) return `<p class="empty">${T('Pick two fighters to simulate.', 'Escolha dois lutadores para simular.')}</p>`;
  if (q.a === q.b) return `<p class="empty">${T('Pick two different fighters.', 'Escolha dois lutadores diferentes.')}</p>`;
  const E = getE(q.d), ra = rt(q.a, E, q.m), rb = rt(q.b, E, q.m);
  if (!ra || !rb) return `<p class="empty">${T('At least one fighter has no rating in this scope. Try "General".', 'Pelo menos um lutador não tem nota neste escopo. Tente "Geral".')}</p>`;
  const s2 = ra.v + rb.v, dm = ra.mu - rb.mu, p = sg(dm / Math.sqrt(1 + Math.PI * s2 / 8)), lo = sg(dm - 1.645 * Math.sqrt(s2)), hi = sg(dm + 1.645 * Math.sqrt(s2));
  const G = league(), oa = agg(q.a, q.m), ob = agg(q.b, q.m), xa = rates(oa, G), xb = rates(ob, G), el = r => Math.round(1500 + U * r.mu), sd = r => Math.round(U * Math.sqrt(r.v));
  const da = mainDiv(q.a), db = mainDiv(q.b), age = d => { const t = Date.parse(d); return t ? ((Date.now() - t) / YR).toFixed(1) : '-'; };
  let h = `<h2>${T('Win probability', 'Probabilidade de vitória')}</h2><div class="card" style="padding:1rem 1.1rem"><div class="pb"><i style="flex:${p};background:var(--gd)">${pc(p)}</i><i style="flex:${1 - p};background:var(--cb)">${pc(1 - p)}</i></div>
  <div class="sr"><span style="color:var(--gd)">${esc(A.name)}${ubadge(q.a)}</span><span></span><span style="color:var(--cb)">${esc(B.name)}${ubadge(q.b)}</span></div>
  <p class="mu sm">${T('90% interval for A', 'Intervalo de 90% para A')}: ${pc(lo)} – ${pc(hi)}. ${T('Ratings', 'Notas')}: ${el(ra)} ± ${sd(ra)} ${T('vs', 'vs')} ${el(rb)} ± ${sd(rb)} (${q.m === 'peak' ? T('career peak', 'pico da carreira') : T('current form, with uncertainty growing while inactive', 'momento atual, com incerteza crescendo na inatividade')}).${da !== db ? ` ${T('Different main divisions: the rating comparison is indirect.', 'Divisões principais diferentes: a comparação de notas é indireta.')}` : ''}</p></div>
  <h2>${T('Tale of the tape', 'Comparativo')}</h2><div class="card" style="padding:.8rem 1.1rem">${sr(T('Record', 'Cartel'), esc(A.record), esc(B.record))}${sr(T('Height', 'Altura'), esc(A.Height || '-'), esc(B.Height || '-'))}${sr(T('Reach', 'Envergadura'), esc(A.Reach || '-'), esc(B.Reach || '-'))}${sr(T('Stance', 'Base'), esc(A.STANCE || '-'), esc(B.STANCE || '-'))}${sr(T('Age', 'Idade'), age(A.DOB), age(B.DOB))}${tapeExtra(A, B)}${sr(T('Main division', 'Divisão principal'), esc(da), esc(db))}${sr(T('Fights used', 'Lutas usadas'), oa.n, ob.n)}</div>`;
  S.simLast = {A, B, p, lo, hi, m: q.m};
  h += `<div class="acts" style="margin-top:.6rem"><button id="shr">${T('Share card', 'Cartão para compartilhar')}</button><a class="btn" href="#/xray/${q.a}/${q.b}">${T('Open in X-Ray', 'Abrir no Raio-X')}</a></div>`;
  h += models(q, p); h += h2hHtml(q);
  if (!xa || !xb) return h + `<p class="empty">${T('Not enough fight stats in the database.', 'Sem estatísticas de luta suficientes na base.')}</p>`;
  h += `<h2>${T('Striking and grappling profile', 'Perfil de trocação e solo')}</h2><div class="card" style="padding:.8rem 1.1rem">
  ${sr(T('Sig. strikes landed / min', 'Golpes sig. acertados / min'), f1(xa.sl), f1(xb.sl), xa.sl, xb.sl)}${sr(T('Sig. strikes absorbed / min', 'Golpes sig. recebidos / min'), f1(xa.ab), f1(xb.ab), xa.ab, xb.ab)}
  ${sr(T('Striking accuracy', 'Precisão de golpes'), pc(xa.acc), pc(xb.acc), xa.acc, xb.acc)}${sr(T('Striking defense', 'Defesa de golpes'), pc(xa.def), pc(xb.def), xa.def, xb.def)}
  ${sr(T('Takedowns / 15 min', 'Quedas / 15 min'), f1(xa.td), f1(xb.td), xa.td, xb.td)}${sr(T('Takedown accuracy', 'Precisão de quedas'), pc(xa.tdacc), pc(xb.tdacc), xa.tdacc, xb.tdacc)}${sr(T('Takedown defense', 'Defesa de quedas'), pc(xa.tddef), pc(xb.tddef), xa.tddef, xb.tddef)}
  ${sr(T('Submission attempts / 15 min', 'Finalizações tentadas / 15 min'), f1(xa.sub), f1(xb.sub), xa.sub, xb.sub)}${sr(T('Knockdowns / 15 min', 'Knockdowns / 15 min'), f1(xa.kd), f1(xb.kd), xa.kd, xb.kd)}
  ${sr(T('Control time share', 'Fração de controle'), pc(xa.ctl), pc(xb.ctl), xa.ctl, xb.ctl)}${sr(T('Finish rate in wins', 'Taxa de finalização nas vitórias'), pc(xa.fin), pc(xb.fin), xa.fin, xb.fin)}</div>`;
  h += sigHtml(oa, ob, A, B);
  const gk = 15 * Math.max(G.kd, 1) / G.min;
  const pj = (x, y) => ({sl: 15 * x.sl * (y.ab / x.gs), td: x.td * (y.tdab / x.gt15), kd: x.kd * (y.kda / gk), ctl: Math.min(.95, x.ctl * (y.cta / x.gc))});
  const ja = pj(xa, xb), jb = pj(xb, xa);

  ${sr(T('Sig. strikes landed', 'Golpes sig. acertados'), f1(ja.sl), f1(jb.sl), ja.sl, jb.sl)}${sr(T('Takedowns', 'Quedas'), f1(ja.td), f1(jb.td), ja.td, jb.td)}${sr(T('Knockdowns', 'Knockdowns'), f1(ja.kd), f1(jb.kd), ja.kd, jb.kd)}${sr(T('Control time share', 'Fração de controle'), pc(ja.ctl), pc(jb.ctl), ja.ctl, jb.ctl)}</div>`;
  const ma = meth(oa, ob, G), mb = meth(ob, oa, G), nm = {KO:'KO/TKO', SUB:T('Submission', 'Finalização'), DEC:T('Decision', 'Decisão'), OTH:T('Other', 'Outro')};
  h += `<h2>${T('How it ends', 'Como termina')}</h2><div class="card" style="padding:.8rem 1.1rem">${KS.filter(k => k !== 'OTH').map(k => sr(nm[k], pc(p * ma[k]), pc((1 - p) * mb[k]), p * ma[k], (1 - p) * mb[k])).join('')}
  <p class="mu sm">${T('Goes the distance', 'Vai para a decisão')}: ${pc(p * ma.DEC + (1 - p) * mb.DEC)}.</p></div>
  <details class="card"><summary>${T('Method', 'Método')}</summary><p>${T('Win probability comes from the rating model (WHR) with uncertainty. Method probabilities combine how each fighter wins with how the opponent loses (naive Bayes, smoothed toward the UFC average).', 'A probabilidade vem do modelo de notas (WHR) com incerteza. As chances por método combinam como cada lutador vence com como o rival perde (Bayes ingênuo, suavizado para a média do UFC).')}</p></details>`;
  return h;
}

function mainDiv(id) {
  const c = {};
  for (const f of S.fg) if (mid(f.a.id) === id || mid(f.b.id) === id) c[f.div] = (c[f.div] || 0) + 1;
  return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || '-';
}

function vSim(a, b) {
  const q = S.sim; if (a) q.a = mid(a); if (b) q.b = mid(b);
  const divs = [...new Set(S.fg.map(f => f.div))].sort();
  M(`<h1>${T('Simulator', 'Simulador')}</h1><div class="ctl"><label>${T('Mode', 'Modo')}<select id="sm"><option value="cur">${T('Current form (now)', 'Momento atual')}</option><option value="peak">${T('Career peak (all-time)', 'Pico da carreira (histórico)')}</option></select></label>
  <label>${T('Rating scope', 'Escopo da nota')}<select id="sd"><option value="ALL">${T('General (all fights)', 'Geral (todas as lutas)')}</option>${divs.map(d => `<option>${esc(d)}</option>`).join('')}</select></label></div>${pick(q, 'a')}<div class="acts" style="justify-content:center;margin:.2rem 0"><button id="swp" type="button">⇄ ${T('Swap A / B', 'Inverter A / B')}</button></div>${pick(q, 'b')}<div id="out"></div>`);
  $('#sm').value = q.m; $('#sd').value = q.d;
  $('#sm').onchange = e => { q.m = e.target.value; vSim(); };
  $('#sd').onchange = e => { q.d = e.target.value; vSim(); };
  $('#swp').onclick = () => { const t = q.a; q.a = q.b; q.b = t; vSim(); };
  $('#out').innerHTML = simOut(q);
  const sb = $('#shr'); if (sb) sb.onclick = shareCard;
  $('#m').oninput = e => {
    const i = e.target.closest('[data-q]'); if (!i) return;
    const s = i.dataset.q, t = i.value.toLowerCase().trim();
    $('#r' + s).innerHTML = t ? [...S.F.values()].filter(f => (f.name + ' ' + f.nick).toLowerCase().includes(t)).slice(0, 6).map(f => `<button data-pk="${s}:${f.id}"><span>${esc(f.name)}</span><span class="mu">${esc(f.record)}</span></button>`).join('') : '';
  };
  $('#m').onclick = e => {
    const k = e.target.closest('[data-pk]'), c = e.target.closest('[data-clr]');
    if (k) { const [s, id] = k.dataset.pk.split(':'); q[s] = id; vSim(); }
    else if (c) { q[c.dataset.clr] = ''; vSim(); }
  };
}

const NM = {
  'Coin flip': ['Coin flip', 'Cara ou coroa'],
  Elo: ['Elo (updates every fight)', 'Elo (atualiza a cada luta)'],
  WHR: ['WHR (refit every 6 months)', 'WHR (reajustado a cada 6 meses)'],
  Stats: ['Elo + stats model', 'Elo + modelo de estatísticas'],

function models(q, p) {
  if (q.m !== 'cur') return `<p class="mu sm">${T('The stats model is available in "Current form" mode.', 'O modelo de estatísticas está disponível no modo "Momento atual".')}</p>`;
  const R = lab(); if (!R || R.none) return '';
  const st = pre().st, a = st.get(q.a), b = st.get(q.b); if (!a || !b) return '';
  const today = new Date().toISOString().slice(0, 10), fa = feat(a, q.a, today), fb = feat(b, q.b, today);
  const xx = fa.map((v, i) => v == null || fb[i] == null ? 0 : v - fb[i]);

function analysis(id) {
  const fs = S.fg.filter(f => f.res !== 'nc' && (mid(f.a.id) === id || mid(f.b.id) === id)), o = agg(id, 'all');
  const rd = [0, 1, 2, 3, 4].map(() => ({l:0, a:0, n:0})), tg = {Head:0, Body:0, Leg:0, Distance:0, Clinch:0, Ground:0};
  for (const f of fs) {
    const me = mid(f.a.id) === id ? 'a' : 'b', op = me === 'a' ? 'b' : 'a', full = /decision/i.test(f.method || ''), last = parseInt(f.round) || 0;
    (f.rounds?.totals || []).forEach((r, i) => {
      if (i < 5 && r[me] && (full || i + 1 < last)) { rd[i].l += num(r[me]['Sig. str.']); rd[i].a += num(r[op]?.['Sig. str.']); rd[i].n++; }
    });

  }
  if (o.min < 15) return `<p class="mu sm">${T('Not enough fight stats yet.', 'Ainda não há estatísticas suficientes.')}</p>`;
  const ln = (l, v, fr) => `<div class="sr" style="grid-template-columns:9.5rem 1fr auto;align-items:center"><span class="mu">${l}</span><i class="mb" style="margin:0"><b style="width:${Math.max(0, Math.min(1, fr)) * 100}%"></b></i><span>${v}</span></div>`;
  const rv = rd.map(r => r.n >= 3 ? r.l / r.n : null), mx = Math.max(...rv.filter(v => v != null), 1), ch = rv[0] && rv[2] != null ? (rv[2] - rv[0]) / rv[0] : null;
  const t1 = tg.Head + tg.Body + tg.Leg || 1, t2 = tg.Distance + tg.Clinch + tg.Ground || 1, sl = o.sl, al = o.al, py = sl * sl / ((sl * sl + al * al) || 1), ac = o.w / ((o.w + o.l) || 1), lw = o.l || 1;
  return `<div class="card" style="padding:.8rem 1.1rem"><b>${T('Cardio: significant strikes landed per round', 'Cardio: golpes significativos acertados por round')}</b>
  ${rv.map((v, i) => v == null ? '' : ln('R' + (i + 1) + ` (${rd[i].n})`, v.toFixed(1), v / mx)).join('')}${ch != null ? `<p class="mu sm">${T('Round 3 vs round 1', 'Round 3 vs round 1')}: <b class="${ch < 0 ? 'dn' : 'up'}">${ch > 0 ? '+' : ''}${(ch * 100).toFixed(0)}%</b>. ${T('Only completed rounds are counted.', 'Só rounds completos entram na conta.')}</p>` : ''}</div>
  <div class="card" style="padding:.8rem 1.1rem"><b>${T('Striking signature (share of significant strikes landed)', 'Assinatura de golpes (parcela dos golpes significativos acertados)')}</b>
  ${['Head', 'Body', 'Leg', 'Distance', 'Clinch', 'Ground'].map((k, i) => ln(lb(k), ((tg[k] / (i < 3 ? t1 : t2)) * 100).toFixed(0) + '%', tg[k] / (i < 3 ? t1 : t2))).join('')}</div>
  <div class="card" style="padding:.8rem 1.1rem"><b>${T('Durability and results', 'Durabilidade e resultados')}</b>
  ${ln(T('Knockdowns absorbed / 15 min', 'Knockdowns sofridos / 15 min'), (15 * o.kdo / o.min).toFixed(2), 15 * o.kdo / o.min / 1.5)}${ln(T('Losses by KO/TKO', 'Derrotas por KO/TKO'), `${o.Ls.KO} / ${o.l}`, o.Ls.KO / lw)}${ln(T('Wins by KO/TKO', 'Vitórias por KO/TKO'), `${o.W.KO} / ${o.w}`, o.W.KO / (o.w || 1))}${ln(T('Wins by submission', 'Vitórias por finalização'), `${o.W.SUB} / ${o.w}`, o.W.SUB / (o.w || 1))}${ln(T('Wins by decision', 'Vitórias por decisão'), `${o.W.DEC} / ${o.w}`, o.W.DEC / (o.w || 1))}
  <p class="mu sm">${T('Pythagorean expectation (strikes landed² vs absorbed², an estimate)', 'Expectativa pitagórica (golpes acertados² vs recebidos², uma estimativa)')}: ${(py * 100).toFixed(0)}% ${T('expected vs', 'esperado vs')} ${(ac * 100).toFixed(0)}% ${T('actual win rate', 'de vitórias reais')} → <b class="${ac >= py ? 'up' : 'dn'}">${ac >= py ? T('overperforming', 'acima do esperado') : T('underperforming', 'abaixo do esperado')}</b>.</p></div>`;
}

function labHtml(R) {
  const best = R.best, hd = `<div class="tb hd"><span>${T('Model', 'Modelo')}</span><span>${T('Accuracy', 'Acerto')}</span><span>Log-loss</span><span>Brier</span></div>`;
  const pts = R.bins.filter(b => b.n >= 5).map(b => [b.s / b.n, b.y / b.n, b.n]);
  const cal = `<svg viewBox="0 0 220 220" class="sp" style="height:auto;max-width:320px"><rect x="10" y="10" width="200" height="200" fill="none" stroke="var(--ln)"/><line x1="10" y1="210" x2="210" y2="10" stroke="var(--mu)" stroke-dasharray="4"/><polyline fill="none" stroke="var(--gd)" stroke-width="2" points="${pts.map(p => `${10 + p[0] * 200},${210 - p[1] * 200}`).join(' ')}" />${pts.map(p => `<circle cx="${10 + p[0] * 200}" cy="${210 - p[1] * 200}" r="${3 + Math.min(5, p[2] / 20)}" fill="var(--gd)"/>`).join('')}</svg>`;
  const co = R.mF.b.map((b, j) => ({j, b, lo: Math.exp(b - 2.81 * R.mF.se[j]), hi: Math.exp(b + 2.81 * R.mF.se[j])})).sort((x, y) => Math.abs(y.b) - Math.abs(x.b));

  ${co.map(c => `<div class="tb"><span>${FN[c.j][S.pt ? 1 : 0]}</span><span>${Math.exp(c.b).toFixed(2)}</span><span>${c.lo.toFixed(2)} – ${c.hi.toFixed(2)}</span><span class="${c.lo > 1 ? 'up' : c.hi < 1 ? 'dn' : 'mu'}">${c.lo > 1 ? T('more helps', 'mais ajuda') : c.hi < 1 ? T('more hurts', 'mais atrapalha') : T('no evidence', 'sem evidência')}</span></div>`).join('')}</div>
  <h2>${T('Auto-tune', 'Autoajuste')}</h2><div class="card" style="padding:.8rem 1.1rem"><button id="tb">${T('Run auto-tune', 'Rodar autoajuste')}</button><div id="tn" class="mu sm" style="margin-top:.6rem"></div></div>
  ${extraLab()}`;
}

function tune() {
  const out = $('#tn'), jobs = [40, 60, 80, 110, 150].flatMap(v => [0, .5, 1].map(f => [v, f])), res = [], L = scope('ALL'), keep = {vol: S.P.vol, fin: S.P.fin};
  let i = 0;
  const step = () => {
    if (!$('#tn')) return;
    if (i >= jobs.length) {
      Object.assign(S.P, keep); res.sort((a, b) => a.ll - b.ll); const b = res[0];
      out.innerHTML = res.slice(0, 5).map(r => `<div class="tb${r === b ? ' best' : ''}" style="grid-template-columns:1fr 1fr 1fr"><span>${T('volatility', 'volatilidade')} ${r.v}</span><span>${T('method', 'método')} ${r.f}</span><span>log-loss ${r.ll.toFixed(4)}</span></div>`).join('') + `<button id="ap" style="margin-top:.6rem">${T('Apply the best', 'Aplicar a melhor')} (${b.v}, ${b.f})</button>`;
      $('#ap').onclick = () => { S.P.vol = b.v; S.P.fin = b.f; try { localStorage.sumulaP4 = JSON.stringify(S.P); } catch {} S.cache.clear(); S.lab = null; vLab(); };
      return;
    }
    const [v, f] = jobs[i++]; S.P.vol = v; S.P.fin = f;
    const h = holdout(L, S.P); res.push({v, f, ll: h && h.n ? h.ll / h.n : 9});
    out.textContent = `${i}/${jobs.length}…`; setTimeout(step, 20);

  step();
}

/* ======== EXPORTAÇÃO UNIVERSAL (window.XEXP): PNG, CSV e Copiar para qualquer seção ========

    const lines = []; const seen = new Set();
    nodes.forEach(n => { const q = n.matches && n.matches('p,.card,li') ? [n] : n.querySelectorAll('p,li,.card'); [...q].forEach(e => { if (e.querySelector && e.querySelector('.card') && e !== n) return; const t = txtNoBar(e); if (t && t.length > 2 && !seen.has(t)) { seen.add(t); lines.push(t); } }); });

  }
  function secNodes(h) { const o = []; let n = h.nextElementSibling; while (n && !/^H[12]$/.test(n.tagName)) { o.push(n); n = n.nextElementSibling; } return o; }

      const rows = [...E1.RM.values()].filter(x => E0.RM.has(x.id)).map(x => ({id:x.id, d:x.cur - E0.RM.get(x.id).cur, c0:E0.RM.get(x.id).cur, c1:x.cur, n:x.n}));
      const big = rows.filter(r => r.n >= 3).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 10), rows_ = b => b.map(r => [T('Rating', 'Nota'), nm(r.id), '', Math.round(r.c0), Math.round(r.c1), (r.d >= 0 ? '+' : '') + r.d.toFixed(0)]);
      el.innerHTML = `<h2>${T('Biggest changes in current rating', 'Maiores mudanças na nota atual')}</h2><div class="card" style="padding:.8rem 1.1rem">${big.map(r => `<div class="sr" style="grid-template-columns:1fr auto auto"><a href="#/fighter/${r.id}"><b>${esc(nm(r.id))}</b></a><span class="mu">${Math.round(r.c0)} →${Math.round(r.c1)}</span><b class="${r.d >= 0 ? 'up' : 'dn'}">${r.d >= 0 ? '+' : ''}${r.d.toFixed(0)}</b></div>`).join('')}</div>`;
      el.innerHTML += reignDiff(E0, E1);
      XEXP.reg('tm', () => {
        const R = reignData(E0, E1), per = r => `${r.start.slice(0, 4)}–${r.end ? r.end.slice(0, 4) : T('now', 'hoje')}`, rows = [];
        rows.push(...rows_(big));
        R.chg.forEach(d => rows.push([T('Champion today', 'Campeão hoje'), `${R.c0.get(d) ? nm(R.c0.get(d).id) : T('vacant', 'vago')} → ${R.c1.get(d) ? nm(R.c1.get(d).id) : T('vacant', 'vago')}`, d, '', '', '']));
        R.lost.forEach(r => rows.push([T('Reign disappears', 'Reinado desaparece'), nm(r.id), r.div, per(r), '', `${r.def} ${T('def.', 'def.')}`]));
        R.gain.forEach(r => rows.push([T('New reign', 'Reinado novo'), nm(r.id), r.div, '', per(r), `${r.def} ${T('def.', 'def.')}`]));
        return {kind: 'table', title: T('Time machine: what would change', 'Máquina do Tempo: o que mudaria'), file: 'maquina-do-tempo', sub: `${Z.fl.size} ${T('fights reversed', 'lutas invertidas')} · ${R.chg.length} ${T('champions today change', 'campeões de hoje mudam')} · ${R.lost.length} ${T('reigns disappear', 'reinados desaparecem')} · ${R.gain.length} ${T('new reigns', 'reinados novos')}`,
          cols: [T('Type', 'Tipo'), T('Fighter / change', 'Lutador / mudança'), T('Division', 'Divisão'), T('Before', 'Antes'), T('After', 'Depois'), T('Change', 'Variação')], rows};
      });
    }, 30);
  }

  /* ================= 4) VIRADAS E GRÁFICO AO VIVO ================= */
  function liveChart(f) {
    const v = Z.live && Z.live[f.id]; if (!v || v.length < 2) return '';
    const w = f.res === 'a' ? f.a : f.b, pts = [...v, 1], n = pts.length, W = 320, H = 130, X = i => 26 + i * (W - 52) / (n - 1), Y = p => H - 26 - p * (H - 46), lab = pts.map((_, i) => i === 0 ? T('Pre', 'Antes') : i === n - 1 ? T('Result', 'Final') : 'R' + i);
    return `<div class="card" style="padding:.8rem 1.1rem;margin-bottom:.8rem"><b>${T('Live win probability', 'Probabilidade de vitória ao vivo')}: ${esc(name(w))}</b>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><line x1="26" x2="${W - 26}" y1="${Y(.5)}" y2="${Y(.5)}" stroke="var(--ln)" stroke-dasharray="4"/><polyline points="${pts.map((p, i) => X(i) + ',' + Y(p)).join(' ')}" fill="none" stroke="var(--gd)" stroke-width="2.5"/>${pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p)}" r="4" fill="${i === n - 1 ? 'var(--win)' : 'var(--gd)'}"/><text x="${X(i)}" y="${Math.max(12, Y(p) - 9)}" text-anchor="middle" font-size="10" fill="var(--tx)">${Math.round(p * 100)}%</text><text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--mu)">${lab[i]}</text>`).join('')}</svg></div>`;
  }
  const pxs = window.XS; window.XS = f => (pxs ? pxs(f) : '') + liveChart(f);
  function tCb() {
    if (!Z.cb) return `<p class="empty">${T('live.json not found.', 'live.json não encontrado.')}</p>`;
    const by = fmap();
    return `<h2>${T('Biggest comebacks in UFC history', 'Maiores viradas da história do UFC')}</h2>${Z.cb.slice(0, 25).map(([id, p, r]) => { const f = by.get(id); if (!f) return ''; const w = f.res === 'a' ? f.a : f.b, l = f.res === 'a' ? f.b : f.a; return `<div class="card h" style="grid-template-columns:1fr auto;padding:.6rem 1rem;border-bottom:0"><span><a href="#/event/${f.ev}/${id}"><b>${esc(name(w))}</b></a> ${T('beat', 'venceu')}${esc(name(l))}<br><span class="mu sm">${fmt(f.date)},${esc(f.method)}</span></span><span style="text-align:right"><b class="up">${Math.round(p * 100)}%</b><br><span class="mu sm">${T('after R', 'depois do R')}${r}</span></span></div>`; }).join('')}`;
  }

  function draw() {
    const el = $('#zx'); if (!el) return;
    const tb = (k, l) => `<button data-zt="${k}" class="${Z.tab === k ? 'on' : ''}">${l}</button>`;
    el.innerHTML = `<div class="seg">${tb('cards', 'Cards')}${tb('cross', T('Cross-tabs', 'Cruzador'))}${tb('tm', T('What if?', 'E se?'))}${tb('cb', T('Comebacks', 'Viradas'))}</div>` + ({cross:tCross, cards:tCards, tm:tTm, cb:tCb}[Z.tab])();
    if (Z.tab === 'cross') zres();
    const m = $('#m');
    m.onclick = e => {
      const t = e.target.closest('[data-zt],[data-zp],[data-zc],[data-zimg],[data-ztf],[data-ztc],[data-ztrob],[data-ztsp],#ztr'); if (!t) return;
      const d = t.dataset;
      if (d.zt) { Z.tab = d.zt; draw(); }
      else if (d.zp) { const [s, id] = d.zp.split(':'); Z[s] = id; draw(); scrollTo({top:0, behavior:'smooth'}); }
      else if (d.zc) { Z[d.zc] = ''; draw(); }
      else if (d.zimg) cardImg(d.zimg);
      else if (d.ztf) { Z.fl.has(d.ztf) ? Z.fl.delete(d.ztf) : Z.fl.add(d.ztf); draw(); }
      else if (d.ztc) { Z.fl.clear(); draw(); }
      else if (d.ztrob) zRob();
      else if (d.ztsp) zSplit();
      else if (t.id === 'ztr') tmRun();
    };
    m.oninput = e => {
      const q = e.target.closest('[data-zq]');
      if (q) {
        const [s, only] = q.dataset.zq.split(':'), t = q.value.toLowerCase().trim(), r = $('#zs' + s);
        if (r) r.innerHTML = t ? [...S.F.values()].filter(f => (only === 'c' ? Z.cards && Z.cards[f.id] : true) && (f.name + ' ' + f.nick).toLowerCase().includes(t)).slice(0, 6).map(f => `<button data-zp="${s}:${f.id}"><span>${esc(f.name)}</span><span class="mu">${esc(f.record)}</span></button>`).join('') : '';
        return;
      }
      const ph = e.target.closest('[data-zph]'); if (ph) { if (ph.files[0]) upPhoto(ph.dataset.zph, ph.files[0]); return; }
      const cf = e.target.closest('[data-zcf]'); if (cf) { Z[cf.dataset.zcf] = cf.dataset.zcf === 'csort' ? +cf.value : cf.value; draw(); return; }
      const f = e.target.closest('[data-zf]'); if (!f) return;
      const k = f.dataset.zf, num = ['T', 'from', 'e3'].includes(k); Z[k] = num ? +f.value : f.value;
      if (k === 'v') { Z.T = VARS().find(v => v.k === Z.v).T; Z.side = 'more'; draw(); }
      else if (k === 'met') draw();
      else zres();
    };
  }
  async function vStudio(a) {
    if (a) { Z.a = mid(a); Z.tab = 'cards'; }
    M(`<h1>${T('Studio', 'Estúdio')}</h1><div id="zx"><p class="mu">${T('Loading…', 'Carregando…')}</p></div>`);
    if (window.XLOAD) await window.XLOAD();
    draw();
  }
  const pxt = window.XT; window.XT = () => [...(pxt ? pxt() : []), ['studio', T('Studio', 'Estúdio')]];
  window.XCARD = id => { Z.tab = 'cards'; Z.a = id; if (location.hash === '#/studio') vStudio(); };
  window.XV = {...(window.XV || {}), studio: vStudio};
  const pxp = window.XP; window.XP = id => (pxp ? pxp(id) : '') + (Z.cards && Z.cards[id] ? `<div class="acts"><a class="btn" href="#/studio/${id}">${T('See the card', 'Ver o card')}</a></div>` : '');
})();

init();
</script>
  <script src="sherdog.js"></script>
  <script src="extras.js"></script>
</body>
