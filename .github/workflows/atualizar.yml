
name: Atualizar base UFC

on:
  schedule:
    - cron: "0 9 * * *"   # todos os dias, 9h UTC (só busca o que é novo)
  workflow_dispatch:          # botão "Run workflow" para a carga inicial

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml playwright
      - run: playwright install --with-deps chromium
      - run: python scraper.py --max-minutes 320
      - name: Gerar análises (data/analytics.json)
        run: python analytics.py
        continue-on-error: true   # se falhar, os dados do scraper ainda são salvos
      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "ufc-bot"
          git config user.email "ufc-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Atualiza dados $(date -u +%F)"
          git push
          
      - name: Gerar análises (data/analytics.json)
        run: python analytics.py
        continue-on-error: true   # se falhar, os dados do scraper ainda são salvos
