name: Atualizar base UFC

on:
  schedule:
        - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml playwright
      - run: playwright install --with-deps chromium
      - run: python scraper.py --max-minutes 320
      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "ufc-bot"
          git config user.email "ufc-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Atualiza dados $(date -u +%F)"
          git push
